{t:"نشاط ١",ref:"اقرأ الفقرة الآتية من النص قراءة متأنية، من (يُعدّ احترام حقوق الإنسان حجر الأساس …) إلى (… على حد أدنى مشترك من الحقوق والحريات). ثم أجب عما يأتي:",qs:[
M("المقصود بكلمة «صون» في قول الكاتب: «وجعلت الإنسان موضع صون وتكريم…»:",["رفعة.","حماية.","تقدير.","تعزيز."],1,"«صون» أي حماية."),
M("الفكرة الرئيسة التي يدور حولها النص السابق هي:",["التوازن بين حقوق الإنسان والخصوصية الثقافية.","دور المواثيق الدولية في نشر ثقافة حقوق الإنسان.","أسباب اختلاف الثقافات بين المجتمعات الإنسانية.","أهمية احترام الخصوصية الثقافية للمجتمعات."],0,"الفكرة الرئيسة هي التوازن بين حقوق الإنسان والخصوصية الثقافية."),
M("نوع الخطاب الذي ينتمي إليه النص:",["وصفي","سردي","علمي","حجاجي"],3,"النص يعرض قضية ويدعمها بالحجج، فهو خطاب حجاجي."),
M("أيّ من العبارات الآتية تُشير إلى أن احترام كرامة الإنسان فكرة أصيلة متجذرة في الوجدان البشري عبر العصور؟",["«فجاء الإعلان العالمي لحقوق الإنسان عام ١٩٤٨ ليجسد توافقًا دوليًّا على حد أدنى من الحقوق».","«استمداد القواعد الأخلاقية من التعاليم الروحية والموروث الحضاري الإنساني القديم».","«فالحقوق لا تُمارس في فراغ، بل داخل مجتمع تحكمه نظم وقوانين».","«صون الكرامة الفردية يتحقق من خلال صياغة أطر قانونية وطنية تُراعي الصالح العام»."],1,"العبارة الثانية تربط الكرامة بالتعاليم الروحية والموروث الحضاري القديم.")]},
{t:"نشاط ٢",ref:"يرى الكاتب أن: «تحقيق التوازن بين المبادئ الإنسانية العامة والخصوصيات الثقافية يُمثل السبيل إلى حماية الكرامة الإنسانية والحقوق الأساسية». قيّم قوة هذه الحجة في ضوء المعايير الآتية: ارتباط الحجة بموضوع النص – استنادها إلى شواهد وردت في النص – قدرتها على دعم موقف الكاتب.",qs:[
O("قيّم الحجة.","الحجة قوية؛ لأنها ترتبط مباشرة بموضوع النص، وهو التوازن بين العالمية والخصوصية. وتستند إلى شواهد تاريخية وقانونية وثقافية وردت في النص، وتدعم موقف الكاتب الذي يرى إمكان الجمع بين المبادئ الإنسانية العامة والخصوصيات الثقافية دون تقويض أحدهما.")]},
{t:"نشاط ٣",ref:"فسّر:",qs:[O("كيف أسهم التنوع الثقافي والاجتماعي في تشكيل رؤية الكاتب تجاه العلاقة بين «عالمية حقوق الإنسان والخصوصية الثقافية»؟ مستشهدًا بما ورد في النص.","أسهم التنوع الثقافي والاجتماعي في جعل الكاتب يدرك أن حقوق الإنسان ذات مبادئ عامة، لكنها تُمارس داخل مجتمعات تختلف في ثقافاتها وقوانينها وتقاليدها. ولذلك لم ينظر إلى العالمية والخصوصية على أنهما متعارضتان، بل دعا إلى تحقيق التوازن بينهما بما يحفظ كرامة الإنسان وهويته.")]},
{t:"نشاط ٤",ref:"حدّد:",qs:[O("حدّد زاوية الرؤية التي ينطلق منها الكاتب في تناول «قضية حقوق الإنسان بين الخصوصية والعالمية»، واستدل عليها بما ورد في النص.","ينطلق الكاتب من زاوية حقوقية إنسانية متوازنة؛ فهو يؤكد عالمية كرامة الإنسان وحقوقه، مع الاعتراف بأهمية الخصوصية الثقافية والوطنية. ويتضح ذلك من دعوته إلى تحقيق التوازن بين المبادئ الإنسانية العامة والخصوصيات الثقافية.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"عرض النص اتجاهين فكريين في تفسير الحقوق: الأول: يراها معايير إنسانية عامة لا تجوز التجزئة فيها أو الخضوع لمعايير مزدوجة. الثاني: يراها منظومة تُطبَّق من خلال الضوابط القانونية والهوية الوطنية.",qs:[O("أيّ الاتجاهين تراه أكثر واقعية في التعامل مع التحديات المعاصرة للدول والمجتمعات؟ دعم رأيك بحجة منطقية مبنية على أدلة النص، موضحًا كيف استطاع الكاتب دمج الاتجاهين تحت رؤية تكاملية.","أرى أن الاتجاه الذي يجمع بين عالمية الحقوق واحترام الخصوصية الوطنية أكثر قدرة على التعامل مع التحديات المعاصرة؛ لأن الحقوق الأساسية تحتاج إلى حماية عامة، وفي الوقت نفسه يجب أن تراعي القوانين ظروف المجتمع وهويته. وقد نجح الكاتب في دمج الاتجاهين في رؤية تكاملية تقوم على التوازن لا الصدام.")]},
{t:"نشاط ٢ (النص المسموع)",ref:"النص المسموع (مقال أثار نقاشًا): استمع إلى النص، ثم أجب عن السؤالين الآتيين:",qs:[
O("ما الدافع الأساسي الذي جعل الإدارة المدرسية تتخذ قرارًا بتنظيم ندوة مفتوحة؟ وما المنفعة التربوية من هذا الإجراء؟","الدافع: وجود نقاش واختلاف في الرؤى حول حرية التعبير، فأرادت الإدارة إتاحة مساحة للحوار الحر المنظم.\nالمنفعة التربوية: تدريب الطلاب على الحوار والاستماع إلى الرأي الآخر واحترام الاختلاف وبناء الرأي على الحجة."),
O("قارن بين رؤية الفريق الأول لـ«حرية التعبير» ورؤية الفريق الثاني لها. كيف ربط كل فريق منهما مفهوم الحرية بتقدم المجتمع أو باحترام الآخرين؟","رأى الفريق الأول حرية التعبير وسيلة أساسية لإبداء الرأي وتقدم المجتمع، فربطها بتقدم المجتمع. وركز الفريق الثاني على ضرورة ربط الحرية باحترام الآخرين وعدم الإضرار بهم، فربطها بالمسئولية واحترام الآخرين.")]},
{t:"نشاط ٣ (نص متحرر)",ref:"نص متحرر: (حرية التعبير بين الإطلاق والضوابط المجتمعية). اقرأ الفقرة، ثم أجب عن الأسئلة: «تعد حرية التعبير حجر الزاوية في بناء المجتمعات الإنسانية المتقدمة، فهي المنطلق الأساسي لإعمال الفكر، وتبادل الآراء، وكشف العيوب وإظهارها بقصد الإصلاح. غير أن هذه الحرية – مهما بلغت أهميتها – لا يمكن أن تُمارس دون ضوابط حاكمة؛ إذ إن العلاقة بين حرية الفرد ومصلحة المجتمع علاقة تكاملية وثيقة؛ فالحرية المطلقة عن كل قيد تتحول سريعًا إلى فوضى تستبيح كرامة الآخرين، وتعكر صفو السلم المجتمعي، وتزرع بذور النزاع بين أبناء الوطن الواحد. من هنا، استقر الفكر الإنساني والقوانين الحديثة على أن «الحرية المسئولة» هي المنبع الحقيقي للإبداع والتطور؛ فممارسة الحق في القول أو الكتابة تستوجب بالضرورة الالتزام بالقيم الأخلاقية والقوانين المنظمة؛ لأن حق المرء في التعبير ينتهي عند الحدود التي تبدأ عندها حقوق الآخرين في الحماية من التجريح، والافتراء، والمساس بسلامة المجتمع وأمنه.»",qs:[
M("المقصود بعبارة «الحرية المسئولة» كما يفهم من سياق الفقرة الثالثة:",["ممارسة الفرد لحريته الكاملة دون النظر لآراء الآخرين.","امتناع الفرد عن التعبير تجنبًا للوقوع في الخطأ.","التعبير عن الرأي في إطار القوانين والقيم الأخلاقية.","فرض رقابة صارمة تمنع نشر المقالات والفكر."],2,"الحرية المسئولة هي التعبير عن الرأي في إطار القوانين والقيم الأخلاقية."),
M("ما علاقة جملة «فهي المنطلق الأساسي لإعمال الفكر» بما قبلها؟",["تعليل","نتيجة","توضيح","استدراك"],0,"الجملة تعليل لكون حرية التعبير حجر الزاوية."),
O("ما النتيجة المترتبة على ممارسة الحرية بغير قيود أخلاقية أو قانونية بحسب النص؟","تتحول الحرية المطلقة سريعًا إلى فوضى تستبيح كرامة الآخرين، وتعكر صفو السلم المجتمعي، وتزرع بذور النزاع بين أبناء الوطن الواحد.")]}]}]},
{t:"هيا نتحدث ونكتب – هيا نوظف لغتنا الجميلة",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١ (تحدّث)",ref:"تحدّث لمدة دقيقتين حول مقولة: «العالمية لا تعني طمس الهويات، بل ترسيخ المشترك البشري». مستعينًا بما ورد في النص، حاول في حديثك أن: تشرح معنى «المشترك البشري» بأسلوبك – وتذكر مثالًا من الواقع يوضح كيف يحافظ مجتمع ما على هويته الثقافية مع احترام المبادئ العالمية.",qs:[O("تحدّث عن المقولة.","المشترك البشري هو المبادئ والقيم التي تجمع البشر، مثل الكرامة والعدل والحرية واحترام الإنسان.\nمثال: يمكن لمجتمع أن يحافظ على لغته وتراثه وعاداته، وفي الوقت نفسه يحترم المبادئ الإنسانية العامة.")]},
{t:"نشاط ٢",ref:"اكتب فقرة مترابطة (من خمسة أسطر) تبين فيها مدى اتفاقك أو اختلافك مع هذه المقولة: «التنازل عن الخصوصية الثقافية بحجة العالمية يؤدي إلى التبعية الفكرية». احرص على أن تتضمن فقرتك: جملة افتتاحية تحدد موقفك (مع أو ضد) – حجة قانونية أو ثقافية تؤيد بها طرحك – خاتمة تلخص رؤيتك.",qs:[O("اكتب الفقرة.","أعتقد أن التمسك بالخصوصية الثقافية لا يتعارض مع التفاعل مع الثقافات الأخرى؛ لأن الحضارات تتقدم بالحوار وتبادل الخبرات. وأرى أن احترام الخصوصية الثقافية يمكن أن يتوافق مع المبادئ الإنسانية العالمية، ولكن الانفتاح الواعي لا يعني التخلي عن الهوية، بل يعني تطويرها مع الحفاظ على أصولها. ولذلك فالتفاعل الثقافي الواعي يثري الفكر ولا يلغي الخصوصية.")]},
{t:"نشاط ٣",ref:"أجب عما يأتي:",qs:[
O("«تلك [الطبيعة]، فاغتنم الاستمتاع بجمال [الكون] هذا؛ فهو من صنع الله رب العالمين». اجعل الكلمات التي تحتها خط بدلًا، وغيّر ما يلزم.","«تلك الطبيعةُ جميلة، فاغتنم الاستمتاع بجمال هذا الكونِ؛ فهو من صنع الله رب العالمين.» (البدل: الطبيعة، الكون)."),
O("املأ الفراغ بحرف عطف مناسب (بل – لكن – أو – ثم): «لا تكونوا غافلين ....... يقظين لمكائد العدو».","لكن (حرف عطف يفيد الاستدراك بعد النفي).")]},
{t:"نشاط ٤",ref:"اقرأ العبارة الآتية، وأجب عن المطلوب: «الحرية المسئولة وسيادة القانون كجناحي الطائر؛ لا يرتقي المجتمع ولا يحلّق بنيانه إلا بهما معًا».",qs:[
O("أ- حدّد طرفي التشبيه (المشبّه والمشبّه به).","المشبّه: الحرية المسئولة وسيادة القانون.\nالمشبّه به: جناحا الطائر."),
M("ب- اختر الفكرة المنطقية التي يدعمها هذا التشبيه:",["الحرية المطلقة دون ضوابط هي السبيل الوحيد لنهضة المجتمعات.","ممارسة الحرية في إطار من المسئولية والانضباط شرط أساس لتقدم المجتمع.","المسئولية تمثل عائقًا يحرم الأفراد من التعبير عن آرائهم.","التقدم المجتمعي يعتمد فقط على القوانين دون حاجة لمدّ أواصر الحرية."],1,"التشبيه يوضح أن الحرية المسئولة وسيادة القانون معًا شرط لتقدم المجتمع.")]},
{t:"نشاط ٥",ref:"بيّن سبب كتابة الهمزة المتوسطة بالصورة التي ظهرت عليها في الكلمتين الآتيتين (مع ذكر حركة الهمزة وحركة الحرف الذي قبلها): (يطمئن – المؤونة).",qs:[O("علّل.","يطمئن: الهمزة متوسطة مكسورة، وما قبلها مفتوح، والكسرة أقوى من الفتحة؛ لذلك كُتبت على نبرة.\nالمؤونة: الهمزة متوسطة ساكنة، وما قبلها مضموم، والضمة أقوى من السكون؛ لذلك كُتبت على واو.")]},
{t:"نشاط ٦",ref:"طُلب منك إلقاء كلمة في حفل تكريم المتفوقين حول قيمة: «الاجتهاد طريق النجاح». اكتب فقرة استهلالية من ثلاثة أسطر تحفّز بها زملاءك، موظفًا فيها (كلمة تحتوي على ألف لينة في آخر الاسم – كلمة تشتمل على همزة متوسطة على واو).",qs:[O("اكتب الفقرة.","أعزائي الزملاء، إن الاجتهاد هو الطريق الحقيقي إلى النجاح، فليس التفوق أمنية تتحقق دون عمل. اجتهدوا في طلب العلم، وثابروا ولا تجعلوا الصعوبات سببًا للتراجع. فمن جدّ وجد، ومن زرع حصد، ومن سار على طريق العلم بلغ غايته.\n(ألف لينة في آخر الاسم: هدى. همزة متوسطة على واو: مؤمن.)")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"تخيّل أنك دعيت لإلقاء كلمة في إذاعة المدرسة بمناسبة «اليوم العالمي للتسامح واحترام التنوع الثقافي»، اكتب ثلاث أفكار رئيسة تدور حولها كلمتك.",qs:[O("اكتب الأفكار.","احترام التنوع الثقافي وقبول الاختلاف.\nالحوار والتفاهم وسيلة لبناء المجتمعات.\nنبذ التعصب والتمسك بالقيم الإنسانية المشتركة.")]},
{t:"نشاط ٢",ref:"لخّص مضمون النص في (خمسة أسطر).",qs:[O("اكتب الملخص.","حقوق الإنسان تقوم على مبادئ عامة تحفظ كرامة الإنسان وحرياته الأساسية، لكنها تُمارس داخل مجتمعات ذات ثقافات وقوانين مختلفة. ولذلك يحتاج المجتمع إلى تحقيق التوازن بين العالمية والخصوصية الثقافية والوطنية. ولا ينبغي استخدام الخصوصية ذريعةً للانتقاص من الحقوق، كما لا ينبغي فرض نموذج واحد يتجاهل هوية المجتمعات. والحل هو الوعي بالحقوق وتفعيل المؤسسات والقوانين بما يحقق الكرامة والعدالة.")]},
{t:"نشاط ٣",ref:"قال الشاعر:\n«يا أيها الرجل المعلّم غيرَه ... هلّا لنفسك كان ذا التعليمُ»\n«إن أسكنَ مرُّ القضاءِ بالنوى ... فثَمَّ عهودٌ بيننا ومواثقُ»",qs:[
M("أعرب كلمة (التعليم) الواردة في البيت الأول:",["اسم كان مرفوع.","بدل مرفوع.","خبر كان منصوب.","مضاف إليه مجرور."],1,"«التعليم» بدل من اسم الإشارة «ذا» مرفوع بالضمة."),
M("أعرب كلمة (عهود) الواردة في البيت الثاني:",["معطوف مجرور.","خبر مرفوع.","مضاف إليه مجرور.","مبتدأ مؤخر مرفوع."],3,"«عهود» مبتدأ مؤخر مرفوع، وخبره شبه الجملة «ثَمَّ» المقدم.")]},
{t:"نشاط ٤",ref:"اقرأ العبارة الآتية من النص، ثم أجب: «فالحقوق لا تُمارس في فراغ، بل داخل مجتمع تحكمه نظم وقوانين».",qs:[
O("أ- ما الصورة البلاغية الضمنية في قوله: «لا تُمارس في فراغ»؟","استعارة مكنية؛ صوّر الكاتب الحقوق بشيء مادي يمكن ممارسته داخل مكان، ونفى وجود هذا المكان."),
O("ب- بمَ توحي استخدام لفظة «فراغ» في هذا السياق؟","توحي بأن الحقوق لا توجد بصورة مجردة منفصلة عن المجتمع، بل تُمارس داخل إطار من القوانين والنظم الاجتماعية.")]},
{t:"نشاط ٥",ref:"حوّل الأفعال الماضية الآتية إلى أفعال مضارعة، وراعِ التغير الناشئ في كتابة همزتها: (زأر – سئم – آوى).",qs:[O("اكتب المضارع.","زأر ← يزأر. سئم ← يسأم. آوى ← يأوي.")]},
{t:"نشاط ٦",ref:"اكتب فقرة من (ثمانية إلى عشرة) أسطر بعنوان «التراث الثقافي وأثره في تعزيز الهوية والانتماء». احرص على: استهلال جاذب (أسلوب نداء أو عبارة قوية) – عمق فكري (التوازن بين التمسك بالجذور والانفتاح على العصر) – خاتمة مؤثرة (سؤال تأملي يحث على صون الموروث).",qs:[O("اكتب الفقرة.","نموذج فقرة: يا أبناء الوطن، إن تراثنا الثقافي ذاكرة أمتنا وجسرها الممتد بين الماضي والحاضر. فهو يحفظ اللغة والعادات والفنون والقيم التي صنعت شخصيتنا. والتمسك بالتراث لا يعني الانغلاق عن العصر، بل يعني الاستفادة من الماضي والانفتاح الواعي على الحاضر بما يتناسب مع حاجاته. فكيف نضمن انتقال هذا الموروث إلى الأجيال القادمة بصورة تحفظ أصالته وتجدد حضوره؟")]}]}]},
{t:"التقييم الأسبوعي",f:[
{t:"المجموعة (أ)",acts:[
{t:"السؤال الأول (حقوق الإنسان)",ref:"من نص (حقوق الإنسان بين العالمية والخصوصية):",qs:[
M("مرادف كلمة (مسار) في عبارة «في مسار تثبيت هذه الحقوق»:",["نهج أو طريق.","غاية أو هدف.","حاجز أو مانع.","إطار أو قانون."],0,"«مسار» مرادفها نهج أو طريق."),
M("ما الفكرة المباشرة التي يدور حولها «السؤال المطروح أمام كل جيل» كما يفهم من النص؟",["كيفية إلغاء الخصوصية الحضارية لصالح العالمية.","كيفية التغلب على التحديات الاقتصادية والاجتماعية.","الموازنة بين صون الكرامة والحفاظ على الخصوصية الوطنية.","التخلي عن الحقوق مقابل الحفاظ على أمن المجتمع."],2,"السؤال هو الموازنة بين صون الكرامة والحفاظ على الخصوصية الوطنية.")]},
{t:"السؤال الثاني (نص متحرر)",ref:"«إن امتلاك المعلومة في عصرنا الحاضر لم يعد مزية في ذاته؛ فالفيض المعرفي والتدفق الرقمي جعلا العقول عرضة لسيول جارفة من الآراء المتباينة والدعايات الموجهة. من هنا تتجلّى قيمة «التفكير النقدي» بوصفه خط الدفاع الأول عن الوعي الإنساني؛ إذ لا يسلّم هذا التفكير بصحة القضايا لمجرد ذيوعها أو قوة قائليها، بل يُخضع كل دعوى للتمحيص والمساءلة. والناقد الحصيف لا يكتفي بالشك، بل يتخذه وسيلة لبلوغ اليقين؛ فهو يفرّق بدقة بين الحقائق الموضوعية والانطباعات الذاتية، ويرى سلامة الحجج المنطقية وتماسك الأدلة.»",qs:[
M("معنى كلمة «تمحيص» في سياق الفقرة الأولى:",["قبول مباشر.","فحص واختبار دقيق.","معارضة دائمة.","إهمال وتجاهل."],1,"«تمحيص» أي فحص واختبار دقيق."),
O("ب- أين تكمن الميزة الحقيقية للإنسان في العصر الرقمي؟","تكمن في قدرته على التفكير النقدي وتمحيص المعلومات والتمييز بين الحقائق والانطباعات والدعايات، وعدم قبول المعلومات لمجرد انتشارها."),
O("ج- ما الفارق الجوهري بين «العقل الناقد» و«العقل المتلقي» كما فهمت من النص؟","العقل الناقد: يفحص المعلومات، ويسأل عن الأدلة، ويميز بين الحقيقة والرأي.\nالعقل المتلقي: يقبل المعلومات كما وصلت إليه دون تمحيص كافٍ.")]},
{t:"السؤال الثالث (القواعد والإملاء)",ref:"أجب:",qs:[
O("أ- «نفخر بوطننا العربي تاريخه المجيد». عيّن البدل وبيّن نوعه وعلامة إعرابه في الجملة السابقة.","البدل: تاريخه. نوعه: بدل اشتمال. إعرابه: بدل مجرور وعلامة جره الكسرة، وهو مضاف."),
O("ب- «ابتُلي الناس حتى الأنبياء». أعرب كلمة «الأنبياء» وبيّن فائدة «حتى».","الأنبياء: معطوف مرفوع وعلامة رفعه الضمة؛ و«حتى» حرف عطف يفيد التدرج والغاية."),
M("ج- حدد الجملة التي كُتبت فيها الكلمة المشتملة على همزة متوسطة كتابة إملائية صحيحة:",["تحلّى الطالب بمروأة عالية في تعامله.","تحلّى الطالب بمروءةٍ عالية في تعامله.","تحلّى الطالب بمرؤة عالية في تعامله.","تحلّى الطالب بمروئة عالية في تعامله."],1,"الصواب: «مروءة».")]},
{t:"السؤال الرابع (الكتابة)",ref:"اكتب رسالة موجزة في سطرين إلى زميل لك يتعصب لرأيه، تنصحه فيها بضرورة الانفتاح الفكري والاستماع إلى وجهات النظر المختلفة.",qs:[O("اكتب الرسالة.","زميلي العزيز، إن الانفتاح الفكري والاستماع إلى وجهات النظر المختلفة يساعدانك على فهم القضايا بصورة أعمق. فلا تجعل اختلاف الرأي سببًا للتعصب، بل ناقش الآخرين بالحجة واحترم آراءهم.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"السؤال الأول (حقوق الإنسان)",ref:"من نص (حقوق الإنسان بين العالمية والخصوصية):",qs:[
M("كلمة «ذريعةً» في سياقها تعني: «ولا تصبح الخصوصية ذريعةً لإنكار الحق»:",["عائقًا ماديًّا.","حجة أو وسيلة تبرير.","نتيجة حتمية.","قانونًا صارمًا رفيعًا."],1,"«ذريعة» أي حجة أو وسيلة تبرير."),
M("يرى الكاتب في نهاية النص أن الإجابة عن تحدي صون الكرامة والحفاظ على الخصوصية:",["تقتضي الصدام والقطيعة التامة مع المعايير والمنظمات الدولية.","تتطلب وعيًا عميقًا بطبيعة الحقوق وحدودها وتفعيل دور مؤسسات الدولة.","تعني إلغاء الهوية المحلية بالكامل وتبني النمط العالمي الموحد.","مستحيلة التطبيق في ظل تباين الأنظمة السياسية المعاصرة."],1,"الإجابة تتطلب وعيًا عميقًا بطبيعة الحقوق وحدودها وتفعيل دور المؤسسات.")]},
{t:"السؤال الثاني (نص متحرر)",ref:"«إنّ مسألة الهوية والحداثة تقف دائمًا بين تيارين متباينين: تيار يدعو إلى التخلي التام عن الماضي بدعوى مواكبة العصر، وآخر ينغلق على التراث ويرفض كل جديد. وكلا التيارين يعجز عن بناء نهضة حقيقية تستند إلى جذور راسخة وتتطلع إلى آفاق واعدة. إنّ الحل الصائب يقتضي الجمع بين الأصالة والمعاصرة؛ فالأصالة ليست تقديسًا للماضي بكل ما فيه؛ وإنما هي استلهام لقيمه وطاقته الدافعة نحو الإبداع، كما أن المعاصرة ليست تقليدًا أعمى للآخر؛ بل هي تفاعل واعٍ مع منجزات العلم والمعرفة. وبهذا التوازن تستطيع الأمة أن تبني حاضرها دون أن تفقد شخصيتها وهويتها الخاصة.»",qs:[
M("تتحقق «المعاصرة» الحقيقية في رأي الكاتب من خلال:",["الرفض التام للموروث الثقافي.","التفاعل الواعي مع العلوم والمنجزات الحديثة.","محاكاة النماذج الغربية في جميع التفاصيل.","التمسك بالماضي ورفض أدوات العصر."],1,"المعاصرة تفاعل واعٍ مع منجزات العلم والمعرفة."),
M("الاتجاه الفكري للكاتب في النص هو:",["مادي بحت.","تراثي رافض للتجديد.","توفيقي عقلاني متوازن.","غربي متطرف."],2,"الكاتب توفيقي عقلاني متوازن."),
O("ب- ما العيب المشترك الذي وقع فيه التياران المذكوران في الفقرة الأولى وفق النص؟","كلاهما يتبنى موقفًا متطرفًا: الأول يتخلى عن الماضي تمامًا، والثاني ينغلق على التراث ويرفض كل جديد؛ فيعجز كلاهما عن بناء نهضة تجمع بين الأصالة والمعاصرة.")]},
{t:"السؤال الثالث (القواعد والإملاء)",ref:"أجب:",qs:[
O("أ- «قرأت دستور الدولة بنده الأول الخاص بالحقوق». عيّن البدل وبيّن نوعه وعلامة إعرابه.","البدل: بنده. نوعه: بدل بعض من كل. إعرابه: بدل منصوب وعلامة نصبه الفتحة، وهو مضاف."),
O("ب- «لا تصاحب أخا الجهل المقيت بل اصحب العالم». استخرج من العبارة حرف عطف، وبيّن الشرط الذي حققه.","حرف العطف الوارد في النص: بل. والشرط في العطف: أن يتوسط حرف العطف بين المعطوف والمعطوف عليه، ويتبع المعطوفُ المعطوفَ عليه في الإعراب."),
M("ج- حدد الجملة التي كُتبت فيها الكلمة المشتملة على همزة متوسطة كتابة إملائية صحيحة:",["كان لكلامه تأثير بالغ في النفوس.","كان لكلامه تئثير بالغ في النفوس.","كان لكلامه تؤثير بالغ في النفوس.","كان لكلامه تاثير بالغ في النفوس."],0,"الصواب: «تأثير».")]},
{t:"السؤال الرابع (الكتابة)",ref:"أعلنت جماعة الصحافة المدرسية عن تنظيم ندوة بعنوان «حرية الفكر وبناء المجتمع». صمّم إعلانًا في سطرين تدعو فيه الطلاب للمشاركة، موظفًا عبارة تحث على التفكير الواعي وقبول الرأي الآخر.",qs:[O("اكتب الإعلان.","تعلن جماعة الصحافة المدرسية عن ندوة «حرية الفكر وبناء المجتمع»؛ فشاركوا بآرائكم، فالتفكير الواعي وقبول الرأي الآخر هما أساس بناء المجتمعات.")]}]},

M("يرى أنصار «الخصوصية الوطنية» كما ورد في النص أن:",["كل مجتمع يحق له تنظيم ممارسة الحريات وفق أطره القانونية والوطنية والثقافية.","القوانين الدولية يجب أن تُطبق حرفيًّا دون أي مراعاة لعادات أو تقاليد الشعوب.","الأمن القومي يتطلب إلغاء كافة الحقوق والحريات الفردية بشكل دائم.","العولمة الثقافية هي الوسيلة الوحيدة لحل النزاعات بين دول العالم النامي."],0,"أنصار الخصوصية الوطنية يرون حق كل مجتمع في تنظيم الحريات وفق أطره القانونية والوطنية والثقافية.")]},
{t:"السؤال الثاني (نص متحرر)",ref:"«يُعدّ التعصب داءً يُعمي البصيرة ويُعطّل النظر. وهذه النظرة الضيقة تقضي على روح الحوار، فتحوّل ما يمكن أن يكون وسيلة للتعارف وتناقل المعرفة إلى ساحة للخصومة وإقصاء الآخر. إن قبول الاختلاف لا يعني التنازل عن المبادئ، بل يعني إدراك أن الحقيقة تتسع لتعدد الآراء، وتنوع الآراء ثروة تحمي المجتمع من الجمود، وتدفع به نحو التطور والارتقاء.»",qs:[

M("الفكرة الرئيسة للفقرة الثانية هي:",["أسباب ظهور التعصب في المجتمعات.","دور التعددية الفكرية في إثراء الحضارات.","سلبيات الجدال العقيم في الحوار.","كيفية التغلب على المشكلات المعرفية."],1,"الفكرة الرئيسة: دور التعددية الفكرية في إثراء الحضارات."),
O("ب- وضّح من خلال فهمك للنص كيف يقضي التعصب على لغة الحوار ويجعله صراعًا بين الأطراف؟","يجعل المتعصب رأيه حقيقة مطلقة، ويرفض الاعتراف بصحة رأي الآخرين، فيتحول الحوار من وسيلة للتعارف وتبادل المعرفة إلى خصومة وإقصاء، ويضعف القدرة على التعاون والتقدم.")]},

M("ج- حدد الجملة التي كُتبت فيها الكلمة المشتملة على همزة متوسطة كتابة إملائية صحيحة:",["يقدر الناس رأي الحكيم لصوابه.","يقدر الناس رئي الحكيم لصوابه.","يقدر الناس رؤي الحكيم لصوابه.","يقدر الناس رءي الحكيم لصوابه."],0,"الصواب: «رأي».")]},
{t:"السؤال الرابع (الكتابة)",ref:"اكتب في سطرين عبارة توجيهية لزملائك توضّح فيها مفهوم «الحرية الفكرية»، مبينًا أنها ترتكز على العقل والحجة وليس على الأهواء والفوضى.",qs:[O("اكتب العبارة.","الحرية الفكرية هي قدرة الإنسان على التفكير وإبداء الرأي في ضوء العقل والحجة والدليل، وليست اتباع الأهواء أو نشر الفوضى. فاحرصوا على التحقق من المعلومات واحترام آراء الآخرين ومناقشتهم بالحجة.")]}]}]}

const MA="وازِنْ بين شخصية (محسن) في «عودة الروح» وشخصية (أحمس) في «كفاح طيبة»؛ من حيث: موقفهما من مواجهة الواقع (بعد عزلة عن الناس)، وأثر ذلك في تشكيل وعيهما بالواجب الوطني.";
const MAA="التشابه: كلاهما أسهمت مواجهة الواقع في زيادة وعيه بالمسئولية تجاه وطنه.\nالاختلاف: تجربة محسن ارتبطت بالوعي الاجتماعي والتحول الداخلي بعد خروجه التدريجي من عزلته، بينما ارتبطت تجربة أحمس بمواجهة الاحتلال والمقاومة الوطنية المباشرة.";
const FR="«فالحرية الفكرية ليست ترفًا يُطلب للزينة، ولكنها ضرورة للحياة الكريمة؛ إذ بها يزن الإنسان الآراء، ويميز بين الحق والباطل، ويختار لنفسه طريقه عن وعي واقتناع».";
const FR2="«والحرية الفكرية لا تعني الفوضى، ولا تعني أن يستغني العقل عن الدليل، بل تعني أن يكون الدليل هو الحاكم، وأن تكون الحجة هي الفيصل، فإذا غلب الهوى على الدليل، أو غلب التقليد على البرهان، ضاعت الحرية ولو كُتبت في الدساتير».";

M("حدد المقابل (المضاد) الدقيق لكلمتي (سُلِب) و(الإرادة) وفق سياقهما في العبارة السابقة على الترتيب:",["مُنِح – العجز","كُوفئ – الإجبار","وُهب – التردد","أُعطي – الخضوع"],0,"مضاد «سُلب»: مُنح، ومضاد «الإرادة»: العجز.")]},

O("استخرج من النص شرطين رئيسين لقيام «الحرية الحقيقية»، وبيّن أثرها على الفرد والمجتمع.","الشرطان: التفكير القائم على العقل والدليل، وتحمل المسئولية. وأثرها: تبني الفرد المستقل والمجتمع المبدع. (إجابة استرشادية)")]}]},

{t:"نشاط ٢",ref:"صحّح الكاتب مفهومًا مغلوطًا عن الحرية الفكرية قبل أن يبيّن جوهرها وأثرها في حياة الإنسان. اشرح ذلك في ضوء فهمك للنص.",qs:[O("اشرح.","صحّح الكاتب فهمًا مغلوطًا يرى الحرية الفكرية أن يفعل الإنسان أو يقول كل ما يشاء دون ضابط؛ فليست الحرية فوضى، وإنما هي حرية التفكير القائمة على العقل والدليل والحجة والمسئولية، مع احترام حقوق الآخرين.")]}]}]},
{t:"هيا نحلل ونناقش – هيا نتحدث ونكتب – هيا نوظف لغتنا الجميلة",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١",ref:"اقرأ الفقرة التالية ثم أجب: "+FR,qs:[
M("أيّ ما يلي يمثّل الفكرة الرئيسة الشاملة للفقرة السابقة؟",["الحرية الفكرية ركيزة أساسية لكرامة الإنسان وبناء اختياراته المستقلة.","التمييز بين الحق والباطل يتطلب دراسة فكرية وفلسفية عميقة.","رفض مظاهر الزينة والترف المادي في الحياة المعاصرة.","دور العقل البشري في موازنة الآراء ونقدها وتفنيدها."],0,"الفقرة تجعل الحرية الفكرية ضرورة للحياة الكريمة."),
O("ما الوظيفة الأساسية للحرية الفكرية في حياة الإنسان كما صاغها الكاتب؟","تمكّن الإنسان من وزن الآراء، والتمييز بين الحق والباطل، واختيار طريقه عن وعي واقتناع.")]},
{t:"نشاط ٢",ref:"ينطلق العقاد في النص من زاوية رؤية فلسفية فكرية تربط بين نيل «الحرية الفكرية» وتحقق «المسئولية الذاتية». فسّر أبعاد زاوية الرؤية هذه مستعينًا بالروابط التي عقدها الكاتب بين الحرية وكل من: (وعي الذات – واقتناع الذات).",qs:[O("فسّر.","وعي الذات: الحرية الحقيقية ترتبط بوعي الإنسان بذاته وقدرته على اختيار طريقه.\nاقتناع الذات: إذا امتلك الإنسان حرية التفكير استطاع أن يكوّن رأيه باستقلال ويتحمل مسئولية اختياراته؛ أما إذا فُرض عليه التفكير فقدت إرادته استقلالها.")]},
{t:"نشاط ٣ (عرض شفهي)",ref:"«يختلط على كثير من الشباب مفهوم «الحرية الفكرية»، فيعتبرون أن من حقهم نشر كل ما يخطر ببالهم على منصات التواصل الاجتماعي دون ضابط، متجاهلين الفرق بين النقد البنّاء والفوضى». قدّم عرضًا شفهيًّا أمام زملائك (مدة ٣ دقائق) تعالج فيه هذه القضية، مرتكزًا على: التمهيد (تعريف الحرية الفكرية الواعية) – التحليل (التمييز بين حرية التعبير القائمة على الدليل والفوضى القائمة على الهوى) – الاستدلال (مثال واقعي يبرز دور الحرية الفكرية في نهضة المجتمع) – الخاتمة (نصيحة موجهة لشباب اليوم).",qs:[O("قدّم العرض.","الحرية الفكرية الواعية هي قدرة الإنسان على التفكير والتعبير مع الالتزام بالدليل واحترام الآخرين. ويختلف النقد البنّاء عن الفوضى؛ فالنقد يعتمد على الحجة، أما الفوضى فتقوم على الهوى ونشر الآراء دون تحقق. والحرية الفكرية تسهم في نهضة المجتمع؛ لأنها تفتح باب البحث والإبداع وتطوير العلوم والآداب. ولذلك يجب أن نجعل الكلمة مسئولة، وأن نتحقق قبل النشر، وأن نحترم الرأي المخالف لنا.")]},
{t:"نشاط ٤",ref:"تخيل أنك تقوم بكتابة مقال ترد فيه على كاتب عن «الجمود الفكري». اكتب مقدمة من (ثلاثة) أسطر تتضمن الكلمات الآتية معًا مع ضبطها بالشكل الصحيح: (البُرهان – التَّجْديد – المَسْئُولِيَّة).",qs:[O("اكتب المقدمة.","إن الجمود الفكري من أخطر العوائق التي تقف أمام تقدم الإنسان؛ لأن الأمم لا تتقدم إلا إذا جعلت البُرهانَ أساسًا للحكم، وآمنت بقيمة التَّجْديدِ، وتحمّلت المَسْئُولِيَّةَ في استخدام الفكر.")]},
{t:"نشاط ٥",ref:"حدد المنعوت والنعت في العبارة الآتية، ثم بيّن نوع النعت (حقيقيًّا أم سببيًّا): «الثقافة الواعية أساس تقدم الشعوب».",qs:[O("أجب.","المنعوت: الثقافة. النعت: الواعية. نوع النعت: حقيقي.")]},
{t:"نشاط ٦",ref:"يقول العقاد: «إن الكلمة حرية يتوجها العقل، لكنها مسئولية يمزق بها غطاء الفوضى». اشرح كيف وظّف العقاد الاستعارة في رسم صورتين متقابلتين للكلمة؟ وما أثر هذا التقابل في إبراز الفرق بين «الحرية المسئولة» و«الفوضى الرقمية»؟",qs:[O("اشرح.","فسّر العقاد الكلمة بصورتين متقابلتين؛ فهي قد تكون وسيلة للحرية عندما تقوم على العقل والمسئولية، وقد تتحول إلى أداة للفوضى إذا انفصلت عن الضوابط. وقد أسهم هذا التصوير في إبراز الفرق بين الحرية المسئولة والفوضى الرقمية، وتحذير القارئ من خطورة الاستخدام غير المسئول للكلمة.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"«يقرر العقاد أن التفكير يولّد الإرادة، والإرادة تصنع العمل». وضّح كيف يتأثر سلوك الإنسان وعمله إذا فُقدت حرية التفكير وسُلبت إرادته؟",qs:[O("وضّح.","إذا فقد الإنسان حرية التفكير سُلبت قدرته على تكوين رأي مستقل، وإذا سُلبت إرادته أصبح عمله قائمًا على الإكراه أو التقليد، فيضعف إبداعه ومبادرته، ويصبح سلوكه تابعًا لغيره.")]},
{t:"نشاط ٢",ref:"في ظل انتشار «الترند» وثقافة الحشود على منصات التواصل، يميل كثيرون إلى تبنّي آراء الجمهور خوفًا من مخالفتهم. اكتب تعليقًا نقديًّا في (ثلاثة) أسطر توجّهه لمن يتبع رأي الأغلبية دون تحقق، موظفًا فكرة العقاد: «غير خائف من جمهور يخاصمه».",qs:[O("اكتب التعليق.","لا تجعل انتشار الرأي دليلًا على صوابه؛ فالأغلبية قد تخطئ كما قد تصيب. فكّر وتحقق من الأدلة، واسأل عن مصدر المعلومة قبل أن تتبنى رأي الجمهور. فالإنسان الحر لا يخشى مخالفة الناس إذا كان يملك حجة صحيحة.")]},
{t:"نشاط ٣",ref:"لو طُلب إليك وضع فقرة بديلة للفقرة الأخيرة (الحرية ضرورة للحياة الكريمة)، كيف ستربط بين غياب حرية التفكير وتراجع الإنتاج الحضاري للأمم؟ اكتب الفقرة في حدود (٥ إلى ٧) أسطر.",qs:[O("اكتب الفقرة.","حرية التفكير هي أساس الإبداع والإنتاج الحضاري؛ فإذا غابت أصبح الإنسان مقلدًا عاجزًا عن التجديد. وعندما تُقيّد العقول تتراجع الأسئلة الجديدة، ويضعف البحث العلمي، وتفقد الأمة قدرتها على تطوير أدواتها. لذلك فإن ازدهار الحضارات مرتبط بقدرتها على حماية العقل وتشجيع التفكير المسؤول.")]},
{t:"نشاط ٤",ref:"تخيل أنك تقوم بكتابة مقال ترد فيه على كاتب عن «الجمود الفكري». اكتب مقدمة من ثلاثة أسطر تتضمن الكلمات الآتية معًا مع ضبطها بالشكل الصحيح: (البُرهان – التَّجْديد – المَسْئُولِيَّة).",qs:[O("اكتب المقدمة.","إن الجمود الفكري من أخطر العوائق التي تقف أمام تقدم الإنسان؛ لأن الأمم لا تتقدم إلا إذا جعلت البُرهانَ أساسًا للحكم، وآمنت بقيمة التَّجْديدِ، وتحمّلت المَسْئُولِيَّةَ في استخدام الفكر.")]},
{t:"نشاط ٥",ref:"أجب عما يأتي:",qs:[
O("أ- حدد أداة العطف والمعطوف في قول الكاتب: «أن يعلو الفكر الصادق، وأن تسود الحكمة العادلة».","الأداة: الواو. المعطوف: أن تسود الحكمة العادلة."),
M("ب- ما الدلالة البلاغية لعطف الجملة الثانية على الأولى في سياق المقولة السابقة؟",["التخيير بين أمرين مختلفين.","الاستدراك لمنع الفهم الخاطئ.","الاستثناء والتحذير من اتباع الهوى.","التنوع والتكامل لبناء منظومة قيمية شاملة."],3,"الواو تجمع بين أمرين متكاملين لبناء منظومة قيمية شاملة.")]},
{t:"نشاط ٦",ref:"اقرأ العبارة الآتية من النص، ثم أجب: «غير خائف من سلطان يعاقبه، أو جمهور يخاصمه، أو عادة تأسره». اشتملت العبارة على استعارة مكنية متتابعة رسمت صورة للقيود المعنوية لإنسان. اشرح كيف وظّف الكاتب الاستعارة المكنية لبيان الهيمنة على عقل الإنسان وحريته؟",qs:[O("اشرح.","استخدم الكاتب استعارات مكنية متتابعة صوّر فيها الخوف والجمهور والسلطة والعادة كأنها قوى مادية تلاحق الإنسان وتعاقبه وتخاصمه وتأسره. ويجسد هذا التصوير القيود المعنوية التي قد تحاصر الإنسان، ويوضح كيف يمكن للخوف من المجتمع أو السلطة أن يؤثر في استقلال العقل وحريته.")]}]}]},
{t:"التقييم الأسبوعي",f:[
{t:"المجموعة (أ)",acts:[
{t:"السؤال الأول (الحرية الفكرية)",ref:"فرّق الكاتب ضمنيًّا بين (العاقل المستقل) و(التابع الخائف) في قوله: «غير خائف من سلطان يعاقبه، أو جمهور يخاصمه».",qs:[O("في ضوء هذه العبارة ما هي العواقب الاجتماعية التي قد يواجهها المفكر المجدد، وكيف يمكنه التغلب عليها؟","العواقب: التعرض للانتقاد أو الرفض، ومحاولة عزله أو الضغط عليه، ومقاومة أفكاره من بعض أفراد المجتمع.\nالتغلب عليها: التمسك بالدليل، والحوار الهادئ، واحترام المخالف، والصبر على عرض أفكاره، والابتعاد عن التعصب.")]},
{t:"السؤال الثاني",ref:"اقرأ الفقرة التالية من النص، ثم أجب: "+FR,qs:[
O("أ- وضّح نوع الصورة البيانية في قوله: «يزن الإنسان الآراء»، مبينًا القيمة الفنية والدلالية لهذه الصورة في سياقها.","استعارة مكنية؛ صوّر الآراء بأشياء مادية تُوزن. ودلالتها: توحي بضرورة تقييم الآراء وتمحيصها وعدم قبولها بلا دليل."),
O("ب- استخرج من الفقرة (استعارة مكنية أخرى)، ووضّح دلالتها البلاغية.","تصوير الحرية بأنها ميزان يزن به الإنسان الآراء، وهو تصوير يبرز دورها في الحكم والتمييز.")]},
{t:"السؤال الثالث (من روائع الأدب)",ref:MA,qs:[O("وازن.","محسن خرج من عزلته تدريجيًّا وأسهم احتكاكه بالمجتمع والأحداث في زيادة وعيه بعودة الروح الوطنية، وأحمس واجه واقع الاحتلال وانتقل من الإدراك إلى المقاومة والعمل من أجل الوطن.\n"+MAA)]},
{t:"السؤال الرابع (القواعد والإملاء)",ref:"أجب:",qs:[
M("أ- «إن الأدباء السامية أفكارُهم يتركون أثرًا لا يزول». اختر نوع النعت في الجملة السابقة:",["نعت حقيقي","نعت سببي","نعت جملة اسمية"],1,"«السامية أفكارهم» نعت سببي."),
O("ب- حدّد أداة العطف والمعطوف في قول الكاتب: «الأمة التي تقيد عقول أبنائها فإنها تقيد حاضرها ومستقبلها معًا».","الأداة: الواو. المعطوف: مستقبلها.")]},
{t:"السؤال الخامس (الكتابة)",ref:"«العدالة الاجتماعية والتعليم هما الركيزتان الأساسيتان لتطبيق أي ميثاق دولي، وبدونهما تصبح القوانين حبرًا على ورق». اكتب فقرة حجاجية (من ٥ إلى ٧ أسطر) تبيّن فيها صحة هذه المقولة، مستخدمًا أدوات الربط (ويتأكد ذلك – ومن ثمّ).",qs:[O("اكتب الفقرة.","تعد العدالة الاجتماعية والتعليم من أهم الركائز التي تساعد على تطبيق المواثيق والقوانين بصورة فعلية؛ لأن القانون وحده لا يكفي إذا لم يجد مجتمعًا واعيًا ومؤسسات قادرة على تنفيذه. ويتأكد ذلك من أن نشر التعليم وتحقيق العدالة يسهمان في تحويل المبادئ المكتوبة إلى واقع. ومن ثمّ ينبغي أن تتكامل القوانين مع الوعي المجتمعي، وبذلك تصبح الحقوق ممارسة حقيقية وليست مجرد كلمات مكتوبة.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"السؤال الأول (الحرية الفكرية)",ref:"«تقييد العقول لا يضر الحاضر فحسب، بل يمتد أثره للمستقبل».",qs:[O("وضّح كيف علل الكاتب هذه العبارة من خلال فهمك للنص.","لأن الإنسان الذي يُمنع من التفكير والإبداع لا يستطيع تطوير مجتمعه، ويمتد أثر ذلك إلى المستقبل؛ إذ تتراجع قدرة الأمة على التجديد والإنتاج الحضاري، وتصبح أكثر اعتمادًا على أفكار الآخرين.")]},
{t:"السؤال الثاني",ref:"اقرأ الفقرة التالية من النص، ثم أجب: "+FR2,qs:[
O("أ- حدّد نوع الصورة البيانية في عبارة: «تكون الحجة هي الفيصل»، ووضّح دلالتها.","استعارة مكنية؛ شبّه الحجة بحكم أو قاضٍ يفصل بين المتخاصمين. ودلالتها: تؤكد أن الحجة والدليل هما المعيار الحاسم في الحكم بين الآراء."),
O("ب- ما دلالة استخدام الكاتب لكلمتي «الهوى» و«الدليل» في سياق المقارنة بينهما؟","وضع الكاتب اللفظين في مقابلة؛ فالهوى يمثل الحكم غير الموضوعي، بينما يمثل الدليل التفكير القائم على البرهان، وبذلك يوضح أن الحرية الفكرية لا تستقيم إذا غلب الهوى على الدليل.")]},
{t:"السؤال الثالث (من روائع الأدب)",ref:MA,qs:[O("وازن.","انتقل محسن من العزلة إلى التفاعل مع الواقع، فنما وعيه بالمجتمع والوطن، وواجه أحمس الاحتلال بصورة مباشرة وتحول وعيه إلى فعل ومقاومة.\n"+MAA)]},
{t:"السؤال الرابع (القواعد والإملاء)",ref:"أجب:",qs:[
O("أ- حدد النعت والمنعوت ونوع النعت (حقيقي أم سببي) في العبارة: «إن الأمة الواعية لا ترضى بالتقليد».","المنعوت: الأمة. النعت: الواعية. نوع النعت: حقيقي."),
O("ب- بيّن المعنى الذي أفاده حرف العطف في الجملة الآتية: «لا تصاحب التابع الذليل بل الحر النبيل».","«بل»: حرف عطف يفيد الاستدراك (الإضراب)."),
O("ج- صوّب الخطأ الإملائي في الجملة: (يعيش المواطن في بيأة تضمن له حريته وأمنه).","الصواب: «بيئة»؛ لأن الهمزة مفتوحة وما قبلها حرف علة ساكن (ياء)، فتُكتب على نبرة.")]},
{t:"السؤال الخامس (الكتابة)",ref:"«العالمية الحقيقية لا تعني ذوبان الثقافات المحلية، بل هي مظلة عادلة تحمي الخصوصيات وتمنع الصدام البشري». اكتب فقرة حجاجية (من ٥ إلى ٧ أسطر) تبيّن فيها صحة هذه المقولة، مستخدمًا أدوات الربط (وبناءً على ذلك – وفي المقابل).",qs:[O("اكتب الفقرة.","العالمية الحقيقية لا تعني ذوبان الثقافات المحلية، بل تقوم على احترام التنوع والتعاون بين الشعوب. فالإنسان يستطيع أن يتمسك بلغته وتراثه وهويته، وفي الوقت نفسه يستفيد من تجارب الآخرين. ومن ثمّ فإن بناء جسور الحوار والتعاون أفضل من الصدام؛ لأن احترام الاختلاف يحقق التفاهم ويمنح المجتمعات فرصة للتقدم مع الحفاظ على شخصيتها.")]}]},
{t:"المجموعة (ج)",acts:[
{t:"السؤال الأول (الحرية الفكرية)",ref:"«إذا غلب الهوى على الدليل، أو غلب التقليد على البرهان ضاعت الحرية».",qs:[O("في رأيك، ما الذي يكشفه كل زوج عن طبيعة الخطر الذي يتهدد مفهوم الحرية؟","يبين كل زوج أن الخطر يتمثل في استبدال الدليل بالهوى والبرهان بالتقليد. فإذا غلب الهوى أصبح الحكم قائمًا على الرغبة الشخصية، وإذا غلب التقليد فقد الإنسان استقلاله الفكري، وفي الحالتين تضيع الحرية الحقيقية.")]},
{t:"السؤال الثاني",ref:"اقرأ العبارة الآتية من النص، ثم أجب: «إنّ الأمم التي تحيا بحرية الفكر هي الأمم القادرة على التجديد… لأنها لا ترضى أن تعيش على ميراث الماضي».",qs:[
O("أ- وضّح نوع الصورة البيانية في قوله: «تعيش على ميراث الماضي»، مبينًا ما إذا كانت قد حققت تشخيصًا أم تجسيدًا للمعنى.","استعارة مكنية؛ جعلت التراث الفكري شيئًا ماديًّا كالميراث، فهي تجسيد للمعنى."),
O("ب- استوحى الكاتب مفهوم «التراث الفكري» في صورة مادية تُستهلك؛ وضّح كيف يخدم هذا التصوير المعنى، وما الأثر النفسي والجمالي الذي يتركه لدى القارئ؟","التصوير يجعل التراث الفكري شيئًا ماديًّا كالميراث يمكن أن يُستهلك، ويوضح أن الاعتماد على الماضي وحده دون إضافة جديدة يؤدي إلى الجمود. كما يترك لدى القارئ أثرًا جماليًّا وفكريًّا يدفعه إلى الجمع بين الاستفادة من التراث والتجديد.")]},
{t:"السؤال الثالث (من روائع الأدب)",ref:MA,qs:[O("وازن.","محسن تحرر تدريجيًّا من عزلته وبدأ يفهم المجتمع والواقع بصورة أعمق، وأحمس واجه الواقع الوطني بصورة مباشرة واتجه إلى المقاومة والدفاع عن الوطن.\nالنتيجة المشتركة: مواجهة الواقع صنعت وعيًا بالمسئولية والانتماء الوطني.")]},
{t:"السؤال الرابع (القواعد والإملاء)",ref:"أجب:",qs:[
O("أ- حدد النعت والمنعوت ونوع النعت في العبارة: «يعيش المجتمع المستنير، وتنير عقول أبنائه».","النعت: المستنير. المنعوت: المجتمع. نوع النعت: حقيقي."),
O("ب- «الحرية تعزز الكرامة وتبني المجتمعات». حدد حرف العطف والمعطوف والمعطوف عليه.","حرف العطف: الواو. المعطوف: تبني المجتمعات. المعطوف عليه: تعزز الكرامة."),
O("ج- صوّب الخطأ الإملائي في الجملة: (يطمأن المرء لقوانين بلده التشريعية).","الصواب: «يطمئن»؛ لأن الهمزة ساكنة وما قبلها مكسور، فكُتبت على نبرة.")]},
{t:"السؤال الخامس (الكتابة)",ref:"«احترام كرامة الفرد داخل المجتمع لا ينبع من القوانين الصارمة فقط؛ بل من سلوكيات الأفراد وقيمهم في تعاملاتهم اليومية». اكتب فقرة حجاجية (من ٥ إلى ٧ أسطر) تبيّن فيها صحة هذه المقولة، مستخدمًا أدوات الربط (ويتأكد ذلك – ومن ثمّ).",qs:[O("اكتب الفقرة.","احترام كرامة الفرد لا ينبع من القوانين الصارمة فقط، بل من سلوكيات الأفراد وقيمهم اليومية. فالقانون يضع الإطار العام، بينما يحوّل الوعي الأخلاقي هذه المبادئ إلى ممارسة حقيقية. ومن ثمّ فإن احترام الآخر يبدأ من الأسرة والمدرسة والمجتمع، ويظهر في التعامل اليومي. ولذلك يجب أن تتكامل القوانين مع التربية والضمير حتى تصبح كرامة الإنسان قيمة راسخة.")]}]}]}
];
const CLR="إجابة استرشادية: ";
const PM=(title,items)=>O("اكتب فقرة وجيزة بعنوان «"+title+"»، موظفًا: "+items,"");
const GP3=(a,b)=>"قال الشاعر في قصيدة «يا أخي الإنسان»: "+a;
const U3W3=[
{t:"هيا نوظف لغتنا الجميلة – مراجعة من روائع الأدب",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١",ref:"املأ الفراغ بالرسم الإملائي الصحيح للكلمة الخطأ التي بين القوسين:",qs:[O("١- لم ........ (يبتدء) الكاتب حديثه إلا بالتأكيد على العدل.\n٢- إن ........ (ماسينا) الإنسانية تنبع من غياب الحوار المشترك.\n٣- إن ........ (علماءنا) هم منارة هذه الأمة.","١- يبتدئ (الهمزة متوسطة ساكنة بعد كسر فتُكتب على نبرة).\n٢- مآسينا.\n٣- علماءنا (همزة متوسطة بعد ألف مد فتُكتب على السطر).")]},
{t:"نشاط ٢",ref:"اكتب فقرة عن «أثر الذكاء الاصطناعي في إعادة تشكيل الإبداع البشري». احرص في فقرتك على توظيف: استهلال جاذب (ابدأ بتساؤل فلسفي يثير دهشة القارئ حول مستقبل العقل البشري) – عمق فكري (بيّن كيف تظل المشاعر والروح الإنسانية هي الجوهر الذي تعجز الخوارزميات عن محاكاته) – خاتمة مؤثرة (اختم بجملة تؤكد أن الآلة وسيلة لإطلاق الفكر وليست بديلًا عن الوعي).",qs:[O("اكتب الفقرة.","هل سيصبح العقل البشري يومًا عاجزًا أمام الآلة التي يصنعها؟ لقد أحدث الذكاء الاصطناعي تحولًا كبيرًا في مجالات المعرفة والإبداع، وأصبح يساعد الإنسان على إنتاج الأفكار وتحليل المعلومات وإنجاز الأعمال بسرعة. ومع ذلك تظل المشاعر والروح الإنسانية جوهرًا لا تستطيع الخوارزميات محاكاته بصورة كاملة؛ فالإنسان يمتلك الخبرة والخيال والقدرة على الإحساس والمعنى. لذلك ينبغي أن نستخدم الذكاء الاصطناعي وسيلة لتوسيع آفاق الفكر، لا بديلًا عن الإنسان ووعيه وإبداعه. فالآلة وسيلة لإطلاق الفكر، وليست بديلًا عن الوعي الإنساني.")]},
{t:"نشاط ٣",ref:"لم يغب الوطن عن مخيلة محمود تيمور في رحلته (شمس وليل)، وضّح ذلك مبديًا رأيك.",qs:[O("وضّح.","لم يغب الوطن عن مخيلة محمود تيمور في «شمس وليل»، فقد ظل مرتبطًا بالإنسان والبيئة والمجتمع، وظهر اهتمامه بالأماكن وما تحمله من دلالات إنسانية وحضارية. وأرى أن ذلك يعكس ارتباط الكاتب بوطنه، وقدرته على النظر إلى الرحلة بوصفها وسيلة لاكتشاف المكان والإنسان معًا.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"بيّن سبب كتابة الهمزة المتوسطة بالصورة التي ظهرت عليها في الكلمات الآتية (مع ذكر حركة الهمزة وحركة الحرف الذي قبلها): (فئة – تفاؤل – مئذنة).",qs:[O("علّل.","فئة: حركة الهمزة الفتحة، وحركة ما قبلها الكسرة، والكسرة أقوى؛ لذلك كُتبت على نبرة.\nتفاؤل: حركة الهمزة الضم، وما قبلها ساكن، والضمة أقوى من السكون؛ لذلك كُتبت على واو.\nمئذنة: الهمزة ساكنة، وحركة ما قبلها الكسرة، والكسرة أقوى؛ لذلك كُتبت على نبرة.")]},
{t:"نشاط ٢",ref:"اكتب فقرة عن «أدب الاختلاف الفكري بوصفه علامة على النضج الحضاري». احرص في فقرتك على توظيف: استهلال جاذب (استخدم أسلوب تعجب قياسي أو سماعي يستنكر ضيق الأفق وضيق الصدر بالرأي الآخر) – عمق فكري (ناقش فكرة أن التعايش المشترك يقوم على قبول الاختلاف لا تطابق الأفكار) – خاتمة مؤثرة (اختم بنصيحة تحث على الإنصات الواعي للآخر قبل الشروع في الجدال).",qs:[O("اكتب الفقرة.","ما أضيق أفق الإنسان حين يرفض كل رأي يخالفه! إن أدب الاختلاف الفكري علامة على نضج الإنسان والمجتمع؛ لأن التعايش لا يقوم على تطابق الأفكار، بل على قبول الاختلاف واحترام حق الآخرين في التفكير والتعبير. وقد يؤدي الحوار الهادئ إلى اكتشاف جوانب جديدة في القضية، بينما يؤدي التعصب إلى الجمود والانقسام. لذلك ينبغي أن نستمع إلى الرأي الآخر بوعي، وأن نفهم حجته قبل أن نشرع في الجدال والرد عليه.")]},
{t:"نشاط ٣",ref:"قارن بين أسلوب محمود تيمور في (شمس وليل) وعبد الرحمن الشرقاوي في (الأرض)؛ كيف استخدم كل منهما وصف الأماكن (الوصف الحسي) ووصف المشاعر (الوصف النفسي) للتأثير في القارئ وإقناعه بفكرته؟",qs:[O("قارن.","يستخدم محمود تيمور في «شمس وليل» الوصف الحسي للأماكن من خلال إبراز مظاهر الطبيعة والأمكنة التي يمر بها في رحلته، كما يستخدم الوصف النفسي للكشف عن مشاعره وانطباعاته تجاه هذه الأماكن. أما عبد الرحمن الشرقاوي في «الأرض» فيوظف الوصف الحسي للمكان لإبراز ارتباط الفلاح بأرضه، ويستخدم الوصف النفسي للكشف عن مشاعر الشخصيات تجاه الأرض والصراع الذي يدور حولها. وبذلك يسهم الوصف الحسي في تجسيد المكان، بينما يسهم الوصف النفسي في تعميق أثره في الشخصيات والقارئ، ويستخدم كل كاتب النوعين لخدمة فكرته الفنية والإنسانية.")]}]}]},
{t:"النص الشعري: يا أخي الإنسان",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١",ref:"النص الشعري (يا أخي الإنسان): اختر الإجابة الصحيحة:",qs:[
M("يؤكد الشاعر في قوله «أماني كلها من تراب» أن:",["أماني الفقراء لا قيمة لها.","أماني الإنسان أصلها مادي ومصيرها إلى زوال.","الأماني تتطلب العمل في الزراعة.","الأماني تصنع من الذهب والعسجد."],1,"الأماني أصلها مادي ومصيرها الزوال."),
M("العلاقة بين كلمتي (تشقى) و(تسعد) في البيت الثالث تدل على:",["الشقاء والسعادة طبيعة بشرية مشتركة.","تفوق الغني دائمًا على الفقير في مشاعره.","اقتصار الشقاء على الفقراء فقط.","انعدام الشعور لدى الطبقات المترفة."],0,"الشقاء والسعادة طبيعة بشرية مشتركة.")]},
{t:"نشاط ٢",ref:"يعالج الشاعر في أبياته مرضًا اجتماعيًّا ونفسيًّا يصيب بعض البشر عند امتلاك الثروة أو الجاه. حدد هذا المرض المستهدف، ودلل عليه من النص.",qs:[O("حدد.","المرض المستهدف: الكبر والغرور والتعالي على الآخرين بسبب المال أو الجاه. ويدل عليه ما يذكّر به الشاعر من أن أصل الإنسان من تراب ومصيره الفناء، وأن المال والثياب يزولان.")]},
{t:"نشاط ٣",ref:"يكثر الشاعر من توجيه الأسئلة الإنكارية في النص (مثل التساؤل عن أصل الثياب والتراب والمصير). بيّن أثر هذه الأسئلة في زعزعة ثقة المتكبر بنفسه ودفعه لإعادة التفكير في موقفه.",qs:[O("بيّن.","تضع الأسئلة الإنكارية المتكبر أمام حقيقة ضعفه وفنائه؛ فتنفي عنه ما يتوهمه من خلود وتفوق، وتزعزع ثقته بما يملك من مال ومظاهر، فتدفعه إلى إعادة التفكير في موقفه.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"يقول الشاعر:\n«أنا أولى بالحب منك وأحرى ... من كساءٍ يبلى ومالٍ ينفدُ»",qs:[
O("أ- صغ بأسلوبك الحكمة التي يطلقها الشاعر في هذا البيت، موضحًا سبب أهميتها في بناء علاقات إنسانية سوية.","المودة الإنسانية الصادقة أسمى من المظاهر الفانية؛ فالثياب والمال يبليان ويفنيان مع الزمن، بينما تبقى المحبة في النفوس. وتبنى بها علاقات قائمة على التآخي والرحمة والمساواة."),
O("ب- وازن الشاعر بين قيمتين: (الكساء والمال) من جهة، و(الحب والمحبة) من جهة أخرى. أيهما يرى الشاعر أنه يمنح الحياة معناها الحقيقي؟ استشهد ببيت من النص يوضح أن المشاعر الإنسانية أبقى من المظاهر المادية الفانية.","الحب والمودة هما اللذان يمنحان الحياة معناها الحقيقي. والشاهد: «أنا أولى بالحب منك وأحرى ... من كساءٍ يبلى ومالٍ ينفد»؛ فقد جسد فناء المظاهر المادية وزوالها.")]},
{t:"نشاط ٢",ref:"وازن الشاعر بين قلب المتكبر المظلم وقلب الإنسان المحب العامر بالضياء. ما الصورة البيانية التي جسدت هذا المعنى في النص؟",qs:[O("اكتب الإجابة.","في قوله: «لا يكن للخصام قلبك مأوى»: استعارة مكنية؛ صوّر القلب بالمأوى الذي ينزل فيه الخصام. وجمالها: رفض الكراهية والدعوة إلى المحبة.")]}]}]},
{t:"التقييم الأسبوعي",f:[
{t:"المجموعة (أ)",acts:[
{t:"السؤال الأول (النص الشعري)",ref:"النص الشعري (يا أخي الإنسان):",qs:[
O("فرّق الشاعر ضمنيًّا بين (الإنسان المتكبر المجرد من الإنسانية) و(الإنسان التقي الواعي بمصيره) في قوله: «أماني كلها من تراب وأمانيك كلها من عسجد». في ضوء هذه العبارة، ما هي النظرة القاصرة التي يحملها المتكبر تجاه الحياة والمال، وكيف قدّم الشاعر العلاج لهذه الظاهرة؟","النظرة القاصرة: يظن المتكبر أن المال والمظاهر تمنحه قيمة أعلى من غيره.\nالعلاج: التذكير بأن أصل الإنسان من تراب وأن المال والثياب زائلة، فلا يجعل ما يملكه سببًا لاحتقار غيره؛ فيُقدَّر الإنسان بما يقدمه لا بما يملكه، والقيمة الحقيقية في أخلاقه وأثره الطيب."),
O("وضّح نوع الصورة البيانية في قول الشاعر: «لا يكن للخصام قلبك مأوى»، مبينًا القيمة الفنية والدلالية لهذه الصورة في سياقها.","استعارة مكنية؛ حيث صوّر القلب بالمأوى الذي ينزل فيه الخصام. وقيمتها: تجسيد المعنى ورفض الكراهية والدعوة إلى المحبة.")]},
{t:"السؤال الثاني (رواية الأرض)",ref:"رواية الأرض لعبد الرحمن الشرقاوي، أجب عما يلي:",qs:[
O("أ- ما الفكرة الرئيسة التي تعالجها رواية الأرض؟","التمسك بالحق والأرض والكرامة، والدفاع عن حقوق الفلاحين، والصمود أمام الظلم."),
O("ب- لم تكن الأرض خلفية للأحداث بل كانت في قلبها. وضّح ذلك.","لأن الأرض كانت محل الصراع ومصدر رزق الفلاحين، وارتبطت بمصائر الشخصيات ومواقفها، وأثّرت في الأحداث والشخصيات بصورة مباشرة.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"السؤال الأول (النص الشعري)",ref:"النص الشعري (يا أخي الإنسان):",qs:[
O("يقارن الشاعر بين (الزيف الظاهري المتمثل في المظاهر والمال) و(الحقيقة الجوهرية المتمثلة في الفناء المشترك). في ضوء فهمك لقصيدة «يا أخي الإنسان»، كيف استطاع الشاعر إثبات أن التمايز بالطبقية والتكبر وهم باطل يسقط أمام حقيقة الموت والزوال؟","أكد الشاعر أن الإنسان مهما امتلك من مال أو زينة يرجع أصله إلى التراب ومصيره الفناء، فالمال والثياب يفنيان، ولا يبقى التفوق المادي أمام حقيقة الموت."),
O("وضّح نوع الصورة البيانية في قوله: «إنّ قلبي للحب أصبح معبدًا»، مبينًا القيمة الفنية والدلالية لهذه الصورة في سياقها البلاغي.","تشبيه بليغ؛ شبّه القلب بالمعبد في امتلائه بالحب وتعظيمه له. وقيمته: بيان شدة الحب ومكانته في نفس الشاعر، والدعوة إلى أن يكون القلب موئلًا للمحبة لا للخصام.")]},
{t:"السؤال الثاني (رواية الأرض)",ref:"رواية الأرض لعبد الرحمن الشرقاوي، أجب عما يأتي:",qs:[
O("أ- ما القيمة الأخلاقية والإنسانية التي أراد الكاتب ترسيخها من خلال هذا النص؟","التمسك بالحق والأرض والكرامة، والدفاع عن حقوق الفلاحين، والصمود أمام الظلم."),
O("ب- فرّق النص بين مفهومين للبطولة: «البطولة بالمعنى التقليدي» و«البطولة الحقيقية»؛ وضّح ملامح كلٍّ منهما من خلال شخصية محمد أبو سويلم.","البطولة التقليدية: ترتبط بالقوة والمواجهة المباشرة والأعمال الاستثنائية.\nالبطولة الحقيقية: الصمود والثبات والدفاع عن الأرض والحق وتحمل المعاناة مهما اشتدت الضغوط، وهو ما تجسد في شخصية محمد أبو سويلم.")]}]},
{t:"المجموعة (ج)",acts:[
{t:"السؤال الأول (النص الشعري)",ref:"النص الشعري (يا أخي الإنسان):",qs:[
O("يقيم الشاعر في النص دعوة إلى التآخي والمحبة الإنسانية المتبادلة. بيّن كيف رفض الشاعر منطق الكراهية والأحقاد في قوله: «فإنه غير جلمد». ووضّح كيف ينعكس إشعاع الحب على حياة الفرد والمجتمع.","يرى الشاعر أن الإنسان ليس جمادًا بل صاحب مشاعر؛ ولذلك فالكراهية والأحقاد لا تليقان بالطبيعة الإنسانية. وإشاعة الحب تجعل الفرد أكثر سعادة، وتقوّي روابط المجتمع وتنشر الرحمة والتعاون."),
O("وضّح نوع الصورة البيانية في قوله: «ما أنا فحمة ولا أنت فرقد»، مبينًا القيمة الفنية والدلالية للجمع بين التشبيهين.","تقوم العبارة على تشبيهين بليغين منفيين؛ شبّه الشاعر نفسه بالفحمة والآخر بالفرقد في سياق النفي. وقيمتها: نفي التمييز والتعالي وتأكيد وحدة الأصل الإنساني.")]},
{t:"السؤال الثاني (رواية الأرض)",ref:"من رواية الأرض لعبد الرحمن الشرقاوي أجب عما يلي:",qs:[
O("أ- ما العلاقة بين الأرض والوطن كما فهمت من الرواية؟","الأرض جزء أصيل من الوطن، وهي مصدر الانتماء والكرامة والرزق، والدفاع عنها دفاع عن الوطن والهوية."),
O("ب- ما الموقف الذي حرّك مشاعرك في الرواية؟ اذكر الموقف، واشرح سبب تأثره فيك مستدلًّا بتفصيل من العمل.","إجابة مفتوحة يكتبها الطالب؛ مثال: تمسّك محمد أبو سويلم وأهل القرية بأرضهم رغم القهر والظلم؛ لأن الأرض عندهم كرامة وحياة.")]}]}]}
];
const U3W4=[
{t:"هيا نتحدث ونكتب",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١ (تحدّث)",ref:"اختر بيتًا من القصيدة تجد أنه يمثل أعلى درجات المواجهة العقلية للمتكبر، ثم ألقِه أمام زملائك. أثناء الإلقاء حاول أن: تجعل نبرة صوتك قوية وحاسمة تناسب صدمة الحقيقة – تبرز الكلمات المحورية بنطق جلي – تلتزم بالوقفات الزمنية الصحيحة لإظهار جمال الإيقاع. بعد الإلقاء، تحدث لمدة دقيقة موضحًا: السبب الذي جعلك ترى هذا البيت تحديدًا هو الأقوى في المواجهة؟ وكيف يسهم هذا البيت في كسر غرور المظاهر؟",qs:[O("اكتب الإجابة.","يمكن اختيار البيت: «وأيُّ شيءٍ يؤبّد؟»؛ لأنه يمثل مواجهة فكرية قوية للمتكبر، إذ يذكّره بأن كل ما يملكه زائل ولا شيء يضمن له الخلود. ويسهم في كسر غرور المظاهر؛ لأن المال والثياب والمظاهر تفنى مع الزمن، ولا يبقى إلا حقيقة الفناء المشترك.")]},
{t:"نشاط ٢",ref:"استلهم فكرة البيت القائل: «أنا أولى بالحب منك وأحرى ... من كساءٍ يبلى ومالٍ ينفد». وصغ فقرة قصيرة من إنشائك تعبّر فيها عن أهمية تقديم المودة الإنسانية على المظاهر الفانية، ملتزمًا بأن تشتمل الفقرة على القواعد النحوية الآتية: أ- نعتًا سببيًّا. ب- حرف عطف يفيد الاستدراك أو الإضراب.",qs:[O("اكتب الفقرة.","المودة الإنسانية الصادقة أسمى من المظاهر الفانية، فالإنسانُ الكريمُ أثرُه الطيبُ يبقى في النفوس (نعت سببي)، ولكن المال والثياب يزولان مع الزمن (حرف استدراك)، بل إن التعاون بين الناس أقوى من الفوارق المادية؛ لذلك علينا أن نجعل المحبة أساس علاقاتنا، وأن نبتعد عن التكبر والغرور.")]},
{t:"نشاط ٣",ref:"«أنتَ لم تصنعِ الحريرَ الذي تلبسُ ... ولا اللؤلؤَ الذي تتقلّدُ»",qs:[
O("أ- بيّن الموقع الإعرابي للاسم الموصول (الذي) في الشطر الثاني.","«الذي»: اسم موصول مبني في محل نصب نعت (صفة) للحرير."),
O("ب- حدد المعطوف والمعطوف عليه.","المعطوف: اللؤلؤ. المعطوف عليه: الحرير.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"تخيل أن الشخص «المتعالي» الذي يخاطبه إيليا أبو ماضي قد تأثر بالقصيدة وقرر الرد عليه بأبيات أو رسالة اعتذار. صغ بأسلوبك فقرة نثرية على لسان هذا الشخص يقرّ فيها بخطئه، مستخدمًا بعض الرموز التي وردت في النص (مثل: التراب، الكساء، أحلام وحسان) لتوضيح تحوله الفكري.",qs:[O("اكتب الفقرة.","أدركتُ أنني أخطأتُ حين تعاليتُ على الناس، فقد كنتُ أظن أن المال والكساء يمنحانني قيمة أعلى من غيري، ثم أدركتُ أنني مثلهم من تراب، وأن الأحلام والآمال تجمعنا جميعًا. لذلك أعتذر لكل من أسأتُ إليه، وسأجعل قلبي مفتوحًا للمحبة والتواضع.")]},
{t:"نشاط ٢",ref:"اكتب من (٣-٤ أسطر) نصيحة مباشرة لكل متكبر، مستلهمًا معاني الفناء وأصل الطين المشترك التي وردت في الأبيات.",qs:[O("اكتب النصيحة.","أيها المتكبر، تذكّر أن أصلك من تراب، وأن المال والثياب زائلة، فلا تجعل ما تملكه سببًا لاحتقار غيرك؛ فالقيمة الحقيقية في أخلاقك وأثرك الطيب، والإنسان يُقاس بما يقدّم لا بما يملك.")]}]}]},
{t:"هيا نوظف لغتنا الجميلة",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١ (اضبط لغتك)",ref:"أولًا: اضبط لغتك:",qs:[
O("١- استلهم فكرة البيت القائل: «أنا أولى بالحب منك وأحرى ... من كساءٍ يبلى ومالٍ ينفد». وصغ فقرة قصيرة من إنشائك تعبّر فيها عن أهمية تقديم المودة الإنسانية على المظاهر الفانية، ملتزمًا بأن تشتمل الفقرة على: نعتًا سببيًّا، وحرف عطف يفيد الاستدراك أو الإضراب.","المودة الإنسانية الصادقة أسمى من المظاهر الفانية، فالإنسانُ الكريمُ أثرُه الطيبُ يبقى في النفوس، ولكن المال والثياب يزولان مع الزمن، بل إن التعاون بين الناس أقوى من الفوارق المادية؛ لذلك علينا أن نجعل المحبة أساس علاقاتنا، وأن نبتعد عن التكبر والغرور."),
O("٢- «أنت لم تصنعِ الحريرَ الذي تلبسُ ... ولا اللؤلؤَ الذي تتقلّدُ». أ- بيّن الموقع الإعرابي للاسم الموصول (الذي) في الشطر الثاني. ب- حدد المعطوف والمعطوف عليه.","«الذي»: اسم موصول مبني في محل نصب نعت للحرير.\nالمعطوف: اللؤلؤ. المعطوف عليه: الحرير.")]},
{t:"نشاط ٢ (تذوّق)",ref:"أجب عما يأتي:",qs:[
O("١- حدد نوع التشبيه في قول الشاعر: «فإنه غير جلمد»، ثم وضّح كيف أدى هذا التشبيه دوره في إثبات المشاركة الوجدانية بين الشاعر والإنسان الآخر؟","تشبيه بليغ؛ شبّه الإنسان بالجلمد في سياق النفي، للدلالة على أن الإنسان كائن حساس يتأثر ويحزن ويفرح، مما يؤكد المشاركة الوجدانية بين البشر."),
O("٢- استخرج من أبيات القصيدة: أ- تشبيهًا بليغًا يفيد التواضع وزوال الفوارق الطبقية. ب- صورة شعرية (استعارة أو تشبيهًا) تعبّر عن الجانب المادي الفاني في مقابل القيم الروحية.","أ) «إن قلبي للحب أصبح معبد»: تشبيه بليغ.\nب) «من كساءٍ يبلى ومالٍ ينفد»: صورة تجسد فناء المظاهر المادية وزوالها.")]},
{t:"نشاط ٣ (إملاء)",ref:"أجب عما يأتي:",qs:[
O("١- «تعامل مع اصدقاؤك بلطف، ولا تسؤ معاملتهم فيبتئسوا». في هذه الجملة أخطاء إملائية. حددها وصوّبها مع التعليل.","الخطأ: أصدقاؤك. الصواب: أصدقائك؛ لأنها مضاف إليه مجرور بالكسرة، وتُرسم على نبرة.\nالخطأ: تسؤ. الصواب: تُسِئْ."),
O("٢- بيّن سبب رسم همزة القطع في أول الكلمات التالية: (أنا – أحلام – أولى).","أنا: همزة قطع لأنها ضمير منفصل يبدأ بهمزة.\nأحلام: همزة قطع لأنها اسم يبدأ بهمزة قطع (جمع).\nأولى: همزة قطع لأنها اسم يبدأ بهمزة قطع (اسم تفضيل).")]},
{t:"نشاط ٤",ref:"تأمل مشهد «تساوي الشمس في إشراقها على القصر والكوخ معًا»، واكتب مقطعًا تأمليًّا من (٤ - ٥) أسطر تستلهم فيه هذا المعنى لرفض التمييز والتعالي بين البشر. احرص على أن: توظف صورة بيانية (تشبيهًا بليغًا أو استعارة) تبرز وحدة الأصل الإنساني – تبيّن أن نقاء السريرة وقيمة الأثر هما المقياس الحقيقي للرفعة، لا المظاهر والمنازل – تختم بعبارة حكيمة وموجزة تلخص رسالة العدالة والمساواة.",qs:[O("اكتب المقطع.","الشمس لا تفرق بين قصر وكوخ، فهي تشرق على الجميع بالضياء نفسه، وكذلك الإنسان لا يعلو بمظهره أو ماله، وإنما يسمو بنقاء قلبه وحسن أثره. فليس القصر دليلًا على الكرامة، ولا الكوخ دليلًا على النقص؛ وإنما التفاضل بالأخلاق والعمل الصالح. الحكمة: «الإنسان بقيمته لا بمظهره.»")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"أجب عما يأتي:",qs:[
O("اقرأ الجملة الآتية، واجعل النعت الحقيقي سببيًّا مغيرًا ما يلزم: «البحث العميق يثري المثقف».","في «البحث العميق يثري المثقف»: العميق نعت حقيقي. والصياغة المطلوبة تجعل النعت الحقيقي سببيًّا، مثل: «البحثُ العميقُ أثرُه يثري المثقفَ». والنعت السببي: العميقُ، وقد وصف ما بعده وهو «أثره»."),
O("«يهتم القائد العادل ببناء الوطن، وطننا الغالي؛ ليعيش أبناؤه في مجتمع تُظلّه العدالة، بعيدًا عن أي تعصب». استخرج: أ- نعتًا، واضبط آخره بالشكل. ب- بدلًا، وحدد نوعه.","النعت: الغالي. البدل: وطننا.")]},
{t:"نشاط ٢",ref:"أجب عما يأتي:",qs:[
O("١- تنوّعت الأساليب الإنشائية في النص؛ حدد نوع الأسلوب الإنشائي وغرضه البلاغي في كل مما يلي:\nأ- «يا أخي لا تمِلْ بوجهك عني».\nب- «فلماذا يا صاحبي التيهُ والصدودُ؟».","أ) نداء؛ غرضه الاستعطاف واستمالة المخاطب.\nب) استفهام؛ غرضه الإنكار والتعجب من الصد والخصام."),
M("٢- يبرز المحسن البديعي (الطباق) في قوله: «لا يكن للخصام قلبك مأوى ... إن قلبي للحب أصبح معبدًا». اختر:",["التناقض بين قلب ممتلئ بالمحبة وقلب ممتلئ بالعداوة.","أهمية بناء المعابد والمساجد وتجديدها.","الرغبة في التخلص من الثراء الذي يملأ الإنسان غرورًا.","التساوي في القوة الجسدية بين الطرفين."],0,"الطباق يبرز التناقض بين قلب المحبة وقلب العداوة.")]},
{t:"نشاط ٣",ref:"صوّب الخطأ الإملائي في الجمل الآتية مع بيان السبب:",qs:[O("(لا تَسُو إلى أخيك الإنسان) – (يبتئس المرء حين يسُو ظنه) – (لا تتكبر على زملاؤك في العمل).","لا تسو إلى أخيك الإنسان ← الصواب: لا تُسِئْ إلى أخيك الإنسان.\nيبتئس المرء حين يسو ظنه ← الصواب: يبتئس المرء حين يسوء ظنه.\nلا تتكبر على زملاؤك ← الصواب: لا تتكبر على زملائك.")]},
{t:"نشاط ٤",ref:"اكتب مقطعًا وجدانيًّا من (أربعة إلى خمسة) أسطر تبيّن فيه أن دمعة الحزن وابتسامة الفرح لا تختلفان بين فقير وغني، مستلهمًا فكرة التضامن الإنساني. احرص على أن: توظف أسلوبًا إنشائيًّا (نداءً أو استفهامًا) يوقظ المشاعر الإنسانية النبيلة – تؤكد أن المشاعر الصادقة هي الرابط الحقيقي الذي يوحد البشر – تختم بنصيحة وجدانية تحث على التراحم ومواساة الآخرين.",qs:[O("اكتب المقطع.","يا أخي الإنسان، ألا نشترك جميعًا في دمعة الحزن وابتسامة الفرح؟ إن الفقر والغنى لا يغيران طبيعة المشاعر الصادقة، فالإنسان يفرح ويحزن مهما اختلفت ظروفه. فلنرحم بعضنا بعضًا، ولنجعل المحبة جسرًا يجمع القلوب.")]}]}]},
{t:"التقييم الأسبوعي",f:[
{t:"المجموعة (أ)",acts:[
{t:"السؤال الأول (الكتابة)",ref:"صغ فقرة وجيزة تدعو فيها إلى التواضع ونبذ التعالي، موظفًا: نعتًا سببيًّا مجرورًا – وحرف عطف يفيد الترتيب والتعقيب، مع ضبط الجملة بالشكل التام.",qs:[O("اكتب الفقرة.","إن الإنسانَ المتواضعَ قلبُه الكريمُ محبوبٌ بين الناس، ثم يسعى إلى الخير، ولا يتعالى على غيره؛ لأن التفاضل الحقيقي بالأخلاق والعمل الصالح.")]},
{t:"السؤال الثاني (القواعد النحوية)",ref:"ميّز النعت الحقيقي من النعت السببي في الجملتين: «استمعتُ إلى خطيبٍ فصيحِ اللسانِ». – «استمعتُ إلى خطيبٍ فصيحٍ لسانُهُ».",qs:[O("ميّز.","١- «فصيحِ اللسانِ»: نعت حقيقي؛ لأنه وصف للخطيب نفسه.\n٢- «فصيحٍ لسانُهُ»: نعت سببي؛ لأن «فصيح» وصف لـ«اللسان».")]},
{t:"السؤال الثالث (التذوق والبلاغة)",ref:"حدد نوع الصورة البيانية وسر جمالها في قول الشاعر:\n«لا يكن للخصام قلبك مأوى ... إن قلبي للحب أصبح معبدًا»",qs:[O("حدد.","استعارة مكنية؛ صوّر القلب بالمأوى الذي ينزل فيه الخصام. وسر جمالها: تجسيد المعنى المعنوي وإبراز رفض الكراهية والدعوة إلى المحبة.")]},
{t:"السؤال الرابع (الإملاء)",ref:"صوّب الأخطاء الإملائية والنحوية في العبارة التالية مع التعليل: «إنَّ ابناؤنا هم بناة الغد، فلا تستهزء بقدراتهم».",qs:[O("صوّب.","الصواب: «إن أبناءنا هم بناة الغد، فلا نستهزئ بقدراتهم.»\nأبناءنا: همزة قطع، وصواب رسمها «أبناءنا».\nنستهزئ: الهمزة المتطرفة تُرسم على نبرة لأن ما قبلها مكسور.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"السؤال الأول (الكتابة)",ref:"صغ فقرة وجيزة تحث فيها على التراحم الإنساني ونبذ الأحقاد، موظفًا: حرف عطف يفيد الإضراب، مع ضبط الجملة بالشكل التام – ونعتًا سببيًّا منصوبًا.",qs:[O("اكتب الفقرة.","إن الإنسانَ الرحيمَ قلبُه يحترم الآخرين، ثم يساعد المحتاجين، لكن لا يقبل الظلم؛ فالمحبة أساس المجتمع السليم، والرحمة طريق إلى التعاون والسلام.")]},
{t:"السؤال الثاني (القواعد النحوية)",ref:"ميّز النعت الحقيقي من النعت السببي في الجملتين الآتيتين: «كُرِّمتِ المدرسةُ معلمًا مشهورًا فضلُهُ». – «كُرِّمتِ المدرسةُ معلمًا مشهورَ الفضلِ».",qs:[O("ميّز.","«معلمًا مشهورَ الفضلِ»: نعت حقيقي؛ لأن «مشهورًا» وصف للمعلم.\n«معلمًا مشهورًا فضلُهُ»: نعت سببي؛ لأن «مشهورًا» وصف للفضل.")]},
{t:"السؤال الثالث (التذوق والبلاغة)",ref:"حدد نوع الأسلوب (خبري أم إنشائي) وغرضه البلاغي في كل مما يأتي:\n«يا أخي لا تمل بوجهك عني ... ما أنا فحمة ولا أنت فرقد»",qs:[O("حدد.","في «يا أخي»: نداء غرضه الاستعطاف واستمالة المخاطب.\nوفي «ما أنا فحمة ولا أنت فرقد»: نفي، والغرض توضيح المساواة الإنسانية ونفي التمييز.")]},
{t:"السؤال الرابع (الإملاء)",ref:"صوّب الأخطاء الإملائية والنحوية في العبارة التالية مع التعليل: «عليك أن تستقبل بقلبك، ولا تيئس من رحمة الله أبدًا».",qs:[O("صوّب.","الصواب: «عليك أن تستقبل بقلبك، ولا تيأس من رحمة الله أبدًا.»")]}]},
{t:"المجموعة (ج)",acts:[
{t:"السؤال الأول (الكتابة)",ref:"صغ فقرة وجيزة تبيّن فيها أن التفاضل بين البشر بالعمل الصالح لا بالمظاهر، موظفًا: حرف عطف يفيد نفي الحكم عما بعده، مع ضبط الجملة بالشكل التام – ونعتًا سببيًّا مرفوعًا.",qs:[O("اكتب الفقرة.","إن الإنسانَ الصالحَ عملُه هو الذي يستحق التقدير، لا مظهره أو ماله، بل أخلاقه وأثره الطيب؛ فالقيمة الحقيقية في العمل الصالح.")]},
{t:"السؤال الثاني (القواعد النحوية)",ref:"ميّز النعت الحقيقي من النعت السببي في الجملتين الآتيتين: «سكنتُ في بيتٍ نظيفِ الغرفةِ». – «سكنتُ في بيتٍ نظيفةٍ غرفتُهُ».",qs:[O("ميّز.","بيت نظيفِ الغرفة: نعت حقيقي؛ لأن «نظيف» وصف للبيت.\nبيت نظيفةٍ غرفتُه: نعت سببي؛ لأن «نظيفة» وصف للغرفة.")]},
{t:"السؤال الثالث (التذوق والبلاغة)",ref:"حدد نوع الصورة البيانية وسر جمالها في قول الشاعر:\n«تشقى وتسعد في كسائي الرديمِ ... أنت في البردةِ الموشّاةِ مثلي»",qs:[O("حدد.","في قوله: «في كسائي البردة الموشاة مثلي» تظهر صورة بيانية تقوم على تصوير الثوب وما فيه من زينة، وتبرز قيمة المظاهر المادية في مقابل حقيقة الإنسان الفانية.")]},
{t:"السؤال الرابع (الإملاء)",ref:"صوّب الأخطاء الإملائية والنحوية في العبارة التالية مع التعليل: «لا يجرأ أحدٌ على اختراق خصوصية الآخرين دون اذن».",qs:[O("صوّب.","الصواب: «لا يجرؤ أحدٌ على اختراق خصوصية الآخرين دون إذن.»\nيجرؤ: الهمزة المتطرفة على الواو؛ لأن ما قبلها مضموم.\nإذن: تُكتب بالنون، وليست «اذن».")]}]}]}
];
const U3W5=[
{t:"مراجعة على الوحدة الثالثة",f:[
{t:"الأداءات الصفية والمنزلية",acts:[
{t:"السؤال الأول (حقوق الإنسان)",ref:"النص المعلوماتي (حقوق الإنسان بين العالمية والخصوصية): «فالمعايير العالمية تحدد الإطار العام الذي يصون الكرامة… في حين تقوم التشريعات الوطنية بتنظيم ممارستها بما يتوافق مع الدستور».",qs:[
M("المقصود بعبارة «حجر الأساس» في قوله: «يُعدّ احترام حقوق الإنسان حجر الأساس…»:",["البناء المحكم المتين.","الركيزة الجوهرية والمنطلق الرئيس.","السبب المباشر للتطور العسكري.","الشرط القانوني الوحيد للتقدم."],1,"«حجر الأساس» أي الركيزة الجوهرية والمنطلق الرئيس."),
M("«الكرامة الإنسانية لا تتحقق فقط بالحريات السياسية، بل تتطلب أيضًا تحسين الموارد وتوفير الفرص من خلال تحقيق ........ المستدامة». اختر الإجابة الصحيحة:",["العدالة التشريعية.","التنمية الشاملة.","المبادئ الدولية.","المعايير الأخلاقية."],1,"الإجابة: التنمية الشاملة."),
O("ما الفكرة الرئيسة للنص؟","التأكيد على كرامة الإنسان وحقوقه، والتوازن بين عالمية المبادئ وخصوصية التطبيق في المجتمعات المختلفة."),
O("المقابلة بين المعايير العالمية والتشريعات الوطنية: ما الفكرة التي أراد الكاتب إبرازها؟","أراد الكاتب إبراز أن المعايير العالمية تضع الإطار العام لحماية كرامة الإنسان، بينما تنظم التشريعات الوطنية تطبيق هذه المبادئ وفق دستور وقوانين كل مجتمع."),
O("أثر الأسلوب المنطقي: كيف ساعد في إقناع القارئ بعدم وجود صراع بين العالمية والخصوصية؟","أقنع القارئ بأن العالمية والخصوصية متكاملتان وليستا متعارضتين؛ فالعالمية تحمي المبادئ الأساسية، والخصوصية تنظم تطبيقها."),
O("الوظيفة الحجاجية للتاريخ والرسالات السماوية: ما الوظيفة الحجاجية التي أداها الاستشهاد بهما؟","تقديم دليل تاريخي وحضاري يؤكد أن احترام كرامة الإنسان وحقوقه ليس فكرة حديثة طارئة، بل له جذور في الرسالات السماوية والحضارات الكبرى.")
]},
{t:"السؤال الثاني (نص متحرر: وحدة الجوهر واختلاف المظاهر)",ref:"«إن الاختلاف بين البشر ليس إلا خديعة البصر، وتوهّم العقول. فكم فرّقت الألوان والأجناس واللغات بين أبناء الشعوب، حتى أمست الأرض ميدانًا للخصام بدلًا من أن تكون ملجأً للسلام! ومهما نأت ديارنا وتباينت لهجاتنا، فإننا نشترك في نبض واحد وشعور واحد؛ أفلسنا نفرح للأمل ونبكي للألم؟ أفلسنا نشتكي الظلام ونصبو إلى النور؟ إن الإنسانية جوهر أصيل لا يتجزأ، ولا يتفاضل فيه إنسان على آخر إلا بما يقدمه من خير ونفع لبني جنسه. إن العرق واللون والجاه أعراض زائلة، كالشمس تشرق ثم تأفل، وكالظل يمتد ثم ينحسر، أما الكرامة الإنسانية فهي الجوهر الثابت الذي أودعه الله في كل نفس. وما الحرب والشحناء إلا نتاج جهل مقرون بالكبر والغرور، يوم يظن المرء أنه أفضل من أخيه؛ أو لا شيء إلا لأنه وُلد في بقعة يراها بكبره الأفضل، أو يتكلم بلسان يراه بغروره سيد الألسن كافة. فهلم أخي الإنسان، نبنِ معًا عالمًا لا مكان فيه للتعصب، يتلاقى فيه الشرق والغرب، وتتآلف فيه الأجناس، ويبتسم فيه الأبيض للأسود. إن السعادة الحقيقية لن تكون في الاحتكار والاستعلاء، بل في العطاء والإخاء… فامدد إليّ يدك، فإنها يد أخيك!»",qs:[
M("الفكرة الرئيسة للفقرة الثانية:",["الاختلاف اللغوي أصل الحضارات.","خطورة الحروب على الاقتصاد.","الوحدة الإنسانية والشعور المشترك بين البشر.","دور الطبيعة في تحسين العواطف البشرية."],2,"الفقرة تؤكد الوحدة الإنسانية والشعور المشترك بين البشر."),
M("نوع الصورة البيانية في قول الكاتب: «أمست الأرض ساحةً للخصام»:",["استعارة تصريحية.","تشبيه بليغ.","مجاز مرسل.","استعارة مكنية."],1,"تشبيه بليغ."),
M("ما العلاقة بين جملتي: «فرّقت الألوان والأجناس» و«أمست الأرض ساحةً للخصام»؟",["سبب ونتيجة.","تعليل وتأكيد.","تقابل وتضاد.","إجمال وتفصيل."],0,"الجملة الأولى سبب، والثانية نتيجة."),
O("استخرج من النص سببين أرجعهما الكاتب لنفي الشحناء والتفاضل بين البشر، موضحًا المقاييس الحقيقية للمفاضلة بين الإنسان وأخيه من وجهة نظره.","سببا نفي الشحناء والتفاضل: التعصب للعرق واللون والجنس واللغة؛ والجهل والغرور والاعتقاد بتفوق الإنسان على غيره بسبب مولده أو لغته أو مكانه.\nالمقياس الحقيقي للمفاضلة: ما يقدمه الإنسان من خير ونفع لبني جنسه."),
O("وظّف الكاتب أسلوب الاستفهام الإنكاري والمقابلة للتأثير في القارئ. هات مثالًا لكل منهما من النص، وبيّن أثرها البلاغي في خدمة قضية المساواة.","مثال الاستفهام: «أفلسنا نفرح للأمل ونبكي للألم؟ أفلسنا نشتهي الظلام ونصبو إلى النور؟». أثره: إثارة العقل والمشاعر وإثبات وحدة المشاعر الإنسانية.\nمثال المقابلة: «الشرق والغرب» و«الأبيض والأسود». أثرها: إبراز وحدة البشر رغم اختلاف مظاهرهم، وترسيخ قيمة المساواة.")]},
{t:"السؤال الثالث (الحرية الفكرية)",ref:"النص النثري (الحرية الفكرية) للعقاد:",qs:[
O("في عصرنا الحالي ينساق الكثيرون وراء «الترند» والشائعات دون تثبّت. استخرج من مقال العقاد جملة تصلح لردع هذا السلوك، وفسّر وجه الاستشهاد بها.","الجملة: «أن ينظر ويمحّص». وجه الاستشهاد: الدعوة إلى فحص الأفكار والأخبار وعدم قبولها دون تمحيص ودليل."),
M("حدد المفهوم الصحيح لمصطلح «التمحيص» كما ورد في سياق جملة «أن ينظر ويمحّص»:",["قبول الفكر وتناقلها سريعًا لزيادة انتشارها بين الجمهور.","تقليب الفكرة واختبار صحتها وفحصها بعناية لتمييز جيدها من رديئها.","حفظ النصوص القديمة وترديدها في المحافل دون تغيير دلالاتها.","رفض كل ما قاله السابقون لمجرد أنه قديم."],1,"التمحيص: تقليب الفكرة واختبار صحتها وفحصها بعناية.")]},
{t:"السؤال الرابع (يا أخي الإنسان)",ref:"النص الشعري (يا أخي الإنسان) لإيليا أبو ماضي:",qs:[
O("ركّز الشاعر على تقلبات المادة وعدم ثباتها في قوله: «لا ... فهذي تأتي وتمضي… وأي شيء يؤبّد». أ- ما الأداة الفكرية التي استخدمها الشاعر لنزع صفة الخلود عن مقتنيات الشخص المتعالي؟ ب- كيف يخدم هذا التغير المستمر للماديات الفكرة الرئيسة للنص؟","أ) استخدم الشاعر التغير والفناء والتقابل بين الأشياء المتغيرة لنزع صفة الخلود عن الماديات.\nب) يثبت أن المال والثياب والمظاهر زائلة، فلا يصح أن تكون أساسًا للتكبر والتفاضل بين البشر."),
O("يقول الشاعر: «لا يكن للخصام قلبك مأوى … إن قلبي للحب أصبح معبدًا». وضّح كيف تساعد هذه الفكرة في نشر قيم التسامح والتعايش السلمي بين أفراد المجتمع الواحد. اكتب إجابتك في ثلاثة أسطر.","تدعو الصورة إلى التسامح ونبذ الكراهية، وجعل الحب أساس العلاقة بين أفراد المجتمع؛ لأن القلب الذي يسكنه الحب يكون أكثر قدرة على التعايش والسلام.")]}]},
{t:"الأداءات الصفية والمنزلية (٢)",acts:[
{t:"السؤال الأول (من روائع الأدب العربي)",ref:"اقرأ النص التالي من قصة (شمس وليل) لمحمود تيمور، ثم أجب: «انضممتُ وأسرتي إلى رفقة دولية في قطار سياحي سيقطع السويد في ثمانية أيام، كانت لكل أسرة مقصورة، وللطعام مواعيد، وليوم برنامج من الزيارات والرحلات، وعلى الموائد وضعت أعلام البلدان التي جاء منها المسافرون، فخفق أمامنا العلم المصري، وشعرت أن المسافر يحمل وطنه معه ولو ابتعد عنه آلاف الأميال، لم يكن القطار وسيلة نقل فحسب.»",qs:[
O("أ- علّل: لم يكن القطار في نظر الكاتب مجرد وسيلة نقل فحسب.","لأنه كان مجتمعًا صغيرًا جمع أسرًا من بلدان مختلفة، وأتاح للكاتب التعرف إلى الشعوب والثقافات."),
O("ب- ما الشعور الذي انتاب الكاتب عند رؤية العلم المصري على المائدة؟","الفخر والاعتزاز والانتماء إلى وطنه مصر."),
O("ج- «يحمل المسافر وطنه معه ولو ابتعد عنه آلاف الأميال». في ضوء هذه العبارة، بيّن كيف ينعكس انتماء المسافر لوطنه على تمثيله لهويته وثقافة بلده خارج الحدود.","يعتز بهويته وثقافته خارج وطنه فيمثل بلده بأخلاقه وسلوكه، ويحافظ على عاداته وقيمه، ويعرّف الآخرين بثقافته.")]},
{t:"السؤال الثاني (نص متحرر إثرائي)",ref:"من كتاب «عن الحرية أتحدث» لزكي نجيب محمود: «تتميز الحرية الإنسانية بكونها مكتسبة مرهونة بالفطرة المرتكزة على المعرفة والعلم بطبائع الأشياء. غير أن الشائع هو الفهم القاصر للحرية باقتصاره على «جانبها السلبي»، وهو مجرد التحرر وفك القيود والانطلاق دون اتجاه؛ في حين أن جوهرها الحقيقي يكمن في «جانبها الإيجابي البنّاء» الذي تقوم عليه الثقافات وتُبنى به الحضارات. وهذا البعد هو المقوّم الأساس لكرامة الإنسان ومسئوليته الأخلاقية، وبدونها لا قيام لحضارة ولا لعلوم أو فنون.»",qs:[
O("أ- يرى زكي نجيب محمود أن الحرية تتكون من جانبين (سلبي وإيجابي)، بينما يركز العقاد في نصه على الحرية بوصفها استقلالًا فكريًّا ومقاومة للجمود والتقليد. وازن بين النصين (الحرية الفكرية) مبينًا معنى «الحرية» عند كل منهما.","الجانب السلبي للحرية عند زكي نجيب محمود: التحرر من القيود والانطلاق دون اتجاه.\nأما العقاد فيركز على الاستقلال الفكري والتحرر من سلطان التقليد والجمود والخوف من آراء الآخرين."),
M("ب- أي النتائج الآتية تعبّر عن الرؤية المشتركة للكاتبين؟",["التحرر من القيود (الجانب السلبي) كافٍ وحده لبناء المجتمع.","الحرية الفكرية مجرد حق فردي يتوقف عند حدود رغبة الإنسان في الانطلاق دون غاية.","الحرية الفكرية ليست مجرد غياب للقيود، بل هي طاقة إيجابية واعية لبناء الحضارة والتقدم.","التقليد والمحاكاة هما الأساس الإيجابي الذي يُبقي التراث والثقافة من الاندثار."],2,"الرؤية المشتركة: الحرية طاقة إيجابية واعية لبناء الحضارة.")]},
{t:"السؤال الثالث (الإملاء)",ref:"صوّب الكلمات التي ورد بها خطأ إملائي في الجمل التالية، مع بيان السبب:",qs:[O("«لا يجوز تجزِئة حقوق الإنسان أو التمييز بين الفئات».\n«يتئثر الفرد ببيئته الثقافية والاجتماعية».","تجزئة: الهمزة متوسطة على نبرة؛ لأن ما قبلها مكسور.\nيتأثر: الهمزة متوسطة مفتوحة وما قبلها ساكن، فتُرسم على الألف.")]},
{t:"السؤال الرابع (الكتابة)",ref:"طلب منك مشرف جماعة الصحافة المدرسية كتابة «كلمة الصباح» للإذاعة المدرسية حول قضية: «احترام عادات الشعوب وثقافاتهم دون الإخلال بالحقوق الأساسية للإنسان». اكتب الكلمة من (ثلاثة) أسطر، موظفًا فيها (نعتًا سببيًّا) أو (بدل اشتمال)، واحرص على سلامة علامات الإعراب والرسم الإملائي للهمزات المتوسطة.",qs:[O("اكتب الكلمة.","إن احترام عادات الشعوب وثقافاتها قيمة إنسانية راقٍ قدرها، ولا يعني ذلك التخلي عن الحقوق الأساسية للإنسان. فعلينا أن نحترم التنوع الثقافي، وأن نحافظ على الإنسان كرامته، فالتعايش يقوم على الاحترام والعدل.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"السؤال الأول (القواعد النحوية)",ref:"اختر الإجابة الصحيحة:",qs:[
M("«أسهم هذا الرجل في صياغة القوانين». كلمة (الرجل) تعرب:",["نعتًا مرفوعًا.","بدلًا مطابقًا مرفوعًا.","فاعلًا مرفوعًا.","مضافًا إليه مجرورًا."],1,"«الرجل» بدل من اسم الإشارة «هذا»."),
M("حدد النعت الجملة في العبارة: «يسير المجتمع بخطى ثابتة نحو بناء مستقبل ملؤه الأمل»:",["بخطى ثابتة.","نحو بناء.","ملؤه الأمل.","ثابتة."],2,"«ملؤه الأمل» جملة اسمية تصف «مستقبل»."),
M("«تأثرت بـ ........ الحكيمة» اختر الصيغة الصحيحة:",["آرائه","آراءه","آراؤه","آراء"],0,"«آرائه» اسم مجرور بالباء، والهمزة المتوسطة المكسورة تُكتب على نبرة.")]},
{t:"السؤال الثاني",ref:"ميّز بين النعت والبدل في الجمل الآتية مع بيان نوعيهما:",qs:[O("(أ) شهد العالم صراعات كبرى كشفت غياب الضوابط.\n(ب) اعتنت الرسالات السماوية معظمها بتكريم بني آدم.\n(ج) أسهم المفكر العقاد في توضيح مفهوم الحرية.","(أ) «كبرى»: نعت حقيقي.\n(ب) «معظمها»: بدل بعض من كل.\n(ج) «العقاد»: بدل مطابق.")]},
{t:"السؤال الثالث (الإملاء)",ref:"صوّب الكلمات التي ورد بها خطأ إملائي في الجمل التالية، مع بيان السبب:",qs:[O("«ولد محمود تيمور في بيأة ارتبطت بالعلم والأدب».\n«بدئ الكاتب صياغة أعماله باللغة العربية الفصحه».","بيأة ← بيئة؛ لأن الهمزة مفتوحة وما قبلها حرف علة ساكن فتُكتب على نبرة.\nبدئ ← بدأ.\nالفصحه ← الفصحى.")]},
{t:"السؤال الرابع (الكتابة)",ref:"(يواجه التعليم المعاصر تحديًا في الجمع بين مواكبة التطور وصون الهوية). اكتب في حدود (٥ - ٧) أسطر فقرة تأملية لمجلة الحائط المدرسية تبيّن فيها كيف يمكن للمنظومة التعليمية أن تنمّي مهارات العصر لدى النشء دون إفقادهم قيمهم المجتمعية المتوارثة، موظفًا فيها (بدل اشتمال)، واحرص على سلامة علامات الإعراب والرسم الإملائي للهمزات المتوسطة.",qs:[O("اكتب الفقرة.","التعليم الحديث قادر على مواكبة التطور مع الحفاظ على الهوية والقيم المتوارثة؛ فالمهارات الرقمية الحديثة يمكن أن تتكامل مع القيم الأصيلة، وبذلك ينشأ جيل واعٍ يجمع بين المعرفة المعاصرة والانتماء الثقافي.")]}]}]},
{t:"التقييم الأسبوعي",f:[
{t:"المجموعة (أ)",acts:[
{t:"السؤال الأول",ref:"النص المعلوماتي (حقوق الإنسان بين العالمية والخصوصية):",qs:[O("استخدم الكاتب التأصيل التاريخي عندما أشار إلى «الرسالات السماوية والحضارات الكبرى». ما الوظيفة الحجاجية التي أدّاها الاستشهاد بالتاريخ والرسالات السماوية في النص؟","الاستشهاد بالتاريخ والرسالات السماوية يؤدي وظيفة حجاجية تتمثل في تأكيد أصالة حقوق الإنسان دينيًّا وحضاريًّا، وإثبات أن احترام الإنسان ليس فكرة مستحدثة، وإنما له جذور تاريخية وحضارية.")]},
{t:"السؤال الثاني",ref:"النص النثري (الحرية الفكرية):",qs:[O("ناقش الكاتب فكرة «سلطان الوهم أو العادة» في مقابل «سلطان العقل». في ضوء فهمك للنص، كيف يتحول التقليد الأعمى إلى قيد غير مرئي يأسر عقل الإنسان؟","التقليد الأعمى يتحول إلى قيد غير مرئي عندما يستسلم الإنسان لما اعتاده الناس دون تفكير أو نقد، فيصبح خائفًا من مخالفة الجماعة، ويقبل الأفكار لمجرد شيوعها.")]},
{t:"السؤال الثالث",ref:"النص الشعري (يا أخي الإنسان): في النص مقابلات واضحة مثل: (تشقى وتسعد) و(يبلى وينفد).",qs:[O("كيف أسهم التضاد بين (تشقى وتسعد) في دحض حجة المتكبر بأن ماله يحميه من تقلبات الحياة؟ وما الفرق بين دلالة الفعل (يبلى) للثياب والفعل (ينفد) للمال في البيت الأخير؟","التضاد بين (تشقى وتسعد) يبين أن الشقاء والسعادة حالتان إنسانيتان يشترك فيهما الغني والفقير، فلا يستطيع المال أن يحمي صاحبه من تقلبات الحياة.\nيبلى: يدل على اهتراء الثياب وزوالها مع الزمن.\nينفد: يدل على انتهاء المال ونفاده وزواله.")]},
{t:"السؤال الرابع (القواعد والإملاء)",ref:"«يسعى ذلكم الإعلان العالمي المشترك إلى صون كرامة الإنسان الفرد من أي طمس».",qs:[
O("أ- استخرج نعتًا، واضبط آخره بالشكل، وحدد نوعه. ب- استخرج بدلًا وحدد نوعه.","النعت: العالمي، وهو نعت مرفوع.\nالبدل: الإعلان."),
M("اختر الكلمة الصحيحة إملائيًّا ونحويًّا لملء الفراغ: إن احترام كرامة الإنسان يبعث على ........ في نفوس الأفراد.",["الإطْمِئْنَانِ","الإطمأنان","الاطمئنان","الطمأنينة"],3,"الكلمة الصحيحة: «الطمأنينة».")]},
{t:"السؤال الخامس (الكتابة)",ref:"اكتب لافتة إرشادية قصيرة (في سطرين) تحث فيها زملاءك على «احترام آراء الآخرين وعدم الإساءة إليهم»، مع اشتراط أن تتضمن لافتتك: جملة تشتمل على بدل مطابق – كلمة بها همزة متوسطة على واو.",qs:[O("اكتب اللافتة.","يا زملائي، احترموا آراء الآخرين، ولا تجعلوا الاختلاف سببًا للإساءة؛ فالحوار الهادئ أساسُ التفاهم، وأخوكم أحمد قدوةٌ في احترام الرأي الآخر.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"السؤال الأول",ref:"النص المعلوماتي (حقوق الإنسان بين العالمية والخصوصية):",qs:[O("وازن الكاتب في نصه بين فكرتي: «عالمية المبادئ» و«خصوصية التطبيق في كل مجتمع». كيف أقنعنا الكاتب بأن احترام خصوصية الشعوب لا يتعارض أبدًا مع كرامة الإنسان وحقوقه العامة؟","أقنع الكاتب بأن خصوصية الشعوب لا تتعارض مع الحقوق الإنسانية العامة؛ فالخصوصية تتعلق بطريقة التطبيق والعادات، أما الكرامة والحقوق الأساسية فلا يجوز إهدارها باسم العادات والتقاليد.")]},
{t:"السؤال الثاني",ref:"النص النثري (الحرية الفكرية): يبيّن العقاد أن الإنسان قد يقع أسيرًا لرأي الأغلبية لمجرد الخوف من مواجهة المجتمع.",qs:[O("في ضوء فهمك للنص، كيف يعطل الخوف من كلام الناس استقلال العقل وحريته في التفكير؟","الخوف من كلام الناس يجعل الإنسان أسيرًا لرأي الجماعة، فيتخلى عن استقلال عقله ويكرر ما يقوله الآخرون بدل أن يفكر ويفحص الأدلة بنفسه.")]},
{t:"السؤال الثالث",ref:"النص الشعري (يا أخي الإنسان):",qs:[O("ما المعنى الإنساني الذي أراد الشاعر إيصاله حين جعل قلبه «معبدًا للحب»؟","أراد أن يجعل الحب قيمة مقدسة ومكانًا ثابتًا في قلبه، وأنه يرفض الخصام والكراهية.")]},
{t:"السؤال الرابع (القواعد والإملاء)",ref:"«إن هذا الحوار الهادئ يضمن حماية الكرامة الإنسانية لكل فرد في المجتمع».",qs:[
O("أ- استخرج نعتًا، واضبط آخره، واذكر نوعه. ب- استخرج بدلًا وحدد نوعه.","النعت: الهادئ، نعت منصوب.\nالبدل: الحوار."),
M("اختر الكلمة الصحيحة إملائيًّا ونحويًّا لملء الفراغ: يحرص المعلم المخلص على بث ........ في نفوس طلابه.",["التَّفَاؤُلِ","التَّفَاءُل","التَّفَائُلِ","التَّفَاؤُولِ"],0,"الكلمة الصحيحة: «التفاؤل».")]},
{t:"السؤال الخامس (الكتابة)",ref:"اكتب عبارة إرشادية في سطرين تنصح فيها زملاءك بـ «استعمال العقل ونبذ التعصب الفكري»، بشرط أن تتضمن: جملة تشتمل على نعت جملة – كلمة بها همزة متوسطة على نبرة.",qs:[O("اكتب العبارة.","استعملوا العقلَ الواعيَ، ولا تتعصبوا لفكرةٍ خاطئة؛ فالحوار الذي يقوم على الدليل يفتح طريقًا إلى الحقيقة.")]}]},
{t:"المجموعة (ج)",acts:[
{t:"السؤال الأول",ref:"النص المعلوماتي (حقوق الإنسان بين العالمية والخصوصية):",qs:[O("أكّد الكاتب أن التذرّع بالعادات والتقاليد لا يصح أن يكون حجة لحرمان الإنسان من حقوقه الطبيعية. كيف ردّ الكاتب بالحجة والمنطق على من يستغل خصوصية المجتمع لتبرير الظلم؟","ردّ بأن العادات والتقاليد لا يجوز أن تكون مبررًا لسلب الحقوق الطبيعية للإنسان؛ لأن كرامة الإنسان وحقوقه الأساسية مبادئ عامة لا تسقط باختلاف المجتمعات.")]},
{t:"السؤال الثاني",ref:"النص النثري (الحرية الفكرية): يؤكد العقاد أن حرية التفكير هي أساس كل فعل نافع للإنسان.",qs:[O("بيّن بأسلوبك كيف يؤدي منع حرية التفكير إلى حرمان المجتمع من التجديد والإبداع.","منع حرية التفكير يحرم المجتمع من النقد والتجديد والإبداع؛ لأن الأفكار الجديدة تحتاج إلى عقل حر يفحص الواقع ويقترح حلولًا غير مألوفة.")]},
{t:"السؤال الثالث",ref:"النص الشعري (يا أخي الإنسان): يقارن الشاعر بين حقيقة الإنسان المخلوق من تراب، وزينة الثياب والذهب التي يتباهى بها البعض.",qs:[
O("١- كيف بيّن الشاعر أن المظاهر الزائفة تزول ويبقى جوهر الإنسان الحقيقي؟","الذهب والثياب والمال كلها مادية قابلة للفناء، بينما يتمثل جوهر الإنسان الحقيقي في أخلاقه ومحبته وعلمه."),
O("٢- ما الأثر النفسي الذي يتركه نداء الشاعر المتكرر بـ «يا أخي» في قلب القارئ؟","يثير الشعور بالألفة والقرب والمساواة، ويجعل القارئ يشعر بأن الشاعر يخاطبه في إنسانيته.")]},
{t:"السؤال الرابع (القواعد والإملاء)",ref:"«أعجبني هذا المفكر أسلوبُه الراقي في ترسيخ قيم التعايش».",qs:[
O("أ- استخرج نعتًا، واضبط آخره، واذكر نوعه. ب- استخرج بدلًا وحدد نوعه.","النعت: الراقي.\nالمفكر: بدل."),

const FINREV={t:"المراجعة النهائية على الفصل الدراسي الأول",acts:[
{t:"السؤال الأول (القراءة)",ref:"أولًا: من نص (العلم بين القانون والضمير)، ثانيًا: من نص (التقنية وصناعة الرأي العام)، ثالثًا: من نص (حقوق الإنسان بين العالمية والخصوصية).",qs:[
O("كيف أسهمت الاكتشافات البشرية الأولى (كإشعال النار وصناعة الأدوات) في تغيير علاقة الإنسان بالعالم من حوله كما تفهم من النص؟","ساعدت على السيطرة على بعض مظاهر الطبيعة، وتوفير احتياجاته الأساسية، وتحسين قدرته على مواجهة البيئة وتطوير حياته."),
O("«صار العلم ركيزة أساسية في تقدم المجتمعات وازدهارها». ناقش هذه العبارة في ضوء فهمك للنص، موضحًا ما قد يترتب على تخلي أي مجتمع عن هذه الركيزة في العصر الحالي.","العلم يطوّر الطب والصناعة والاتصالات والتعليم. وإذا تخلى مجتمع عن العلم في العصر الحديث فإنه يتعرض للتراجع وفقدان القدرة على المنافسة وحل مشكلاته ومواكبة التطور."),
O("حلّل كيف عالج الكاتب قضية تأثير التقنية في تشكيل الرأي العام، مبينًا ما إذا كان قد تناولها بموضوعية أم بتحيز، مع الاستشهاد بما ورد في النص.","عالج الكاتب تأثير التقنية بعرض أثرها في سرعة انتشار المعلومات، مع التنبيه إلى أن التقنية ليست وحدها المسئولة؛ بل يتوقف أثرها على طريقة استخدامها ووعي المستخدم وقدرته على التمييز بين الشهرة والمصداقية. وكان موضوعيًّا لا متحيزًا."),
O("ما الهدف الحقيقي والدافع الرئيس وراء صياغة «الإعلان العالمي لحقوق الإنسان» كما بيّنه الكاتب؟","حماية كرامة الإنسان وحقوقه الأساسية ووضع مبادئ عامة تحول دون انتهاك تلك الحقوق."),
O("وضّح من خلال فهمك للنص كيف كشفت الصراعات الكبرى خطورة غياب الضوابط القانونية والأخلاقية، وكيف ساهم ذلك في تغيير طبيعة العلاقة بين الدولة والفرد؟","كشفت الصراعات والحروب خطورة غياب الضوابط القانونية والأخلاقية، وأدت إلى إعادة النظر في علاقة الدولة بالفرد، والتأكيد على ضرورة حماية حقوق الإنسان بقواعد ومبادئ واضحة.")]},
{t:"السؤال الثاني (من روائع الأدب العربي)",ref:"اكتب في (٣) أسطر عن عملين أدبيين مما درست؛ موضحًا الفكرة الرئيسة لكلٍّ منهما، وأهم القيم المتضمنة فيها.",qs:[O("اكتب عن عملين.","يمكن الاختيار من: «حكايات الغريب»: تبرز قيمة التضحية والبطولة في مواجهة الأزمات، وأن الإنسان البسيط قد يصبح بطلًا.\n«عودة الروح»: تؤكد قيمة الأسرة والانتماء والوحدة، وأثر الأحداث الوطنية في وعي الأفراد.\n«كفاح طيبة»: مقاومة الاحتلال والدفاع عن الوطن وقيمة التضحية والصمود.\n«الأرض»: الارتباط بالأرض والدفاع عنها والتمسك بالحق والكرامة.\n«شمس وليل»: الانتماء للوطن وأثر السفر والاحتكاك بالشعوب في وعي الإنسان بهويته.")]},
{t:"السؤال الثالث (النصوص النثرية)",ref:"أولًا: من نص (الخلق جوهر الفضيلة)، ثانيًا: من نص (بين الذوق والعقل)، ثالثًا: من نص (الحرية الفكرية).",qs:[
O("بيّن الصورة البيانية وسر جمالها في قوله: «حتى يبكي قلبه قبل أن تبكي عيناه».","استعارة مكنية؛ صوّر القلب بإنسان يبكي. وجمالها: تجسيد شدة التأثر والحزن والمبالغة في تصوير عمق المشاعر."),
O("«الضمير هو الحارس الأمين لسلوك الإنسان لا عيون البشر». ناقش هذه العبارة مستدلًّا بما ورد في الفقرة من مقارنة بين حالتي الأمن والخوف، والسر والعلانية.","الضمير هو الرقيب الداخلي الذي يدفع الإنسان إلى الصواب حتى في غياب الرقابة الخارجية. ويظهر الخلق الحقيقي لمن يلتزم الفضيلة في كل الأحوال: في الأمن والخوف، وفي السر والعلانية."),
O("ما المعيار الفاصل الذي اعتمده الكاتب للتمييز بين الأمم المتحضرة وتلك «البدائية»؟ وكيف يسهم غياب الحس الجمالي في انحدار قيمة المجتمع؟","المعيار: مدى امتلاكها للحس الجمالي والقدرة على تقدير الجمال. وغيابه يؤدي إلى انحدار الروح والقيم ويعطل تنظيم الحياة، فيفقد المجتمع قيمته الحضارية."),
O("اعتمد الكاتب في فقرته على أسلوب الشرط، وتكرار صيغ الأمر، والمزاوجة اللفظية؛ بيّن الأثر الدلالي لهذه الوسائل في إقناع القارئ بفكرته.","أسلوب الشرط يربط النتائج بالأسباب، وتكرار الأمر يحث القارئ على العمل، أما المزاوجة اللفظية مثل «الفخمة الضخمة» و«الجميلة الجليلة» فتعطي إيقاعًا موسيقيًّا وتؤكد المعنى وتجعله أكثر تأثيرًا وإقناعًا."),
O("ما الضابط الأساس لحرية التفكير كما يراه الكاتب؟","العقل والدليل والحجة؛ فالحرية الفكرية ليست فوضى، وإنما تفكير مستقل قائم على الفحص والتمحيص."),
O("حدد الكاتب ثلاثة موانع أو قيود قد تُرهب الإنسان وتسلبه شجاعته الفكرية؛ اذكرها، مبينًا كيف يتغلب المفكر الحر عليها.","الموانع: الخوف من الناس ورأي الأغلبية، والتقليد الأعمى والعادات الموروثة دون فحص، وسلطان الوهم أو الجمود الفكري. ويتغلب المفكر الحر عليها باستخدام العقل والتمحيص والدليل والشجاعة في إعلان الرأي الصحيح."),
O("«الحرية الفكرية لا تعني الفوضى»؛ ناقش هذه العبارة مبينًا الآثار السلبية التي قد تلحق بالمجتمع إذا تحكم «الهوى والتقليد الأعمى» وغاب «الدليل والحجة» في الحوارات الفكرية.","الحرية الفكرية تعني إعمال العقل في إطار الدليل والمسئولية. وإذا تحكم الهوى والتقليد الأعمى في الحوار انتشرت الأفكار الخاطئة والشائعات، وغاب التفكير النقدي، وتراجع الإبداع والتجديد.")]},
{t:"السؤال الرابع (النصوص الشعرية)",ref:"أولًا: من نص (العلم نور)، ثانيًا: من نص (أثر الكلمة وحفظ اللسان)، ثالثًا: من نص (يا أخي الإنسان).",qs:[
O("اعتمد الشاعر على أسلوب القصر والتوكيد في توضيح فكرته. وضّح ذلك.","استخدم الشاعر وسائل التوكيد والقصر لتثبيت قيمة العلم، وإظهار أن العلم أساس التقدم والرقي، وأن الضمير والأخلاق مرتبطان بالعلم الصحيح."),
O("ما القيمة الفنية لقول الشاعر: (فاز أسلمنا ضميرًا)؟","إبراز أهمية الضمير والأخلاق، والتأكيد على أن الفوز الحقيقي يكون بسلامة الضمير وحسن الخلق."),
O("بيّن نوع الأسلوب الإنشائي وغرضه البلاغي في قوله: «والسرَّ فاكتمه ولا تنطقْ به»، موضحًا القيمة الجمالية للجمع بين الأمر والنهي في شطر واحد.","أسلوب إنشائي طلبي يشتمل على أمر (اكتمه) ونهي (لا تنطق)، والغرض: النصح والإرشاد. والجمع بينهما يؤكد ضرورة حفظ السر من جهتين: الحث على كتمانه، والتحذير من إفشائه."),
O("يرى الشاعر أن خطر إفشاء السر لا يقتصر على مجرد انتشاره، بل يمتد إلى تشويهه، دلّل على ذلك من خلال فهمك للشطر الأخير من البيت الثاني.","السر إذا خرج من صاحبه لا يبقى على صورته الأصلية، بل تتناقله الألسنة بالزيادة والتحريف: «نشرته ألسنة تزيد وتكذب»."),
O("يقيم الشاعر في البيتين الأول والثاني مقارنة تهكمية بين أمانيه وأماني الشخص المتكبر؛ اشرح هذه المقارنة موضحًا الحقيقة التي أقرها في البيت الثالث.","تقارن بين أماني الشاعر البسيطة المرتبطة بالتراب وأماني المتكبر المرتبطة بالذهب، وتبين الحقيقة التي أقرها في البيت الثالث وهي أن كل شيء مادي زائل وأن الإنسان مهما ادعى الغنى والمكانة مصيره الفناء."),
O("بيّن نوع الأسلوب الإنشائي وغرضه البلاغي في ختام البيت الثالث: «وأيُّ شيءٍ يؤبَّد؟».","استفهام إنكاري، غرضه النفي والتحقير (إنكار الخلود) والتذكير بحتمية الفناء.")]},
{t:"السؤال الخامس (الكتابة)",ref:"اكتب ما يأتي:",qs:[
O("طلب منك مسئول الإذاعة المدرسية تقديم «فقرة حوارية» لإلقائها في طابور الصباح حول قضية: «الاختلاف في عادات الشعوب وتقاليدهم لا يمنع تكوين صحبة إنسانية راقية». اكتب الفقرة في (ثلاثة) أسطر، واحرص على سلامة علامات الإعراب والرسم الإملائي للهمزات المتوسطة.","قال الطالب: هل اختلاف عادات الشعوب يمنع الصداقة؟ فأجابه زميله: لا، فالاختلاف سنة الحياة، وما يجمعنا من قيم إنسانية أكبر مما يفرقنا. إن احترام الآخر والحوار الهادئ يصنعان صحبة راقية، ويجعلان التنوع مصدرًا للتعارف والتعاون لا سببًا للكراهية."),

 if(!f.acts){A.innerHTML=crumbs(c)+`<h2>${H(f.t)}</h2><div class="act c0"><div class="q">المحتوى قيد الإعداد — سيُضاف قريبًا.</div></div>`;return}

 A.innerHTML=crumbs(c)+`<h2>${H(f.t)}</h2><div class="score"><span>اختر الإجابة ليظهر التصحيح، واضغط «عرض الإجابة» في الأسئلة المقالية</span><button class="btn ghost" id="dn"></button></div>`+
 f.acts.map((a,ai)=>`<section class="act c${ai%6}"><h3>${H(a.t)}</h3><div class="ref">${H(a.ref)}</div>${a.qs.map((q,i)=>qHTML(q,i,ai)).join('')}</section>`).join('');
 const key=R,b=document.getElementById('dn'),sync=()=>{const d=isDone(key);b.textContent=d?'✓ تم الإنجاز':'تحديد كمنجَز';b.className='btn'+(d?'':' ghost')};b.onclick=()=>{sd(key,!isDone(key));sync()};sync();
 A.querySelectorAll('.q').forEach(el=>{
  const q=f.acts[el.dataset.a].qs[el.dataset.i];
  if(q.k==='mcq')el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const n=+b.dataset.n,ok=n===q.a;
   el.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.n===q.a)o.classList.add('ok')});
   if(!ok)b.classList.add('bad');
   el.querySelector('.fb').outerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'إجابة صحيحة ✓':'إجابة خاطئة ✗ — الصحيحة: '+L[q.a]}<br>${H(q.e)}</div>`;
  });
  else el.querySelector('.show').onclick=e=>{const a=el.querySelector('.ans');a.hidden=!a.hidden;e.target.textContent=a.hidden?'عرض الإجابة النموذجية':'إخفاء الإجابة'};
 });
}
function qHTML(q,i,ai){
 const body=q.k==='mcq'?q.o.map((o,n)=>`<button class="opt" data-n="${n}"><i>${L[n]}-</i>${H(o)}</button>`).join('')+'<div class="fb"></div>':
 `<button class="btn show">عرض الإجابة النموذجية</button><div class="ans" hidden>${H(q.a).replace(/\n/g,'<br>')}</div>`;
 return `<div class="q" data-a="${ai}" data-i="${i}"><div class="qt">${q.n||ar(i+1)}. ${H(q.q).replace(/\n/g,'<br>')}</div>${body}</div>`;
}
document.getElementById('tg').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==R){R=h;render()}});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(a){e.preventDefault();nav(a.getAttribute('href').slice(1))}});
render();
</script>
</body>
</html>
