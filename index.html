O("ضع علامة (√) أمام ما تحقق في أدائك:\n• حددت الفكرة الأساسية قبل أن أبدأ.\n• استخدمت روابط واضحة مثل (لأن – لذلك – غير أن – ومن ثم – وهكذا…).\n• تجنبت التكرار والإطالة غير الضرورية.\n• ختمت بجملة واضحة ومباشرة.\n• تحدثت بصوت واضح ونبرة مناسبة للمعنى.\n• رتبت أفكاري قبل بدء الحديث.\n• التزمت بزمن الحديث.","تقييم ذاتي للطالب بحسب مدى تحقق كل مهارة.")]},
{t:"نشاط ٢ (فقرة)",ref:"اكتب فقرة متماسكة (من ثمانية إلى عشرة أسطر) تجيب فيها عن السؤال: «كيف يتحول المتلقي النشط من صفة «الضحية السلبية» إلى مرتبة «الشريك» في نشر الشائعات الرقمية؟». تتضمن فقرتك: جملة افتتاحية واضحة تعبر عن موقفك، ومبررًا منطقيًّا يدعم رأيك، ومثالًا من النص أو من الواقع، وجملة ختامية تؤكد فكرتك.",qs:[
O("اكتب الفقرة.","إجابة استرشادية: لم يعد المتلقي الرقمي ضحية سلبية بالكامل، بل صار شريكًا في صناعة الشائعة حين يعيد نشر المحتوى دون تحقق. فهو يختار ما يشاركه، وكل إعادة نشر تضاعف انتشار الخبر الزائف. ومثال ذلك من يشارك خبرًا مثيرًا لمجرد أنه يوافق ميوله. لذا تظل مسئولية التحقق قبل النشر هي خط الدفاع الأول عن وعي المجتمع.")]},
{t:"نشاط ٣",ref:"أجب عما يأتي:",qs:[
O("أ- ضع خطًّا تحت الاسم الممنوع من الصرف فيما يأتي: مخاطر – أبحاث – مسئولون – ذكرى.","[مخاطر] (صيغة منتهى الجموع)، [ذكرى] (اسم منتهٍ بألف التأنيث المقصورة)."),
O("ب- أكمل الجمل الآتية باسم ممنوع من الصرف وفقًا لما بين القوسين، مع الضبط التام:\n(١) ينبغي ألا تنخدع بـ ........ زائفة تجذب الانتباه في العالم الافتراضي. (صيغة منتهى الجموع)\n(٢) تحاول الجهات المسئولة تقديم نصائح ........ لمستخدمي الأجهزة. (اسم منتهٍ بألف التأنيث المقصورة)\n(٣) تحتاج مواجهة الهجمات السيبرانية إلى عقول ........ في الأمن الرقمي. (اسم منتهٍ بألف التأنيث الممدودة)","(١) بوسائلَ (صيغة منتهى الجموع مجرورة بالفتحة).\n(٢) كبرى (اسم منتهٍ بألف التأنيث المقصورة).\n(٣) علماءَ (اسم منتهٍ بألف التأنيث الممدودة).")]},
{t:"نشاط ٤",ref:"اقرأ العبارتين الآتيتين ثم أجب: (أ) «تتبّع، تحقّق، فكّر». (ب) «ينبغي عليك أن تتتبع مصدر الخبر، وأن تتحقق من صحته، ثم تعمل عقلك وتفكر فيه».",qs:[
O("أي العبارتين تمثل الإيجاز؟ ولماذا؟ وما نوعه؟","العبارة (أ)؛ لأنها دلّت على معانٍ عظيمة بألفاظ قليلة موجزة. نوعه: إيجاز قصر.")]},
{t:"نشاط ٥",ref:"أجب عما يأتي:",qs:[
M("أ(١)- تخيّر الكتابة الصحيحة إملائيًّا: ينبغي للمتلقي ........ بدقة المصادر قبل النشر.",["الإهتمام","الاهتمام"],1,"«الاهتمام» مصدر خماسي، ألفه ألف وصل."),
M("أ(٢)- تخيّر الكتابة الصحيحة إملائيًّا: يقع بعض الشباب في ........ بسبب التضليل الرقمي.",["ارتباك","إرتباك"],0,"«ارتباك» مصدر خماسي، ألفه ألف وصل."),
O("ب- علّل كتابة الهمزة على صورتها في الكلمات الآتية: إعلان – استمتاع – انخداع.","إعلان: همزة قطع (مصدر رباعي).\nاستمتاع: ألف وصل (مصدر سداسي).\nانخداع: ألف وصل (مصدر خماسي).")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"اكتب فقرة (من ثمانية إلى عشرة أسطر) تجيب عن السؤال: «كيف يساهم (الوعي المعلوماتي) في حماية عقل الفرد من الانجراف وراء المحتوى الانفعالي السريع؟».",qs:[
O("اكتب الفقرة.","إجابة يكتبها الطالب. فكرة استرشادية: الوعي المعلوماتي يعلّم الفرد التحقق من المصدر وتمييز الحقيقة من الشائعة، فيتمهّل قبل التفاعل، ويحمي عقله من الانفعال والانقياد الأعمى.")]},
{t:"نشاط ٢",ref:"أجب عما يأتي:",qs:[
O("أ- اكتب جملة من إنشائك حول (مخاطر التسرع في التفاعل مع التريند) تتضمن اسمًا ممنوعًا من الصرف لعلة واحدة، ثم بيّنها.","«إياك والانسياق وراء دعاوى مضللة.» (دعاوى: اسم منتهٍ بألف التأنيث المقصورة)."),
O("ب- استخرج من الجمل الآتية كل اسم ممنوع من الصرف، وعلّل سبب منعه:\n(١) يبحث الوعي المعلوماتي في رسائل تدعو إلى التحقق قبل الانفعال.\n(٢) تحتاج حماية الحسابات الرقمية إلى تدابير صارمة لمواجهة الاحتيال.\n(٣) تبني المنصات الذكية فقاعة تصفية حول قناعات عظمى لدى الأفراد.","رسائل وتدابير: صيغة منتهى الجموع.\nعظمى: اسم منتهٍ بألف التأنيث المقصورة.")]},
{t:"نشاط ٣",ref:"اقرأ العبارة الآتية ثم أجب: «الوعي المعلوماتي يمكّنك من التمييز بين الصواب والخطأ، وبين الحقيقة والشائعة، وبين النقد والتجريح».",qs:[
O("حدد نوع الإطناب الوارد في العبارة السابقة، وبيّن قيمته البلاغية.","إطناب بالتفصيل بعد الإجمال، وفائدته توضيح المعنى وتأكيده.")]},
{t:"نشاط ٤ (مشهد مسرحي)",ref:"اكتب مشهدًا مسرحيًّا قصيرًا (من ستة إلى ثمانية أسطر) تتحدث فيه عن فتاة صنعت محتوى هادفًا لكنه لم يحقق (تريند)، وكيف واجهت هذا التحدي بتمسكها بالمصداقية بدلًا من الإثارة. احرص على: بداية – حدث أساسي – نتيجة – خاتمة قصيرة.",qs:[
O("اكتب المشهد.","مشهد استرشادي عن الفتاة والمصداقية مقابل الترند: تشعر الفتاة بالإحباط لقلة المشاهدات، فتنصحها صديقتها بتقليد الإثارة، لكنها ترفض وتتمسك بالمصداقية، وفي النهاية يلتفت الجمهور تدريجيًّا إلى محتواها الصادق.")]}]}]},
{t:"التقييم الأسبوعي",f:[
{t:"المجموعة (أ)",acts:[
{t:"السؤال الأول (قراءة)",ref:"من نص (التقنية وصناعة الرأي العام) اقرأ ثم أجب:\n"+PT1,qs:[
MAIN2(["عجز الجمهور التام أمام جبروت تقنيات الذكاء الاصطناعي.","تفوّق الوعي المعلوماتي الفردي في القضاء على الشائعات عبر الإنترنت.","جدلية صناعة القناعات وتوجيه الرأي العام رقميًّا بين ذكاء خوارزميات المنصات ومسئولية المتلقي التفاعلية.","دور الكلمة الرقمية في تشكيل الاتجاهات الجماعية داخل المجتمعات النامية."],2),
M("حدد الجملة التي اشتملت على خطأ في كتابة «ألف الوصل وهمزة القطع» أو في صياغة «الممنوع من الصرف» فيما يلي:",["إزدادتْ قدرةُ المنصاتِ على توجيهِ اهتماماتِ الفردِ نحو مسائلا بعينها.","إنَّ صناعةَ القناعاتِ الرقميةِ لا تقومُ على الإكراهِ بل على التوجيهِ.","يُمكِّنُ الوعيُ الفردَ من تمييزٍ دقيقٍ بينَ الشهرةِ والمصداقيةِ في بيئةٍ رقميةٍ.","اكتفاءُ الجمهورِ باستهلاكِ المحتوى يُسهِّلُ انتشارَ الأكاذيبِ."],0,"الصواب: «ازدادت» (ألف وصل)، و«مسائلَ» ممنوعة من الصرف."),
O("فرّق الكاتب بين أسلوبين في التأثير على العقول؛ وضّح ذلك مبيّنًا سر تفوق «الكلمة الرقمية» في حسم قناعات الجماهير.","إجابة استرشادية: الأسلوب الأول هو الإكراه الصريح والفرض المباشر، والثاني هو الانتقاء الدقيق والتوجيه الذكي والتكرار المستمر. وتتفوق الكلمة الرقمية لأنها تعمل بهدوء وبتخصيص خوارزمي فتبدو القناعة اختيارًا ذاتيًّا.")]},
{t:"السؤال الثاني (نص متحرر)",ref:PT2,qs:[
MAIN2(["حتمية استبدال العلاقات الإنسانية بالروابط الرقمية في العصر الحالي.","التكنولوجيا تُشكّل الذات والمجتمع، والوعي هو النجاة من سلبياتها.","تفوّق منصات التواصل الاجتماعي في القضاء على مواهب الشباب.","دور التقنيات الحديثة في تسهيل التبادل الثقافي."],1),
O("ما أثر التكنولوجيا على الروابط الأسرية؟","تهدد عمق العلاقات الوجدانية وتستبدل الدفء الأسري بعزلة اختيارية.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"السؤال الأول (قراءة)",ref:"من نص (التقنية وصناعة الرأي العام) اقرأ ثم أجب:\n"+PT1,qs:[
M("وسيلة الإقناع الرئيسة التي استند عليها الكاتب هي:",["الاستدلال بالإحصائيات والأرقام القياسية لنسب مشاركة المحتوى عالميًّا.","التحليل المنطقي لأدوار التفاعل الرقمي كأدلة سلوكية على الشراكة.","استخدام صيغ المبالغة والتهويل والترهيب من انتشار الشائعات.","الاقتباس من آراء خبراء الذكاء الاصطناعي وعلماء النفس السلوكي."],1,"التحليل المنطقي لأدوار التفاعل الرقمي (الاختيار، إعادة النشر) كأدلة سلوكية."),
M("حدد الجملة التي اشتملت على خطأ في كتابة «ألف الوصل وهمزة القطع» أو في صياغة «الممنوع من الصرف» فيما يلي:",["ألقى الأديبُ قصائدَ رائعةً في ملتقى الفكرِ والإبداع.","إستعان الباحثُ بمصادرَ تاريخيةٍ موثوقةٍ لإتمامِ دراسته.","تزيّنت العاصمةُ بحدائقَ غنّاءَ تبهرُ الناظرين إليها.","أسهمَ المفكرونَ في وضعِ معاييرَ دقيقةٍ لتقييمِ العمل."],1,"«إستعان» فعل سداسي ألفه وصل، والصواب «استعان»."),
O("بالنظر إلى مقولة الكاتب: «فالجمهور ليس ضحية سلبية بالكامل، لكنه شريك في عملية التفاعل؛ إذ يختار ما يشاركه». وضّح حدود مسئوليتك الأخلاقية والمعلوماتية بصفتك «مستهلكًا رقميًّا».","عدم مشاركة أي شائعة دون تحقق.")]},
{t:"السؤال الثاني (نص متحرر)",ref:PT2,qs:[
M("حدد الفكرة التي لا تتصل بالنص فيما يلي:",["أثر الافتراضية الرقمية في إضعاف التماسك الاجتماعي والتواصل الأسري.","دور التكنولوجيا في تمكين الشباب من بناء مرجعيتهم الفكرية.","مساهمة الذكاء الاصطناعي في رصد السلوكيات السلبية.","العلاقة بين الإسراف في المقارنات الرقمية والاضطراب النفسي لدى الفرد."],2,"النص لا يتناول مساهمة الذكاء الاصطناعي في رصد السلوكيات السلبية."),
O("استنتج من النص وسيلتين يمكن للطالب من خلالهما مواجهة خطر «الاغتراب النفسي» الناتج عن التعامل مع الفضاء الرقمي.","امتلاك وعي نقدي حذر، وحسن إدارة الوجود الرقمي لصون الهوية.")]}]},
{t:"المجموعة (ج)",acts:[
{t:"السؤال الأول (قراءة)",ref:"من نص (التقنية وصناعة الرأي العام) اقرأ ثم أجب:\n"+PT1,qs:[
M("يتمثل الأسلوب الرئيس لتوجيه الرأي العام في العصر الرقمي – وفق الفقرة – في:",["فرض الآراء وإجبار المتلقين على تبنيها بالقوة.","حجب المحتوى الرقمي المخالف ومنع انتشاره.","التأثير غير المباشر عبر الانتقاء المدروس والتكرار.","إتاحة النقاش الحر والاعتماد على الإقناع المنطقي."],2,"التأثير غير المباشر عبر الانتقاء المدروس والتكرار."),
M("حدد الجملة التي اشتملت على خطأ في كتابة «ألف الوصل وهمزة القطع» أو في صياغة «الممنوع من الصرف» فيما يلي:",["استمعتُ إلى نصائحَ حكيمةٍ من علماءَ أفاضلَ في مجالاتٍ شتّى.","شاركَ أخي في إنشاءِ مشاريعٍ عملاقةٍ تخدمُ الوطن.","التقى أولو الفضلِ في مساجدَ أثريةٍ لإحياءِ تراثِ الأجداد.","أقبلَ الشبابُ على ميادينَ واسعةٍ تفتحُ آفاقًا جديدةً للمستقبل."],1,"«مشاريعَ» ممنوعة من الصرف فلا تُجرّ بالكسرة."),
O("اعتمد الكاتب لغة حجاجية قائمة على المقابلات الثنائية، مثل: (الرأي والخبر – التحليل والدعاية – الشهرة والمصداقية)، وضّح أثرها الإقناعي في رفع وعي المتلقي الرقمي.","إبراز الفروق الدقيقة بين المفاهيم لجعل القارئ يفحص قناعاته بعقلانية.")]},
{t:"السؤال الثاني (نص متحرر)",ref:PT2,qs:[
M("كل البدائل الآتية تُعدّ أفكارًا فرعية داعمة للفكرة الرئيسة التي عالجها الكاتب في النص (ما عدا):",["العزلة الافتراضية قد تسلب العلاقات الاجتماعية دفأها وتماسكها الوجداني المباشر.","التوظيف الحذر والواعي للتقنية يقي الفرد النتائج السيئة للاغتراب النفسي.","ضرورة امتناع الشباب عن استخدام المنصات الرقمية.","تيسير شبكات (الإنترنت) لعمليات التبادل الثقافي بين القارات."],2,"النص لا يدعو إلى الامتناع التام عن المنصات الرقمية."),
O("دلّل من النص بمظهرين يثبتان أن الكاتب كان موضوعيًّا في موقفه من التكنولوجيا.","اعترافه بفضل التقنية في بناء الهوية، وتحذيره في المقابل من مخاطر المقارنات الزائفة والعزلة.")]}]}]}
];
const ST="«أي بنيّ! إن للذوق مراحل كمراحل الطريق، ودرجات كدرجات السلم، فهو يبدأ بإدراك الجمال الحسي: من صورة جميلة، ووجه جميل، وزهرة جميلة، وبستان جميل، ومنظر طبيعي جميل. ثم إذا أحسنتَ تربيته ارتقى إلى إدراك جمال المعاني؛ فهو يكره القبح في الضعة والذلة، ويعشق الجمال في الكرامة والعزة، وينفر من أن يَظلِم أو يُظلَم، ويحب أن يعدل ويُعدَل معه. ثم إذا هو ارتقى في الذوق كره القبح في أمته، وأحبّ الجمال فيها، فهو ينفر من قبح البؤس والفقر والظلم فيها، وينشد جمال الرخاء والعدل في معاملتها، فيصعد به ذوقه إلى مستوى المصلحين. فالإصلاح المؤسس على العقل وحده لا يجدي، وإنما يجدي الإصلاح المؤسس على العقل والذوق جميعًا.»";
const STQ=O("استخرج من النص تشبيهًا يخدم الفكرة الرئيسة للكاتب.","«للذوق مراحل كمراحل الطريق، ودرجات كدرجات السلم».");
const STH=O("وضّح من خلال فهمك النص كيف يسهم الذوق الشخصي في تحقيق قيم الإنصاف والعدالة المشتركة.","يجعل الذوق الإنسان يحب العدل ويكره الظلم محبة صادقة من صميم وجدانه.");
const SQ45=(a,b)=>[a,b];
const U2W2=[
{t:"من روائع الأدب – بين الذوق والعقل",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١ (من روائع الأدب)",ref:"من روائع الأدب: اقرأ ثم أجب:",qs:[
O("تجلّت قيمة (التضحية في سبيل الأرض) كعنصر في روايتي «الأرض» و«كفاح طيبة»؛ قارن بين محوري: مظهر هذه القيمة، وطبيعة التضحية التي قدّمها أبطال كل عمل.","تجلت التضحية في «كفاح طيبة» في مواجهة الهكسوس والدفاع عن استقلال الوطن وكرامته، بينما تجلت في «الأرض» في دفاع الفلاحين عن كرامتهم وحقهم في الحياة ورفض الظلم والمهانة.")]},
{t:"نشاط ٢ (بين الذوق والعقل)",ref:"من نص «بين الذوق والعقل» اقرأ، ثم أجب: «أي بنيّ! إن الذوق أكثر مما عمل العقل في ترقية الأفراد والجماعات؛ فالفرق بين إنسان وضيع وإنسان رفيع ليس فرقًا في العقل وحده، بل في الذوق أكثر من ذلك. ولئن كان العقل أسس المدن ووضع تصميمها، فالذوق جمّلها وزيّنها.»",qs:[
M("الفكرة الرئيسة التي يدور حولها النص:",["العقل البشري هو الأداة الوحيدة المسئولة عن تخطيط المدن.","الذوق الجمالي المرهف أساس ترقية المجتمعات وسر منح الحياة قيمتها.","حث الشباب على ترك العلوم النظرية الجافة والاتجاه لدراسة الفنون.","رصد الفروق الفردية بين الفئات الاجتماعية من حيث القدرات العقلية والذكاء."],1,"الذوق الجمالي المرهف أساس ترقية المجتمعات."),
M("المعنى السياقي لكلمة (رفيع) في العبارة السابقة:",["طويل القامة ومهيب.","عالي الشأن والمنزلة.","شديد الذكاء والفطنة.","رقيق الثياب والمظهر."],1,"«رفيع» أي عالي الشأن والمنزلة."),
O("حدد زاوية رؤية الكاتب لـ«الإصلاح»، وبيّن كيف تختلف عن الرؤية القانونية.","يرى أن الإصلاح القائم على العقل وحده جاف وقاصر، بينما الإصلاح الحقيقي يرتكز على (العقل والذوق معًا) لاستمالة النفوس وتقويمها بفعالية."),
O("ما الدلالة الضمنية لعبارة الكاتب: «ولئن كان العقل أسس المدن… فالذوق جمّلها وزيّنها»؟","بيان دور العقل في البناء الهندسي المادي، ودور الذوق في إضفاء الجمال والروح البهية على الحياة."),
O("تضمنت عبارة الكاتب (أي بنيّ!) إيجازًا؛ حدد نوعه، وبيّن غرضه البلاغي في سياق النص.","إيجاز بالحذف (حذف أداة النداء القريب)؛ غرضه البلاغي إظهار القرب والتحبب وسرعة التنبيه.")]},
{t:"نشاط ٣ (بين الذوق والعقل)",ref:"من نص «بين الذوق والعقل» اقرأ ثم أجب: «فالإصلاح المؤسس على العقل وحده لا يجدي، وإنما يجدي الإصلاح المؤسس على العقل والذوق جميعًا. أي بنيّ! لقد جرّبتُ الناس فوجدتهم يخضعون للذوق أكثر مما يخضعون للمنطق؛ فبالذوق تستطيع أن تستميلهم، وأن تبرّهم، وأن توجّههم، وأن تصلحهم إن شئت، أما العقل وحده فلا يستطيع أن يأسر إلا الفلاسفة، وقليل ما هم.»",qs:[
M("المعنى السياقي الأدق لكلمة (تستميلهم):",["تطلب منهم كتابة ما تمليه عليهم من نصائح وتوجيهات.","تستعطف قلوبهم وتطلب محبتهم لك ووقوفهم عونًا لك.","تفرض عليهم رأيك الفكري بقوة الحجة والبرهان.","تستكشف غوامض نفوسهم وتتعرف على أسرارهم."],1,"«تستميلهم» أي تستعطف قلوبهم وتطلب محبتهم."),
M("الدلالة الضمنية لعبارة الكاتب: «أما العقل وحده فلا يستطيع أن يأسر إلا الفلاسفة، وقليل ما هم»:",["التنفير من المنهج العقلي والتحذير من سلوك طريق الفلاسفة.","الإيحاء باختصاص الخطاب الجاف القائم على المنطق الصرف بنخبة معينة.","الإشادة بالقدرات الذهنية الفائقة التي يتمتع بها الفلاسفة دون غيرهم.","بيان أن الفلسفة علم معقد لا يفهمه إلا القليل من الناس."],1,"الإيحاء باختصاص الخطاب الجاف القائم على المنطق بنخبة محدودة من المفكرين."),
O("حدد زاوية رؤية الكاتب لآلية التغيير والتقويم الإنساني.","الاعتماد على الوجدان والذوق لقدرتهما السحرية على أسر القلوب والتأثير في عامة الناس."),
O("عقد الكاتب موازنة فكرية ونفسية بين استجابة (عامة الناس) واستجابة (النخبة/الفلاسفة) للمؤثرات التوجيهية؛ وضّح هذه الموازنة.","عامة الناس يخضعون للذوق والمشاعر بسهولة، بينما الفلاسفة والنخبة وحدهم من يتأثرون بالمنطق العقلي الخالص وقليل ما هم.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"اقرأ الفقرة التالية من نص «بين الذوق والعقل»، ثم أجب: «إن للذوق مراحل كمراحل الطريق، ودرجات كدرجات السلم، فهو يبدأ بإدراك الجمال الحسي: من صورة جميلة، ووجه جميل، وزهرة جميلة، وبستان جميل، ومنظر طبيعي جميل.»",qs:[
O("حدد «مراحل التطور الذوقي» عند الإنسان كما صاغها الكاتب في درجات سلّمه.","يبدأ بإدراك الجمال الحسي (صور، وجوه، أزهار، بساتين)، ثم يرتقي لإدراك جمال المعاني (كره القبح في الذلة، عشق الجمال في العزة والكرامة)، ثم يرتقي ليكره القبح في أمته وينشد جمال العدل والرخاء حتى يصعد إلى مستوى المصلحين."),
O("بيّن وجهة نظر الكاتب في العبارة السابقة لوصف طبيعة تطور «الذوق» ونشأته لدى الإنسان.","يرى أنه عملية تدرج تصاعدي منظمة تشبه درجات السلم ومراحل الطريق.")]}]}]},
{t:"بين الذوق والعقل – هيا نحلل ونناقش – هيا نتحدث ونكتب",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١",ref:"من نص «بين الذوق والعقل» اقرأ ثم أجب: «إن شئتَ أن تعرف قيمة الذوق في الفرد، فجرّده من الطرب بالموسيقى والغناء، وجرّده من الاستمتاع بمناظر الطبيعة وجمال الأزهار، وجرّده من أن يهتز للشعر الجميل، والأدب الرفيع، والصورة الرائعة، وجرّده من الحب في جميع أشكاله ومناحيه، ثم انظر بعد ذلك ماذا عسى أن يكون؟ وماذا عسى أن تكون حياته؟»",qs:[
M("مضاد كلمة (الرائعة) بحسب ما يقتضيه السياق:",["القديمة والأصيلة.","القبيحة والرديئة.","المجهولة والبالية.","البعيدة والعالية."],1,"مضاد «الرائعة» هو القبيحة والرديئة."),
M("زار سائح مدينة تمتلئ بناطحات سحاب عملاقة، غير أن شوارعها قذرة، ومتاجرها عشوائية. أي أحكام الكاتب تنطبق عليها؟",["أمة بلغت ذروة التحضر لاعتمادها على «العقل الهندسي» والضخامة العمرانية.","أمة برغم مظهرها الحديث، ينتمي ذوقها إلى الأمم المتوحشة والبدائية.","أمة استغنت بالحدائق والبساتين عن نظافة الشوارع وتنظيم المتاجر.","أمة رفيعة شوّهت التكنولوجيا ذوقها العام بصورة مؤقتة."],1,"لغياب الذوق ونظافة الشوارع وتنظيم المتاجر."),
O("وضّح كيف يترابط «ذوق الفرد» (الموسيقى، الشعر، الحب) مع «ذوق الأمة» (المتاجر، الشوارع، دور الفنون) في النص.","ذوق الفرد ينعكس على وجدانه، وحين يتكامل أفراد المجتمع يرتقي ذوق الأمة ليظهر بوضوح في عمائرها ومساجدها وكنائسها ونظافة شوارعها."),
O("ما الدلالة الضمنية لتساؤل الكاتب: «ماذا عسى أن يكون؟ وماذا عسى أن تكون حياته؟».","التحذير الشديد من خطورة تجريد الإنسان من الذوق والوجدان واعتباره كائنًا آليًّا جافًّا؛ فتفقد الحياة بفقده قيمتها ومعناها.")]},
{t:"نشاط ٢ (عرض شفوي)",ref:"تحدّث لمدة دقيقة واحدة حول الفكرة الآتية: «القراءة المستمرة ليست مجرد تسلية، بل هي الأداة الأساسية لتوسيع المدارك وبناء الشخصية الواعية.»",qs:[
O("مهامك في العرض:\n• عرّف أهمية القراءة في جملة واضحة.\n• وضّح كيف تغيّر القراءة تفكير الإنسان.\n• اذكر مثالًا، واربط بين المثال وفكرة النص.\n• اختم حديثك بجملة تلخص رأيك.\n\nبطاقة التقويم الذاتي: تحدثت بلغة سليمة ونبرة معبرة؛ رتبت أفكاري قبل بدء الحديث؛ استخدمت مثالًا واقعيًّا؛ التزمت بزمن الحديث المقدر بدقيقة؛ ختمت حديثي بخاتمة تلخص رأيي.","تدريب شفوي وتقييم ذاتي للطالب بحسب بطاقة التقويم.")]},
{t:"نشاط ٣ (مقال)",ref:"اكتب مقالًا حجاجيًّا منظمًا لا يقل عن (١٠ أسطر)، تجيب فيه عن القضية التالية: هل القراءة الورقية أكثر فائدة وعمقًا للإنسان من القراءة الإلكترونية؟ احرص على بناء موقفك بوضوح وإقناع، مدعمًا رأيك بالبراهين المنطقية.",qs:[
O("اكتب المقال.","إجابة استرشادية: تثير المفاضلة بين القراءة الورقية والإلكترونية جدلًا واسعًا. فالورقية تمنح تركيزًا أعمق وصفاءً ذهنيًّا بعيدًا عن المشتتات، وتساعد على الاستيعاب والتذكر، بينما تتميز الإلكترونية بسهولة الوصول وتعدد المصادر وخفة الحمل. غير أن الإفراط في الشاشات يشتت الانتباه ويجهد العين. ومن ثم أرى أن الورقية أكثر عمقًا، وأن الأفضل الجمع بين الوسيلتين بحسب الغرض من القراءة.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"من نص «بين الذوق والعقل» اقرأ ثم أجب: «وإن شئتَ أن تعرف قيمة الذوق في الأمة، فجرّدها من دور فنونها، وجرّدها من حدائقها وبساتينها، وجرّدها من نظافة شوارعها، وجرّدها من مساجدها الجميلة الجليلة، وكنائسها الفخمة، وعمائرها الضخمة، وجرّدها من تنظيم متاجرها، ثم انظر بعد ذلك في قيمتها، وفيما يميزها عن غيرها من الأمم المتوحشة والأمم البدائية.»",qs:[
M("المعنى السياقي الدقيق للكلمتين (الجليلة) و(جرّدها) على الترتيب بحسب ورودهما في سياق الفقرة:",["العظيمة ذات المهابة والوقار - إخلاؤها وسلبها مقوماتها الجمالية.","الواضحة الظاهرة للعيان - عزلها اجتماعيًّا واقتصاديًّا عن جيرانها.","القديمة والأثرية العريقة - حرمانها من التقدم العلمي والتكنولوجي.","الكبيرة الضخمة المساحة - حثّها على الزهد والتقشف في العيش."],0,"الجليلة: العظيمة ذات المهابة والوقار. جرّدها: أخلِها وسلبها مقوماتها الجمالية."),
O("بناءً على فهمك للنص، حدد موطنًا لـ(الإطناب) في الفقرة مبيّنًا نوعه وقيمته الفنية، ثم حدد موطنًا لـ(الإيجاز) مبرزًا أثره البلاغي في نفس المتلقي.","الإطناب: بذكر الخاص بعد العام أو الترادف في تعداد مظاهر حضارة الأمة (دور فنونها، حدائقها، مساجدها، كنائسها…) لتأكيد المعنى.\nالإيجاز: اختصار العبارات بتركيز بليغ."),
O("استنتج الدلالة الضمنية التي قصدها الكاتب من وراء كل من العبارتين الآتيتين:\nأ- «نظافة شوارعها، وتنظيم متاجرها».\nب- «الأمم المتوحشة والأمم البدائية».","أ) تدل على الرقي الحضاري العملي.\nب) تدل على انعدام الذوق الرفيع بغض النظر عن المظهر المادي.")]},
{t:"نشاط ٢ (مقال)",ref:"اكتب مقالًا حجاجيًّا منظمًا لا يقل عن عشرة أسطر، تجيب فيه عن القضية التالية: هل الإصلاح المؤسسي والاجتماعي الحقيقي يرتكز على المنطق والعقل وحدهما، أم أن الارتقاء بالذوق والوجدان شرط أساس لنجاح هذا الإصلاح؟ احرص على: ١) تحديد موقفك بوضوح. ٢) تقديم أدلة وبراهين منطقية وواقعية. ٣) التسلسل المنطقي (مقدمة، عرض يحلل الحجج ويفند الآراء المعارضة، خاتمة). ٤) صياغة لغوية سليمة.",qs:[
O("اكتب المقال.","المقدمة: الإصلاح المؤسسي والاجتماعي هو الغاية الأسمى للأمم المتقدمة، ويبرز تساؤل حول ارتكازه على العقل وحده أم أن الارتقاء بالذوق والوجدان شرط لنجاحه. وموقفنا أن العقل والوجدان جناحان لا استقامة للمجتمع إلا بهما معًا.\nالعرض: يمثل العقل والمنطق الركيزة الأساسية لبناء الهياكل المؤسسية ووضع القوانين ودراسة الواقع بموضوعية، فالأنظمة الإدارية والاقتصادية لا تستقيم إلا بالتخطيط العلمي السليم. ورغم أهمية الجانب العقلي، فإن القوانين الجامدة وحدها تفشل غالبًا إذا غاب البعد الإنساني؛ فالقانون الصارم قد يردع المخالف ظاهريًّا، لكن الوجدان الحي والذوق الرفيع يغرسان الرقابة الذاتية والأخلاق الحميدة التي تضمن الالتزام الطوعي. كما أن المجتمعات التي تهمل الجانب الوجداني والفني تصبح آلية جافة تفتقر إلى روح التعاطف والتعاون.\nالخاتمة: خلاصة القول إن الإصلاح الحقيقي لا يتحقق بالعقل بمعزل عن الوجدان، ولا بالعواطف دون عقلانية وتخطيط؛ بل بالتناغم التام بين صرامة العقل وعدالة القوانين ودفء الذوق وسمو الوجدان.")]}]}]},
{t:"التقييم الأسبوعي",f:[
{t:"المجموعة (أ)",acts:[
{t:"السؤال الأول (بين الذوق والعقل)",ref:"من نص «بين الذوق والعقل» اقرأ ثم أجب:\n"+ST,qs:[
M("حدد البديل الذي يعبر عن دلالة لفظة «الضعة» ضمن السياق:",["ضيق العيش والفقر المدقع.","خسة النفس وسقوط المنزلة.","الضعف والاستكانة للخصوم.","قلة الحيلة والجهل بالحقوق."],1,"«الضعة» هنا خسة النفس وسقوط المنزلة."),
M("الدليل الذي استند إليه الكاتب لتبرير قصور العقل المفرد في عملية الإصلاح:",["العقل يدرك القبح الحسي فقط بينما الذوق يدرك الأبعاد المعنوية.","الإصلاح العقلي جامد بينما الذوق يمنح القوانين مرونة اجتماعية.","القوانين العقلية تجبر الإنسان على العدل، بينما الذوق يدفعه لمحبة العدل.","العقل يسعى لإصلاح الفرد أولًا، والذوق ينطلق لإصلاح الأمة ككل."],2,"القوانين العقلية تجبر على العدل، أما الذوق فيدفع لمحبته."),
O("اعتمد الكاتب على «التدرج التصاعدي» في بناء مفهوم الذوق. وضّح ذلك، مستشهدًا بأمثلة من النص.","يبدأ بالحسي، ثم المعنوي الفردي، ثم الإصلاح الجمعي للأمة."),
STQ]},
{t:"السؤال الثاني (كتابة)",ref:"اكتب فقرة من (٥ - ٧) أسطر عن (الذكاء الاصطناعي ومستقبل الإبداع البشري) وتناول فيها: الفرق الجوهري بين التوليد الآلي والابتكار البشري، مع مراعاة استخدام أدوات الربط، مثل: (لذلك – كما أن – غير أن – هكذا).",qs:[
O("اكتب الفقرة.","يشهد العصر الحالي تطوراً متسارعاً بفضل تقنيات الذكاء الاصطناعي، ولذلك يتساءل الكثيرون عن مستقبل الإبداع البشري. يكمن الفَرْقُ الجوهريُّ بين التوليد الآلي والابتكار البشريِّ في أن الآلة تعتمد على تحليل البيانات السابقة واستنساخ الأنماط بناءً على خوارزميات برمجية صممت مسبقاً. كما أنَّ الإبداع البشري ينبع من التجربة الشعورية، والوعي الذاتي، والعواطف الحقيقية التي تفتقر إليها الآلات تماماً. غير أنَّ هذه التقنيات الحديثة تفتح آفاقاً جديدة للمساعدة في تسريع المهام وتقديم أفكار أولية للمبدعين. هكذا يتضح أن الذكاء الاصطناعي ليس بديلاً عن العقل البشري، بل هو أداة تعزز طاقاته وتفتح أمامه آفاقاً أوسع للابتكار المستقبلي.")]},
{t:"السؤال الثالث",ref:"«وصلت إلى أعمق فكر». اجعل كلمة (أعمق) الواردة في الجملة السابقة مجرورة بالفتحة في جملة من تعبيرك، وغيّر ما يلزم.",qs:[
O("اكتب الجملة.","«وصلت إلى فكرٍ أعمقَ.» (أعمق: ممنوعة من الصرف؛ صفة على وزن أفعل وغير معرفة بأل ولا مضافة).")]},
{t:"السؤال الرابع",ref:"اقرأ الجملتين: (أ) «القراءة تنير العقل.» (ب) «القراءة رحلة فكرية توسع الأفق، وتكسبه المعارف، وتبني شخصيته الواعية.»",qs:[
O("أي الجملتين تمثل الإيجاز؟ ولماذا؟ وأيها يمثل الإطناب؟ وما فائدته في هذا الموضع؟","(أ) إيجاز قصر بليغ. (ب) إطناب بالتفصيل لتوسيع الأفكار وتوكيد المعنى.")]},
{t:"السؤال الخامس (رواية الأرض)",ref:"من روائع الأدب (رواية الأرض) أجب:",qs:[
O("«تجاوزت أزمة الفلاحين فكرة الدفاع عن «الطريق»، لتصبح دفاعًا عن كرامة الإنسان وحقه في التعبير ورفض الظلم». وضّح ذلك من خلال قراءتك للرواية.","تجاوزت أزمة الفلاحين الدفاع عن الطريق إلى الدفاع عن الكرامة والإنسانية ورفض الظلم والمهانة.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"السؤال الأول (بين الذوق والعقل)",ref:"من نص «بين الذوق والعقل» اقرأ ثم أجب:\n"+ST,qs:[
M("ما المعنى الدقيق الذي تؤديه كلمة «ينشد» في سياقها؟",["يطلب بجد ويسعى لتحقيق الغاية كهدف أسمى.","يتغنى بالفضائل ويمتدح وجودها بين الناس.","يتوقع وينتظر حدوث التغيير بشكل تلقائي.","يستفسر ويبحث عن الأسباب الكامنة وراء الظواهر."],0,"«ينشد» أي يطلب بجد ويسعى لتحقيق الغاية."),

{t:"السؤال الثاني (كتابة)",ref:"اكتب فقرة من (٥ - ٧) أسطر عن (التغير المناخي والمسئولية المشتركة) وتناول فيها: دور الممارسات الفردية اليومية كالترشيد والتدوير، مع مراعاة استخدام أدوات الربط، مثل: (لذلك – ومن هنا – كما أن – غير أن – هكذا).",qs:[
O("اكتب الفقرة.","يُعد التغير المناخي من أبرز التحديات التي تواجه كوكب الأرض، لذلك أصبحت المسئولية مشتركة بين الأفراد والحكومات. ومن هنا تأتي أهمية الممارسات الفردية اليومية كالترشيد في استهلاك الطاقة وإعادة التدوير لتقليل الانبعاثات الضارة. كما أن الوعي البيئي يمثل الدرع الواقي لمستقبل الأجيال القادمة وضمان بقائهم في بيئة نظيفة وآمنة. غير أن التهاون في هذا الملف قد يؤدي إلى كوارث بيئية محققة. هكذا يتضح أن حماية الكوكب تبدأ بخطوة فردية تصنع الفارق المنشود.")]},
{t:"السؤال الثالث",ref:"«سار القائد يوسف بجيش عظيم يضم فرسانًا شجعانًا ومحاربين أشدّاء، ففتح معاقل حصينة كانت تعد مفخرة للغزاة.»",qs:[

{t:"السؤال الرابع",ref:"اقرأ الجملتين: (أ) «الاتحاد يصنع النجاح.» (ب) «التعاون والعمل بروح الفريق الواحد يدمج الجهود الصغيرة ليصنع الواحد منها إنجازات عظيمة.»",qs:[
O("أي الجملتين تمثل الإيجاز؟ ولماذا؟ وأيها يمثل الإطناب؟ وما فائدته في هذا الموضع؟","الجملة (أ) تمثل الإيجاز؛ لأنها أدت المعاني الكثيرة بلفظ قليل موجز.\nالجملة (ب) تمثل الإطناب بالتأكيد والتفصيل، وفائدته توضيح المعنى وتأكيده وبيان أثر التعاون بشكل شامل.")]},

O("متى يصبح الحزم والصمت المطبق موقفًا أقوى وأقسى من الصراخ والكلام الكثير؟","حين يكون التعبير بالكلمات عاجزًا عن وصف فداحة الحدث، وحين يدل الصمت على ثبات الموقف وقوة العزيمة ورفض التنازل عن الحق دون صخب فارغ.")]}]},

M("ما البديل الذي يعبر عن دلالة «أحسنتَ تربيته» في موضعها داخل النص؟",["وفّرت له سبل الرفاهية والعيش الرغيد.","غذّيته بالمعارف والعلوم النظرية الصرفة.","هذّبت نزعاته وصقلت ملكاته التأملية.","حميته من مخرجات البيئة الفاسدة المحيطة به."],2,"«أحسنتَ تربيته» أي هذّبت نزعاته وصقلت ملكاته."),
M("ما النتيجة المترتبة على مجتمع يمتلك «العقل» الفلسفي والتقني، لكنه يفتقر إلى «الذوق»؟",["انهيار المنظومة الاقتصادية وشيوع الفقر والبؤس لغياب التخطيط.","تطبيق جاف للعدالة يفتقد لروح التراحم، مع استمرار مظاهر القبح المعنوي.","عجز المجتمع عن إدراك مواطن الجمال الحسي في الطبيعة والفنون.","ارتداد المجتمع إلى مستويات متدنية ترفض العدل والمساواة وتكرّس للظلم."],1,"تطبيق جاف للعدالة يفتقد لروح التراحم."),
O("إلى أي مدى يعد الجمال الحسي بوابة للمعنوي في رأي الكاتب، وهل يمكن – من وجهة نظرك – القفز مباشرة إلى ذوق المعاني دون المرور بذوق الحواس؟","يرى الكاتب أن الجمال الحسي هو الدرجة الأولى في سلم الذوق، ومن خلاله يتمرن الوجدان على حب الجمال ليترقى إلى جمال المعاني والأخلاق كالعدل والكرامة. ومن وجهة النظر المنطقية يصعب القفز مباشرة؛ لأن النفس تألف المحسوسات أولًا وتتدرج منها إلى المعنويات المجردة."),
STQ]},
{t:"السؤال الثاني (كتابة)",ref:"اكتب فقرة من (٥ - ٧) أسطر عن (وسائل التواصل الاجتماعي والعزلة الرقمية) وتناول فيها: أثر الشاشات الرقمية في إضعاف التواصل الواقعي، مع مراعاة استخدام أدوات الربط، مثل: (لذلك – ومن هنا – كما أن – غير أن – هكذا).",qs:[
O("اكتب الفقرة.","أحدثت وسائل التواصل الاجتماعي طفرة هائلة في حياة البشر، لذلك غدت الشاشات الرقمية سبباً رئيسياً في إضعاف التواصل الواقعي المباشر بين الأفراد. ومن هنا ظهر مفهوم الصداقة الافتراضية التي تفتقر إلى الدفء الإنساني مقارنة بالصداقة الحقيقية القائمة على الدعم المتبادل واللقاء الحي. كما أن الانغماس المفرط في العالم الرقمي يخلق حالة من العزلة الفردية. غير أن التوظيف الواعي لهذه الوسائل يقي الإنسان أضرارها. هكذا يجب الموازنة بين الحضور الرقمي والتواصل الواقعي الحقيقي.")]},
{t:"السؤال الثالث",ref:"«سخّر الله لسليمان الجن فأنتجوا صنائع متقنة، وجعل الحديد في كفه ألين من الغصون الخضر.»",qs:[
O("استخرج من العبارة السابقة ثلاثة أسماء ممنوعة من الصرف وبيّن علة منع كل منها.","سليمان: علم مختوم بألف ونون زائدتين.\nصنائع: صيغة منتهى الجموع.\nألين: صفة على وزن (أفعل).")]},
{t:"السؤال الرابع",ref:"اقرأ الجملتين: (أ) «الوقت هو الحياة.» (ب) «تنظيم ساعات اليوم واستثمار الدقائق فيما ينفع يعد الركيزة الأساسية لتحقيق الأهداف.»",qs:[
O("أي الجملتين تمثل الإيجاز؟ ولماذا؟ وأيها يمثل الإطناب؟ وما فائدته في هذا الموضع؟","الجملة الأولى (الوقت هو الحياة): إيجاز قصر لشمولها لمعانٍ جليلة بلفظ قصير.\nالجملة الثانية: إطناب بالتفصيل والبيان لتأكيد الأهمية وإيضاح المعنى.")]},
{t:"السؤال الخامس (رواية الأرض)",ref:"من روائع الأدب (رواية الأرض) أجب:",qs:[
O("هل كان تردد بعض الفلاحين في القرية نابعًا من ضعف وجبن، أم كان نتيجة حسابات دقيقة للمسئولية وثمن المواجهة؟ وضّح رأيك.","لم يكن نابعًا من جبن، بل كان نتيجة حسابات دقيقة لخطورة الموقف وثمن المواجهة وما يترتب عليها من أضرار بالغة على أسرهم."),

O("اكتب المشهد.","(الشخصيات: التاجر أمين، الشاب خالد)\nخالد: يا سيد أمين، لقد نسيتَ هذه الحقيبة المليئة بالنقود في متجرك أمس.\nأمين: بارك الله فيك يا بني، إنها أمانتك وقد حافظتُ عليها حتى تعود.\nخالد: ما أروع الأمانة؛ فهي التي تبني جسور الثقة الغالية بين الناس وتجلب راحة البال.\nأمين: صدقت يا بني، فالصادق الأمين يعيش عزيزًا ومحبوبًا في مجتمعه.")]},

O("اكتب المشهد.","(الشخصيات: المعلم، الطلاب)\nالمعلم: يا أبنائي، المشروع الكبير بحاجة لجهودكم مجتمعين لا متفرقين.\nالطالب الأول: لقد وزعنا المهام فيما بيننا بانتظام يا معلمي.\nالطالب الثاني: وبالتعاون ذللنا كل الصعوبات وأنجزنا العمل في وقت قياسي.\nالمعلم: نعم، فاليد الواحدة لا تصفق، والتعاون هو سر نجاح الأمم ورفعتها.")]},

O("أ) استشهد من النص على مظهر واحد من مظاهر استحضار الكاتب لوطنه (مصر) في أثناء رحلته.","احتفاظ الكاتب بقطعة قماش صغيرة على هيئة علم بلاده؛ لأنها كانت تمثل وطنه وتربطه به وجدانيًّا رغم غربته."),
O("ب) اذكر الرموز الأولية التي عبّر بها الكاتب عن ارتباطه بوطنه في مستهل الرحلة.","العلم المصري، وذكريات مصر، وما يرتبط بمصر من رموز ومشاهد ظلت حاضرة في وجدانه رغم وجوده في الغربة."),
O("ج) حدد موقفين من النص يبينان شدة تعلّق الرحالة بوطنه وحرصه عليه.","شدة تعلقه بالعلم المصري واعتباره جزءًا من كيانه.\nوحرصه على نقل ما يصلح مما رآه في البلاد الأخرى والاستفادة منه في إصلاح بلاده.")]},
{t:"نشاط ٢ (النص الشعري)",ref:"اقرأ البيتين الآتيين من النص، ثم أجب:\n«احفظْ لسانَك واحترزْ من لفظِه ... فالمرءُ يسلمُ باللسانِ ويُعطَبُ\nوَزِنِ الكلامَ إذا نطقتَ ولا تكنْ ... ثرثارةً في كلِّ نادٍ تخطبُ»",qs:[
M("ما المعنى السياقي الدقيق للكلمتين (احترز) و(ثرثارة) على الترتيب بحسب ورودهما في البيتين؟",["احذر وتوقَّ – كثير الكلام بغير فائدة.","ابتعد واعتزل – سريع النطق والحديث.","اصمت وتأنَّ – حاد اللسان وجريء المنطق.","امتنع واكفف – غاضب في مجالس قومه."],0,"احترز: احذر وتوقَّ. ثرثارة: كثير الكلام بغير فائدة."),
M("علاقة قوله: (فالمرء يسلم باللسان ويعطب) بما قبلها:",["نتيجة.","تعليل.","توضيح.","استدراك."],1,"العبارة تعليل لوجوب حفظ اللسان."),
O("في ضوء قراءتك للأبيات، وضّح العاطفة المسيطرة على الشاعر، وأثرها في صياغة الأفكار.","العاطفة المسيطرة هي عاطفة النصح والإرشاد والحرص على صلاح الإنسان، وقد جعلت الشاعر يستخدم أساليب الأمر والنهي مثل: «احفظ»، «احترز»، «لا تكن»؛ ليحث المتلقي على ضبط اللسان وحفظ السر."),
O("وضّح الصورة البيانية في قوله: «وزن الكلام إذا نطقت».","استعارة مكنية؛ فقد شبّه الكلام بشيء مادي يُوزن، وحذف المشبه به وأبقى لازمة من لوازمه (الوزن). وأثرها: توضح ضرورة التروي والتفكير في الكلام قبل النطق به.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١ (شمس وليل)",ref:"من روائع الأدب: من أدب الرحلات «شمس وليل» أجب:",qs:[
O("أ- لماذا يشعر المغترب أن قطعة قماش صغيرة كعلم بلاده هي جزء من كيانه، لا مجرد مقتنى يملكه؟","لأنها ترمز إلى وطنه وهويته وذكرياته، فتوقظ في نفسه مشاعر الانتماء والحنين، ولذلك تصبح ذات قيمة وجدانية تتجاوز قيمتها المادية."),
O("ب- إلى أين اتجه الكاتب في رحلته الموصوفة في النص؟ وما وسيلة السفر التي استخدمها؟","اتجه في رحلة إلى الغرب، وكانت وسيلة السفر القطار."),
O("ج- ما سبب تسمية النص بهذا العنوان: «شمس وليل»؟ وعلام تدل هذه المقابلة؟","لأن العنوان يقوم على مقابلة بين الشمس والليل بما يحملانه من دلالات متقابلة؛ فالشمس توحي بالنور والوضوح والانفتاح، والليل يوحي بالظلمة والغموض. وتدل المقابلة على اختلاف التجارب والمشاهد التي عاشها الكاتب في رحلته.")]},
{t:"نشاط ٢ (النص الشعري)",ref:"اقرأ البيتين التاليين من النص، ثم أجب:\n«لا تأمنِ الدهرَ الصروفَ فإنه ... ما زال قدمًا للرجالِ يؤدِّبُ\nودعِ الكذوبَ فلا يكنْ لك صاحبًا ... إنَّ الكذوبَ يشينُ حرًّا يصحبُ»",qs:[
M("ما المعنى السياقي للكلمتين (الصروف) و(يشين) على الترتيب؟",["الخسائر والمشقات – يخاصم ويفارق.","النوائب والتقلبات – يعيب ويقبح.","الأحزان والمخاوف – يخرج ويخذل.","الأقدار والأيام – يضل ويخدع."],1,"الصروف: النوائب والتقلبات. يشين: يعيب ويقبح."),
O("وضّح الصورة الشعرية في قوله: «ما زال قدمًا للرجال يؤدب».","شخّص الشاعر الدهر فصوّره كإنسان أو معلّم يؤدب الرجال ويعلمهم من تجارب الحياة. وأثرها: إبراز قدرة الزمن وتجارب الحياة على تعليم الإنسان وتهذيبه.")]}]}]},
{t:"التقييم الأسبوعي",f:[
{t:"المجموعة (أ)",acts:[
{t:"السؤال الأول (النص الشعري)",ref:"من نص (أثر الكلمة وحفظ اللسان) اقرأ الأبيات ثم أجب:\n"+VP,qs:[
M("ما الدلالة الشعورية للفظة «بريبة» في البيت الثاني بالنظر إلى علاقتها بصروف «الزمان»؟",["الشك في نوايا الأصدقاء والمقربين.","وقوع التهمة الباطلة التي تخدش السمعة.","تحول الأحوال ونزول محن الدهر غير المتوقعة.","الخوف من المستقبل والتردد في اتخاذ القرار."],2,"«بريبة» توحي بتحول الأحوال ونزول محن الدهر غير المتوقعة."),
M("ما العلاقة بين الشطر الأول والشطر الثاني في البيت الأول، وما أثرها الدلالي؟",["علاقة تقابل تبرز أن العدل الاجتماعي شرط لازم للبركة والنماء المالي.","علاقة تعليل توضح أن اجتناب الخيانة هو النتيجة الحتمية لالتزام الأمانة.","علاقة ترادف تؤكد أن نفي الظلم مرادف تام لإقرار العدل البشري.","علاقة شرطية تجعل طيب المكسب غاية مادية منفصلة عن السلوك الأخلاقي."],0,"علاقة تقابل؛ إذ يقابل الشاعر بين العدل وعدم الظلم من ناحية، وطيب المكسب والبركة من ناحية أخرى."),
O("كيف ظهر الجانب الثقافي للشاعر في البيت الثالث؟","ظهر في توظيفه المعرفة الدينية والإيمانية، والإشارة إلى قرب الله تعالى من عباده (من حبل الوريد)، مما يدل على ثقافة دينية ووعي بالقيم الإسلامية."),
O("هل ترى أن تحقيق المكسب الحلال الطيب يرتبط بالتمسك بـ(الأمانة والعدل)؟ وضّح وجهة نظرك مع التعليل.","نعم؛ لأن الأمانة تمنع الخيانة والغش، والعدل يمنع الظلم والاعتداء على حقوق الآخرين، وبذلك يكون الكسب طيبًا مشروعًا، ويحقق للإنسان راحة الضمير واحترام الناس.")]},
{t:"السؤال الثاني (شمس وليل)",ref:"من روائع الأدب: من أدب الرحلات «شمس وليل» أجب:",qs:[
O("في رأيك، هل يمكن لإنسان أن ينفتح على الثقافات العالمية المعاصرة دون أن يفقد هويته أو يتخلى عن جذوره؟","نعم، إذا استفاد من تجارب الآخرين دون تقليد أعمى، وتمسك بلغته وقيمه وتاريخه؛ فالانفتاح الثقافي يتيح التعرف إلى أساليب جديدة في التفكير والعمل، بينما يحافظ على الإنسان الاعتزاز بجذوره وانتقاء ما يتفق معها وينفع مجتمعه.")]},
{t:"السؤال الثالث (مشهد مسرحي)",ref:"اكتب مشهدًا مسرحيًّا قصيرًا في حدود (٥ - ٧) أسطر عن موقف يظهر فيه أثر احترام الكبير وتوقيره في تماسك الأسرة والمجتمع.",qs:[
O("اكتب المشهد.","الأب: يا بني، إن احترام الكبير دليل على حسن الخلق.\nالابن: معك حق يا أبي، سأحرص على الاستماع إلى كبار السن وتقدير خبراتهم.\nالجد: بارك الله فيك يا بني، فاحترام الكبير يقوي روابط الأسرة.\nالابن: سأجعل احترام الكبير سلوكًا ثابتًا في حياتي.\nالأب: وباحترامنا لبعضنا يصبح المجتمع أكثر تماسكًا.")]},
{t:"السؤال الرابع (إملاء)",ref:"أجب عما يأتي:",qs:[
O("أ- ضع علامة (√) أمام الكتابة الصحيحة: الأصعب – ارسال – ريبة.","الكتابة الصحيحة: الأصعب ✓ – إرسال ✓ (بهمزة قطع) – ريبة ✓."),
O("ب- علّل كتابة الهمزة على صورتها في الكلمات الآتية: إحسان – اقتراب – امتلأ.","إحسان: همزة قطع لأنها مصدر الفعل الرباعي «أحسن».\nاقتراب: همزة وصل لأنها مصدر الفعل الخماسي «اقترب».\nامتلأ: الهمزة متطرفة ورُسمت على ألف لأن ما قبلها مفتوح.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"السؤال الأول (النص الشعري)",ref:"من نص (أثر الكلمة وحفظ اللسان) اقرأ الأبيات ثم أجب:\n"+VP,qs:[
M("استنتج المعنى السياقي للفظة «فاضرع» في موضعها:",["اسجد واقترب بجسدك.","تذلل واستغث بخشوع مفرط.","ارفع صوتك بالشكوى أمام الجميع.","اصبر وانتظر الفرج دون حراك."],1,"«فاضرع» أي تضرع والتجئ إلى الله بخضوع وخشوع."),
M("الأثر الفني والفكري لتشخيص الزمان في قول الشاعر: «وإذا رميتَ من الزمان بريبة»:",["إظهار الزمان كقوة عاقلة تتعمد إيذاء الفرد واستهدافه شخصيًّا.","بيان حتمية المصائب وفجائيتها بحيث تصيب الإنسان كالسهم دون إنذار.","تبرير عجز الفرد عن مواجهة الصعاب وإلقاء اللوم كاملًا على الدهر.","التقليل من شأن الأزمات واعتبارها مجرد أحداث عابرة في خط الزمن."],1,"بيان حتمية المصائب وفجائيتها كالسهم دون إنذار."),
O("بيّن أثر الأفعال في بناء فكرة الشاعر في الأبيات.","استخدم الشاعر أفعالًا متنوعة مثل: أدِّ، اجتنب، اعدل، لا تظلم، فاضرع، وهي أفعال أمر ونهي حوّلت النص إلى مجموعة من الوصايا العملية، وأكدت أن مواجهة الحياة تحتاج إلى سلوك أخلاقي وصبر ولجوء إلى الله."),
O("ما ملامح الشخصية الحضارية المتكاملة التي يستهدفها الشاعر؟","الأمانة، والعدل، واجتناب الخيانة والظلم، والصبر عند الشدائد، واللجوء إلى الله، وحسن اختيار الصحبة، والابتعاد عن السلوكيات التي تضر الفرد والمجتمع.")]},
{t:"السؤال الثاني (شمس وليل)",ref:"من روائع الأدب: من أدب الرحلات «شمس وليل» أجب:",qs:[
O("اذكر فكرة إصلاحية واحدة تمنى الكاتب تطبيقها في بلاده بعد مشاهداته في الغرب.","الاستفادة من النظام والتقدم الحضاري واحترام الإنسان والحيوان، ونقل ما يناسب المجتمع المصري بما يسهم في إصلاحه.")]},
{t:"السؤال الثالث (مشهد مسرحي)",ref:"اكتب مشهدًا مسرحيًّا قصيرًا في حدود (٥ - ٧) أسطر عن موقف يظهر فيه أثر الرفق بالحيوان في تهذيب مشاعر الإنسان.",qs:[
O("اكتب المشهد.","الطفل: لماذا تعتني بهذا الحيوان إلى هذا الحد؟\nالأب: لأن الرفق بالحيوان دليل على رحمة الإنسان وحسن خلقه.\nالطفل: سأحرص إذن على ألا أؤذيه، وأن أقدم له الطعام والماء.\nالأب: أحسنت، فالرحمة بالمخلوقات تهذب مشاعر الإنسان وتجعله أكثر إنسانية.\nالطفل: سأجعل الرفق بالحيوان سلوكًا دائمًا.")]},
{t:"السؤال الرابع (إملاء)",ref:"أجب عما يأتي:",qs:[
O("أ- ضع علامة (√) أمام الكتابة الصحيحة: أزال – ألكذوب – اكتم.","أزال ✓ – ألكذوب ✗ (الصواب: الكذوب) – اكتم ✓."),
O("ب- علّل كتابة الهمزة على صورتها في الكلمات الآتية: أشاع – إحضار – اختراع.","أشاع: همزة قطع لأنها في أول فعل رباعي.\nإحضار: همزة قطع لأنها مصدر الفعل الرباعي «أحضر».\nاختراع: همزة وصل لأنها مصدر الفعل الخماسي «اخترع».")]}]},
{t:"المجموعة (ج)",acts:[
{t:"السؤال الأول (النص الشعري)",ref:"من نص (أثر الكلمة وحفظ اللسان) اقرأ الأبيات ثم أجب:\n"+VP,qs:[
M("ما القيمة الدلالية لاستخدام الشاعر أفعل التفضيل في موضعين مختلفين: «الأشق الأصعب» لوصف الشدائد، و«أدنى … وأقرب» لوصف معية الله؟",["تأكيد أن شدة الأزمة البالغة يقابلها لطف إلهي فائق يفوق قدرة العقل على التخيل.","الإشارة إلى أن المشقة تزيد بمرور الوقت بينما القرب الإلهي ثابت لا يتغير.","توضيح أن الصعوبة نسبية تختلف من شخص لآخر حسب قوة احتماله.","بيان أن القرب من الله يتطلب بذل مجهود شاق ومضاعف من العبد أولًا."],0,"يبرز الشاعر شدة الأزمة والمشقة مقابل لطف الله تعالى وقربه البالغ من عباده."),
M("ما القيمة الفنية لتقديم المفعول به «الخيانة» على فعل الأمر «فاجتنب» في البيت الأول؟",["الاهتمام والتحذير الشديد الفوري من عواقب الخيانة قبل النهي عنها.","الرغبة في إحداث السجع والتوازن الصوتي الموسيقي مع القافية.","الإشارة إلى أن الخيانة أمر مستحدث يطرأ على الطبيعة الإنسانية البريئة.","الدلالة على تلازم الخيانة والأمانة كوجهين لعملة سلوكية واحدة."],0,"التقديم يفيد الاهتمام والتحذير الشديد الفوري."),
O("رتّب الشاعر استجابة الإنسان للأزمات في البيتين الثاني والثالث وفق تسلسل منطقي ونفسي دقيق. وضّح.","يبدأ الشاعر ببيان وقوع النكبة والمحنة، ثم يدعو الإنسان إلى الصبر عليها، فإذا اشتدت الأزمة وعظم الأمر فعليه أن يتضرع إلى الله ويلجأ إليه. وهذا ترتيب منطقي ونفسي: الأزمة ← الصبر ← اللجوء إلى الله."),
O("استخرج من الأبيات طباقًا وبيّن أثره في توضيح المعنى.","الطباق: الأمانة × الخيانة. وأثره: توضيح الفرق بين السلوك الأخلاقي الصحيح والسلوك المنحرف، وتقوية المعنى وترسيخه.")]},
{t:"السؤال الثاني (رسالة)",ref:"من روائع الأدب: من أدب الرحلات «شمس وليل» أجب: تخيّل أنك رفيق للكاتب في قطار الشمس، وطلب منك كتابة رسالة قصيرة لشباب جيلك في مصر تلخص درس الرحلة. اكتب في ثلاثة أو أربعة أسطر ما ستنصحهم به، موضحًا كيف ننتفع من تجارب الآخرين، وما يعنيه هذا التفكير لبلدك.",qs:[
O("اكتب الرسالة.","يا شباب مصر، تعلموا من تجارب الأمم، وخذوا منها ما ينفعكم دون أن تفقدوا هويتكم. استفيدوا من النظام والعلم والعمل، ثم وظفوا ما تعلمتموه في خدمة وطنكم. فنهضة مصر تحتاج إلى عقول واعية تجمع بين الأصالة والانفتاح.")]},
{t:"السؤال الثالث (مشهد مسرحي)",ref:"اكتب مشهدًا مسرحيًّا قصيرًا في حدود (٥ - ٧) أسطر عن موقف يظهر فيه أثر العفو والتسامح في إنهاء الخلافات ونشر المحبة بين الأصدقاء.",qs:[
O("اكتب المشهد.","أحمد: لقد أخطأتُ في حقك، لكنني قررت أن أسامحك.\nالصديق: أشكرك، وأعتذر عما بدر مني.\nأحمد: التسامح أفضل من استمرار الخلاف، فلنبدأ من جديد بالمحبة والاحترام.\nالصديق: وسأحرص ألا يتكرر الخطأ.")]},
{t:"السؤال الرابع (إملاء)",ref:"أجب عما يأتي:",qs:[
O("أ- ضع علامة (√) أمام الكتابة الصحيحة: إنفجار – اختيار – أمانه.","الكتابة الصحيحة: انفجار ✓ – اختيار ✓ – أمانة ✓."),
O("ب- علّل كتابة الهمزة على صورتها في الكلمات الآتية: إذا – انتشار – ألسنة.","إذا: همزة قطع لأنها في أول حرف «إذا».\nانتشار: همزة وصل لأنها مصدر الفعل الخماسي «انتشر».\nألسنة: همزة قطع لأنها جمع «لسان» مبدوء بهمزة قطع.")]}]}]}
];
const VS="«والسِّرَّ فاكتمْهُ ولا تنطقْ بهِ ... إنَّ الزجاجةَ كسرُها لا يُشعَبُ\nوكذاكَ سِرُّ المرءِ إنْ لم يَطْوِهِ ... نشرتْهُ ألسنةٌ تزيدُ وتكذبُ»";
const PARA=(a)=>"اكتب فقرة قصيرة (خمسة أسطر) تصف فيها موقفًا حياتيًّا أثّر فيه "+a+" في علاقة شخصين معًا. احرص على أن تبدأ بوصف الموقف بإيجاز، وتوضح الفعل الأخلاقي الذي تم، وتوضح أثره في العلاقة، وتختم بتوصية.";
const U2W4=[
{t:"أثر الكلمة وحفظ اللسان – هيا نتحدث ونكتب",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١",ref:"اقرأ البيتين ثم أجب:\n"+VS,qs:[
O("لم يقف التشبيه في البيتين السابقين عند حدود التشابه الشكلي، بل كان أداة فكرية لنقل المعنى. وضّح كيف حوّل الشاعر المعنى «المجرد» إلى صورة «محسوسة»، وما الذي توحي به هذه الصورة من حيث النتيجة المترتبة على إفشاء السر؟","حوّل الشاعر معنى السر وخطورته إلى صورة محسوسة حين شبّه السر بالزجاجة؛ فالزجاجة إذا انكسرت لا يمكن إصلاحها، وكذلك السر إذا أُفشي لا يمكن استرجاعه أو محو أثره."),
M("تنبّأ – وفقًا للبيت الثاني – بالحالة الشعورية لشخص لا يحافظ على أسراره:",["يعيش سعيدًا؛ لأنه سيسلم من كيد الأعداء.","يسيطر عليه القلق؛ لانكشاف سره.","يصبح راضيًا عن نفسه لأنه مشارك للآخرين.","يحس في قرارة نفسه باحترام الآخرين وتقديرهم."],1,"يسيطر عليه القلق لانكشاف سره."),
M("ما الكلمة التي بمعنى «يخفي» كما وردت في البيتين؟",["تزيد","يطويه","نشرته","يشعب"],1,"«يطويه» أي يكتمه ويخفيه."),
O("حلّل الصورة البلاغية في تشبيه السر بالزجاجة، وبيّن وجه الشبه بينهما.","شبّه الشاعر السر بالزجاجة في صعوبة إصلاحه بعد انكشافه؛ وهو تشبيه.\nوجه الشبه: استحالة تدارك الأثر بعد الكسر أو الانكشاف.")]},
{t:"نشاط ٢ (تحدّث)",ref:"تحدّث لمدة ثلاث دقائق عن موقف رأيت فيه أثر المساندة والتعاون بين الزملاء الصادق، موضّحًا الذي حدث، وكيف أثّر ذلك في نفوس الحاضرين. استعن في إعدادك للحديث بالأسئلة: ماذا حدث؟ كيف بدت في الموقف؟ كيف يسهم هذا السلوك في نشر مشاعر المودة بالفصل؟ ما الدرس الذي تعلمته؟ ثم قوّم أداءك باستخدام بطاقة: (تحدثت بوضوح – رتبت فكري – استخدمت تعبيرات مناسبة – التزمت بموضوع الحديث – نظرت إلى زملائي في أثناء الحديث).",qs:[
O("تحدّث عن الموقف.","حديث نموذجي: في أحد الأيام واجه أحد زملائي صعوبة في إنجاز مهمة دراسية، فبادر زملاؤه إلى مساعدته وتقاسم العمل معه. استطاع إنجاز مهمته بنجاح، وشعر بالطمأنينة والثقة. وقد نشر هذا السلوك روح المودة والتعاون بيننا، وأدركنا أن مساندة الآخرين في وقت الحاجة تقوي العلاقات وتزيد المحبة داخل الفصل.")]},
{t:"نشاط ٣",ref:"«الأمانة تبني الثقة وتدوم». "+PARA("(موقف أمين) أو (فعل خيانة)"),qs:[
O("اكتب الفقرة.","إجابة نموذجية: ائتمنني أحد أصدقائي على أمر خاص، فحافظت على سره ولم أفشه لأحد. شعر صديقي بالثقة والاطمئنان، وأصبحت علاقتنا أقوى. فالأمانة تبني الثقة بين الناس، بينما الخيانة تهدم العلاقات وتزرع الشك. ولذلك يجب أن نحافظ على الأمانات ونصون عهود الآخرين.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"اقرأ البيتين ثم أجب:\n"+VS,qs:[
O("ما المعنى المقصود من عبارة «إن لم يطوه»؟ وما أثر هذا التعبير في المعنى؟","المقصود بـ«يطوه»: يكتمه ويخفيه في صدره. ويؤكد التعبير ضرورة كتمان السر، ويصوّر السر شيئًا يمكن طيّه وحفظه، مما يجسد أهمية صونه.")]},
{t:"نشاط ٢ (حوار مسرحي)",ref:"تخيّل واكتب حوارًا مسرحيًّا قصيرًا بين شخصين، أحدهما يمثل «اللسان الحريص العاقل» والآخر يمثل «اللسان الثرثار المتسرع»، موظفًا ما تعلمته من فكر النص الشعري ومفرداته.",qs:[
O("اكتب الحوار.","الثرثار: أنا أحب أن أقول كل ما أعرفه!\nالعاقل: ليس كل ما تعرفه يصلح أن تقوله، فكّر في أثر كلامك قبل أن تتكلم.\nالثرثار: وماذا أفعل إذا عرفت سرًّا؟\nالعاقل: تكتمه وتحفظه؛ لأن السر إذا انتشر وخرج، زادته الألسنة وحرّفته.\nالثرثار: الآن فهمت أن الصمت أحيانًا أفضل من الكلام.\nالعاقل: نعم، فالكلمة قد تنفع وقد تضر.")]},
{t:"نشاط ٣",ref:"«العون ينشر المحبة». "+PARA("(مدّ يد العون) أو (الأنانية والخذلان) في تجاوز شخص لمحنته"),qs:[
O("اكتب الفقرة.","إجابة نموذجية: رأيت أحد زملائي يمر بأزمة ويحتاج إلى المساعدة، فبادرت إلى الوقوف بجانبه ومساندته. شعر بالامتنان، وزادت المحبة والتكافل بيننا. فمساعدة المحتاج وإغاثة الملهوف من أجمل صور الإنسانية، وتؤكد أن من حولنا لن يتركونا وقت الشدة.")]}]}]},
{t:"هيا نوظف لغتنا الجميلة",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١",ref:"أجب عما يأتي:",qs:[
M("ما الجملة التي وظّفت الممنوع من الصرف توظيفًا صحيحًا مما يأتي؟",["مررتُ بمساجدًا أثريةٍ تاريخيةٍ.","مررتُ بمساجدَ أثريةٍ تاريخيةٍ.","مررتُ بمساجدِ أثريةٍ تاريخيةٍ.","مررتُ بمساجدٍ أثريةٍ تاريخيةٍ."],1,"«مساجد» ممنوعة من الصرف (صيغة منتهى الجموع) فتُجرّ بالفتحة نيابة عن الكسرة.")]},
{t:"نشاط ٢",ref:"اقرأ البيتين التاليين، ثم أكمل الجدول:\n«واحفظْ لسانَكَ لا تقلْ فتُبتلى ... إنَّ البلاءَ مُوَكَّلٌ بالمنطقِ\nالصمتُ حصنٌ والأمانُ وراحةٌ ... للمرءِ من قيلٍ وقالٍ يُقلَقُ»",qs:[
O("حدد في كل بيت: هل فيه إيجاز أم إطناب؟ وما أثره في المعنى؟","البيت الأول: إيجاز؛ أثره: يوجز المعنى ويحذّر من عاقبة السوء في الكلام بعبارة قصيرة قوية.\nالبيت الثاني: إطناب؛ أثره: يوضح فوائد الصمت ويؤكد راحة الإنسان وابتعاده عن القلق.")]},
{t:"نشاط ٣ (من روائع الأدب العربي)",ref:"وازن بين الفكرة الرئيسة في كلٍّ من رواية «حكايات الغريب» لجمال الغيطاني ورواية «عودة الروح» لتوفيق الحكيم، موضحًا أوجه التشابه والاختلاف بينهما في معالجة هذه الفكرة.",qs:[
O("اكتب الموازنة.","يتفق العملان في الاهتمام بالوطن والهوية والانتماء، وفي إبراز أثر الأحداث العامة في الإنسان والمجتمع. ويختلفان في طريقة المعالجة؛ فـ«حكايات الغريب» تعتمد على تجربة الغربة والذاكرة والحكايات الشعبية والشخصيات، بينما تركز «عودة الروح» على استيقاظ المجتمع المصري وتماسك أفراده وإيقاظ الشعور الوطني لديهم.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"أجب عما يأتي:",qs:[
O("أ- قال الشاعر: «ولا تجعل لسانك سهم حتفٍ ... يصيب الناس عيبًا أو يعيبُ». استخرج من البيت السابق إطنابًا وبيّن أثره في المعنى.","الإطناب: «يصيب الناس عيبًا أو يعيب». أثره: تأكيد خطورة اللسان إذا أُسيء استعماله، وترسيخ ضرورة ضبطه، وتوضيح أنه قد يصيب الناس بالعيب أو يعيبهم."),
O("ب- قال الشاعر: «إذا نطق السفيه فلا تجبهُ ... فخيرٌ من إجابتِه السكوتُ». استخرج من البيت السابق إيجازًا، وضّح نوعه وغرضه.","إيجاز قصر؛ لأن الشاعر عبّر بألفاظ قليلة عن معنى واسع، وهو أن تجاهل السفيه وعدم مجاراته خير من الدخول معه في جدال. الغرض: النصح والإرشاد.")]},
{t:"نشاط ٢",ref:"أجب:",qs:[
M("ما الجملة التي وظّفت الممنوع من الصرف توظيفًا صحيحًا مما يأتي؟",["تعلّمتُ في مدارسَ حكوميةٍ واسعةٍ.","تعلّمتُ في مدارسٍ حكوميةٍ واسعةٍ.","تعلّمتُ في مدارسًا حكوميةٍ واسعةٍ.","تعلّمتُ في مدارسِ حكوميةٍ واسعةٍ."],0,"«مدارس» ممنوعة من الصرف (صيغة منتهى الجموع) فتُجرّ بالفتحة.")]},
{t:"نشاط ٣",ref:"وازن بين رؤية كلٍّ من جمال الغيطاني في رواية «حكايات الغريب» وتوفيق الحكيم في رواية «عودة الروح» لحقيقة هوية الأمة، مع إبراز أوجه التشابه والاختلاف بين الروايتين في معالجة هذه الفكرة.",qs:[
O("اكتب الموازنة.","يتفق العملان في التعبير عن الوطن والهوية والارتباط بالمجتمع، لكن معالجة كل عمل تختلف بحسب بنائه الفني؛ ففي «حكايات الغريب» يرتبط الرمز بالذاكرة الشعبية والإنسان والمكان، بينما يظهر في «عودة الروح» صورة جماعية مرتبطة بالشعب والوطن والروح الوطنية.")]}]}]},
{t:"التقييم الأسبوعي",f:[
{t:"المجموعة (أ)",acts:[
{t:"نشاط ١",ref:"«الصدق منجاة والكذب خيبة». "+PARA("(موقف صدق) أو (فعل كذب)"),qs:[O("اكتب الفقرة.","إجابة نموذجية: اعترف أحد الطلاب لزميله بأنه أخطأ في حقه، فلم يحاول تبرير الحقيقة أو إخفاءها، وقدّر صديقه صدقه وقبل اعتذاره، فعادت الثقة بينهما. وقد أثبت هذا الموقف أن الصدق يحفظ العلاقات ويقويها، بينما الكذب يؤدي إلى فقدان الثقة. لذلك يجب أن نلتزم بالصدق ونتمسك بالحق.")]},
{t:"نشاط ٢",ref:"أجب:",qs:[M("ما الجملة التي وظّفت «الأسماء الخمسة» توظيفًا صحيحًا مما يأتي؟",["كان أباكَ رجلًا صالحًا يحب الخير.","كان أبوكَ رجلًا صالحًا يحب الخير.","كان أبيكَ رجلًا صالحًا يحب الخير."],1,"«أبوك» اسم «كان» مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة.")]},
{t:"نشاط ٣ (من روائع الأدب)",ref:"وازن بين كلٍّ من رواية «حكايات الغريب» لجمال الغيطاني ورواية «عودة الروح» لتوفيق الحكيم من حيث «أثر غياب أو نفي الرمز»، مع توضيح أوجه التشابه والاختلاف بينهما في معالجة هذه الفكرة.",qs:[O("اكتب الموازنة.","يتناول العملان الرمز بوصفه وسيلة للتعبير عن الوطن والهوية والارتباط بالمجتمع، لكن معالجة كل عمل تختلف بحسب بنائه الفني؛ ففي «حكايات الغريب» يرتبط الرمز بالذاكرة الشعبية والإنسان والمكان، بينما يظهر في «عودة الروح» صورة جماعية مرتبطة بالشعب والوطن والروح الوطنية.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"نشاط ١",ref:"«الوفاء عهد والغدر مهلكة». "+PARA("(موقف وفاء) أو (فعل غدر ونكث بالعهد)"),qs:[O("اكتب الفقرة.","إجابة نموذجية: وعد صديقان بعضهما بالحفاظ على سر مهم، فحافظ أحدهما على العهد، بينما أفشى الآخر السر. أدى ذلك إلى فقدان الثقة وفتور العلاقة بينهما. أدرك الصديقان أن الوفاء بالعهود أساس العلاقات الناجحة، وأن الغدر يهدم الثقة. لذلك يجب صون العهود واحترام مشاعر الآخرين.\nأثر الوفاء: يقوّي الثقة ويحافظ على الصداقة. أثر الغدر: يهدم الثقة ويؤدي إلى فساد العلاقة.")]},
{t:"نشاط ٢",ref:"أجب:",qs:[M("ما الجملة التي وظّفت «الأسماء الخمسة» توظيفًا صحيحًا مما يأتي؟",["الطالب ذو الخلق لم يهمل في أداء واجباته.","الطالب ذي الخلق لم يهمل في أداء واجباته.","الطالب ذا الخلق لم يهمل في أداء واجباته."],0,"«ذو» نعت مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة.")]},
{t:"نشاط ٣ (من روائع الأدب)",ref:"وازن بين كلٍّ من رواية «حكايات الغريب» لجمال الغيطاني ورواية «عودة الروح» لتوفيق الحكيم، من حيث دور الأصوات الإنسانية والحكايات الشعبية في تعريف هوية الأمة، مع توضيح أوجه التشابه والاختلاف بينهما في معالجة هذه الفكرة.",qs:[O("اكتب الموازنة.","تسهم الأصوات الإنسانية والحكايات الشعبية في العملين في الكشف عن ملامح المجتمع وتعزيز الإحساس بالانتماء والهوية. وتبرز «حكايات الغريب» أصوات الناس والحكايات المرتبطة بالذاكرة والمكان، بينما تقدم «عودة الروح» المجتمع المصري في صورته الجماعية وتفاعل أفراده وتماسكهم. ويشترك العملان في جعل الإنسان الشعبي جزءًا أساسيًّا من صورة الأمة، مع اختلاف طريقة التناول والبناء الفني.")]}]},
{t:"المجموعة (ج)",acts:[
{t:"نشاط ١",ref:"«العفو صفاء والأنانية جفاء». "+PARA("(موقف عفو وتسامح) أو (فعل إصرار على الإساءة)"),qs:[O("اكتب الفقرة.","إجابة نموذجية: اختلف صديقان بسبب موقف بسيط، وأصرّ أحدهما على موقفه، بينما بادر الآخر إلى الاعتذار والتسامح. أدى العفو إلى انتهاء الخلاف وعودة المحبة بينهما، أما الإصرار على الإساءة فيؤدي إلى الجفاء وتباعد القلوب. لذلك فإن التسامح وسلامة الصدر أساس استمرار العلاقات الإنسانية.")]},
{t:"نشاط ٢",ref:"أجب:",qs:[M("ما الجملة التي وظّفت «الأسماء الخمسة» توظيفًا صحيحًا مما يأتي؟",["كرّمتِ المعلمةُ أخوكَ.","كرّمتِ المعلمةُ أخاكَ.","كرّمتِ المعلمةُ أخيكَ."],1,"«أخاك» مفعول به منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة.")]},
{t:"نشاط ٣ (من روائع الأدب)",ref:"وازن بين كلٍّ من رواية «حكايات الغريب» لجمال الغيطاني ورواية «عودة الروح» لتوفيق الحكيم، من حيث الصراع بين الفرد والمجتمع، مع توضيح أوجه التشابه والاختلاف بينهما في معالجة هذه الفكرة.",qs:[O("اكتب الموازنة.","يظهر الصراع في «حكايات الغريب» من خلال علاقة الفرد بالمجتمع والظروف المحيطة به وما تفرضه الأحداث من مواقف واختبارات، أما «عودة الروح» فتبرز العلاقة بين الفرد والجماعة، وتنتقل من الاهتمام بالفرد إلى الإحساس بالمجتمع والوطن. ويشترك العملان في إبراز أثر المجتمع في تشكيل وعي الفرد، مع اختلاف طبيعة الصراع وطريقة عرضه.")]}]}]}
];
const LOH=(title,text)=>"اكتب لوحة إرشادية – في حدود (١٠٠ كلمة) – بعنوان: ("+title+")، مع مراعاة أن: تتضمن خمس تعليمات واضحة ومباشرة – أسلوبين إنشائيين – تبدأ بمقدمة قصيرة – تستخدم أدوات ربط (لأنّ – لذلك – حتى…) – تنتهي اللوحة بجملة تلخص الفكرة.";
const EXT=(a)=>"استخرج من البيتين:\n"+a;
const U2W5=[
{t:"هيا نوظف لغتنا الجميلة (صحح لغتك وعبّر)",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١",ref:"اقرأ البيتين ثم أجب:\n«إذا المرءُ لم يدنَّسْ من اللؤمِ عِرضُهُ ... فكلُّ رداءٍ يرتديهِ جميلُ\nوإنْ هو لم يحمِلْ على النفسِ ضيمَها ... فليس إلى حسنِ الثناءِ سبيلُ»",qs:[
O(EXT("أ- همزة متوسطة مبينًا سبب رسمها على صورتها.\nب- همزة متطرفة مبينًا سبب رسمها على صورتها.\nج- كلمة بها همزة وصل وأخرى بها همزة قطع."),"أ) اللؤم: الهمزة متوسطة مرسومة على الواو؛ لأنها ساكنة وما قبلها مضموم، والضمة أقوى من السكون.\nب) الثناء: الهمزة متطرفة مرسومة على السطر؛ لأنها سُبقت بألف مد.\nج) همزة وصل: «المرء» (في «أل» التعريف). همزة قطع: «إلى».")]},
{t:"نشاط ٢ (لوحة إرشادية)",ref:LOH("استثمر وقتك بذكاء"),qs:[
O("اكتب اللوحة.","لوحة «استثمر وقتك بذكاء»: الوقت ثروة لا تعود إذا مضت، فاحرص على استثماره فيما ينفعك.\n• ضع لنفسك أهدافًا واضحة تستثمر فيها وقتك.\n• رتّب أولوياتك حتى تنجز المهم قبل الأقل أهمية.\n• خصّص وقتًا للمذاكرة والراحة والنشاط.\n• ابتعد عن مضيعات الوقت؛ لأن دقائقها تتجمع فتتحول إلى ساعات.\n• راجع أعمالك يوميًّا لتعرف ما أنجزته وما تحتاج إلى تحسينه.\nلذلك اجعل لكل ساعة هدفًا، واستثمر وقتك بذكاء حتى تحقق طموحاتك وتبني مستقبلك.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"علّل رسم الهمزة على صورتها في الكلمات الآتية: (رداء – تساؤل – أصعب – المروءة).",qs:[
O("علّل رسم الهمزة في الكلمات الأربع.","رداء: الهمزة متطرفة على السطر؛ لأن ما قبلها ألف مد.\nتساؤل: الهمزة متوسطة على الواو؛ لأنها مفتوحة وما قبلها مضموم، والضمة أقوى.\nأصعب: همزة قطع في أول الكلمة؛ لأنها اسم مبدوء بهمزة قطع.\nالمروءة: الهمزة متوسطة على واو؛ لأنها مفتوحة وما قبلها مضموم.")]},
{t:"نشاط ٢ (لوحة إرشادية)",ref:LOH("بيئتي.. مدرستي.. مسئوليتي"),qs:[
O("اكتب اللوحة.","لوحة «بيئتي مدرستي مسئوليتي»: بيئتي هي المكان الذي أعيش فيه وأتعلم فيه، ولذلك يجب أن أحافظ عليها.\n• لا تلقِ المخلفات في غير أماكنها.\n• حافظ على نظافة فصلك ومدرستك.\n• استخدم المياه والكهرباء دون إسراف.\n• شارك زملاءك في زراعة الأشجار والعناية بها.\n• احرص على نظافة المرافق المدرسية؛ لأنها ملك للجميع.\nلذلك يجب أن نتعاون حتى تصبح مدرستنا بيئة نظيفة وجميلة، لأن المحافظة عليها مسئولية كل طالب.")]}]}]},
{t:"مراجعة على الوحدة الثانية",f:[
{t:"الأداءات الصفية",acts:[
{t:"السؤال الأول (التقنية وصناعة الرأي العام)",ref:"من نص (التقنية وصناعة الرأي العام) اقرأ ثم أجب: «…ومع الوقت يتعزز داخله ما يعرف بـ«التحيز التأكيدي»، حين يتعرض الفرد لمحتوى متكرر يتفق مع ميوله السابقة، أي الميل إلى تصديق ما ينسجم مع أفكاره المسبقة. وتتحول هذه العملية إلى ما يسمى بـ«فقاعة التصفية»؛ حيث يجد الإنسان نفسه محاطًا بآراء تشبه رأيه، وأخبار تؤكد قناعاته، وتحليلات تعيد إنتاج نظرته للعالم. وفي هذه البيئة المغلقة لا تتكون القناعة من خلال مقارنة متعددة للرؤى، بل من خلال التكرار والانتقاء.»",qs:[
M("ورد في النص مصطلحا «التحيز التأكيدي» و«فقاعة التصفية». حدد العلاقة الدلالية بين هذين المفهومين داخل السياق.",["«التحيز التأكيدي» هو المخرج التقني الآلي الذي تفرضه الخوارزميات، بينما «فقاعة التصفية» هي الدافع النفسي الفطري المتأصل في الفرد.","«التحيز التأكيدي» يمثل البيئة الجغرافية الرقمية المغلقة، في حين أن «فقاعة التصفية» هي آلية التكرار اللغوي داخل النص.","«التحيز التأكيدي» هو (ميل ذاتي) لدى المتلقي لتصديق ما يوافقه، بينما «فقاعة التصفية» هي الحالة المصنوعة تقنيًّا والتي تعزل هذا المتلقي عن الآراء الأخرى.","«التحيز التأكيدي» مصطلح يدل على التعددية الفكرية، بينما «فقاعة التصفية» تدل على الانفتاح النقدي للمجتمع الرقمي."],2,"الأول ميل ذاتي لدى المتلقي، والثانية حالة صنعتها التقنية فعزلت المتلقي."),
M("ما الآلية الدقيقة التي تُصنع بها قناعات «الرأي العام الرقمي» كما تُفهم من النص، وما نوع الخطاب المستنتج؟",["آلية ديمقراطية تفاعلية قائمة على مقارنة الرؤى؛ والخطاب سياسي توجيهي.","آلية نفسية – تقنية تعتمد على التكرار الانتقائي وتغييب التعددية؛ والخطاب تحليلي نقدي.","آلية عشوائية لا تخضع لأي نمط تكنولوجي مسبق؛ والخطاب سردي قصصي ترفيهي.","آلية قائمة على الحوار العقلاني الرصين والبرهنة العلمية؛ وخطاب إرشادي وعظي مباشر."],1,"آلية نفسية تقنية تعتمد على التكرار الانتقائي؛ والخطاب تحليلي نقدي."),
O("وضّح كيف استخدم الكاتب روابط السببية، والمجاز (التشبيه)، والتدرج من الخاص (الفرد) إلى العام (البيئة المغلقة) لإثبات وجهة نظره.","استخدم الكاتب روابط السببية ليبين أن التعرض المتكرر للمحتوى الذي يتفق مع الميول السابقة يؤدي إلى تعزيز القناعة ثم إلى تكوين «فقاعة التصفية». واستخدم المجاز في تصوير البيئة الرقمية المغلقة كأنها «فقاعة» تحيط بالمتلقي وتعزله عن الآراء الأخرى. كما تدرج من الفرد الذي يتعرض للمحتوى إلى البيئة الرقمية التي تتكون حوله، ليبين أثر هذه الظاهرة في تشكيل الرأي العام."),
O("استنتج العلاقة بين سلطة «التأثير التقني» (الخوارزميات والتكرار) وسلبية «دور المتلقي» (الانقياد والميل للموافق)، مبينًا كيف يسلب التقني من البشري ملكة النقد والمقارنة ويهدد استقلاله الفكري.","كلما زاد اعتماد المتلقي على المحتوى الذي تنتقيه الخوارزميات، وتكرر أمامه ما يوافق أفكاره، قلّ تعرضه للرؤى المختلفة. ويؤدي ذلك إلى إضعاف المقارنة والنقد، وجعل المتلقي أكثر ميلًا إلى قبول المحتوى المتكرر دون فحص كافٍ.")]},
{t:"السؤال الثاني (نص متحرر)",ref:"اقرأ ثم أجب: «لم يعد الرأي العام نتاجًا لخطابات تقليدية أو نقاشات في ميادين مغلقة، بل أضحى فضاءً رقميًّا شاسعًا تصنعه «الكلمة الرقمية» التي تمتلك اليوم سلطانًا عابرًا للحدود والمسافات. إن نقرة زر واحدة على منصات التواصل الاجتماعي كفيلة بأن تحوّل فكرة بسيطة إلى قضية رأي عام عالمية في زمن قياسي، حيث تتداخل خوارزميات المنصات الذكية مع عواطف الجماهير لتوجيه قناعاتهم وتشكيل اتجاهاتهم الفكرية والسياسية والاجتماعية. بيد أن هذا السلطان الرقمي الجبار يضع شباب العصر الحديث أمام تحدٍّ نقدي وتوعوي بالغ الخطورة؛ فالكلمة عبر الفضاء الافتراضي سلاح ذو حدين، يمكنها بناء وعي جمعي مستنير يخدم قضايا الوطن، كما يمكنها بث الشائعات وتزييف الحقائق ببراعة فائقة. لذا، يفرض هذا الواقع على شبابنا امتلاك أدوات «الوعي المعلوماتي»، فلا يكتفون باستهلاك المحتوى عشوائيًّا، بل يمحصون الرسائل الرقمية بوعي حذر، لتبقى الكلمة أداة بناء وتنوير، لا وسيلة للتضليل الفكري واختطاف العقول.»",qs:[
M("المفهوم الأدق المعبر عن التمييز الفكري بين «الاندفاع العاطفي للمتلقي» و«التوجيه الآلي للمنصات» في البيئة الافتراضية هو:",["الأول مخرج تقني برمجي، والآخر دافع فطري ذاتي.","الأول بيئة جغرافية مغلقة، والآخر تكرار لغوي في النص.","الأول ميل ذاتي لتصديق ما يثير المشاعر، والآخر صناعة خوارزمية لعزل المتلقي وتوجيهه.","الأول يعكس التعددية الفكرية، والآخر يمثل الانفتاح النقدي للمجتمع."],2,"الأول ميل ذاتي، والآخر صناعة خوارزمية لعزل المتلقي وتوجيهه."),
M("الآلية الدقيقة لصناعة قناعات «الرأي العام الرقمي»، ونوع الخطاب:",["آلية ديمقراطية تفاعلية قائمة على مقارنة الرؤى؛ والخطاب سياسي توجيهي.","آلية نفسية – تقنية تعتمد على التكرار الانتقائي وتغييب التعددية؛ والخطاب تحليلي نقدي.","آلية عشوائية لا تخضع لأي نمط تكنولوجي مسبق؛ والخطاب سردي قصصي ترفيهي.","آلية قائمة على الحوار العقلاني الرصين والبرهنة العلمية؛ وخطاب إرشادي وعظي مباشر."],1,"آلية نفسية تقنية؛ والخطاب تحليلي نقدي."),
O("وضّح كيف استخدم الكاتب روابط السببية، والمجاز، والتدرج من الفرد المتصفح إلى الفضاء الرقمي الشاسع لإثبات وجهة نظره.","أقام الكاتب علاقة سببية بين الخوارزميات والتكرار وبين توجيه القناعات وتشكيل الاتجاهات. واستخدم المجاز في تصوير الكلمة الرقمية بأنها «سلاح ذو حدين»؛ فهي قد تبني الوعي وقد تسهم في التضليل. كما انتقل من تجربة الفرد المتصفح إلى أثر التقنية في الفضاء الرقمي الشاسع ليبين اتساع تأثير الظاهرة."),
O("وضّح كيف يسلب التقني من البشري ملكة النقد والمقارنة.","عندما تكرر الخوارزميات للمستخدم محتوى يتفق مع ميوله، يصبح محاطًا بآراء متشابهة، فيقل احتكاكه بالرأي المخالف. وهذا يضعف قدرته على المقارنة والنقد، ويجعله أكثر قابلية لتكوين قناعة بالتكرار والانتقاء بدلًا من فحص الآراء المتعددة.")]},
{t:"السؤال الثالث (بين الذوق والعقل)",ref:"من نص (بين الذوق والعقل) اقرأ ثم أجب:\n«ثم إذا هو ارتقى في الذوق كره القبح في أمته، وأحبّ الجمال فيها، فهو ينفر من قبح البؤس والفقر والظلم فيها، وينشد جمال الرخاء والعدل في معاملتها، فيصعد به ذوقه إلى مستوى المصلحين. فالإصلاح المؤسس على العقل وحده لا يجدي، وإنما يجدي الإصلاح المؤسس على العقل والذوق جميعًا.»",qs:[
M("ما المعنى الدقيق الذي يؤديه لفظ «ينشد» في عبارة «وينشد جمال الرخاء والعدل»، وكيف يسهم هذا المعنى في بلورة الفكرة الرئيسة للفقرة؟",["يغني بالفضائل؛ ليسهم في إبراز أن الإصلاح مجرد شعارات وكلمات أدبية بلاغية تقال في المجتمع.","يغتنم / يسعى بجدّ؛ ليسهم في تأكيد أن الذوق الرفيع يتحول من شعور باطني إلى قوة دافعة للتغيير المجتمعي الفعلي.","ينتظر بترقب؛ ليسهم في بيان أن المصلح يتبنى موقف المراقب السلبي لحين تبدل أحوال الأمة تلقائيًّا.","يستفسر ويتساءل؛ ليسهم في توضيح أن الذوق وظيفة عقلية بحتة تبحث عن مسببات الفقر والبؤس بالأدلة."],1,"«ينشد» أي يطلب بجد ويسعى لتحقيق جمال الرخاء والعدل."),
M("ما الدلالة المستنتجة من قول الكاتب: «فيصعد به ذوقه إلى مستوى المصلحين»؟",["أن مرتبة الإصلاح الاجتماعي هبة فطرية يولد بها الإنسان ولا علاقة لها بنمو وعيه.","أن الإصلاح الاجتماعي لا يتطلب سوى النفور من الفقر والبؤس.","أن الارتقاء بالوعي الجمالي والوجداني للفرد هو المحرك الأساسي للانتقال إلى التغيير المجتمعي.","أن المصلحين يركزون فقط على المظاهر الحسية للأمة ويهملون الفكرية والعقلية."],2,"الارتقاء بالوعي الجمالي والوجداني هو المحرك الأساسي للتغيير المجتمعي."),
O("كيف ينعكس صقل ذوق الفرد من رتبة الانفعال بالجمال الحسي الخارجي (كالزهور والبساتين) إلى رتبة الثورة على القبح الاجتماعي (كالظلم والفقر) والوصول لمرتبة المصلحين؟","يبدأ الفرد بالإحساس بالجمال في مظاهره الحسية كالزهور والبساتين، ثم يرتقي وعيه فيصبح قادرًا على إدراك القبح المعنوي في المجتمع كالظلم والفقر والبؤس. وعندما يصبح هذا الإحساس عميقًا، لا يكتفي بالنفور من القبح، بل يسعى إلى تغييره، وبذلك ينتقل من مجرد صاحب ذوق إلى مصلح اجتماعي."),
O("تعتمد الدول المعاصرة اليوم في منظومتها الإصلاحية على وضع القوانين والتشريعات الصارمة (سلطة العقل التشريعي). وازن بين هذه الممارسات المعاصرة ورؤية الكاتب في قوله: «وإنما يجدي الإصلاح المؤسس على العقل والذوق جميعًا»، مبينًا رأيك المدعّم بالأدلة حول مدى كفاية القانون الجاف وحده في القضاء على مظاهر القبح الاجتماعي كالتنمر والفساد.","القانون يعالج السلوك الظاهر، بينما يحتاج المجتمع السليم أيضًا إلى الوعي الأخلاقي والذوق الإنساني؛ فالقوانين والتشريعات ضرورية لضبط السلوك ووضع حدود واضحة لما يجوز وما لا يجوز، لكنها لا تكفي وحدها لبناء مجتمع سليم. والعقل يضع القواعد، والذوق والضمير يدفعان الإنسان إلى وعي أخلاقي يجعل الفرد يرفض الظلم والفساد حتى في غياب الرقابة. ولذلك تتفق رؤية الكاتب مع أهمية الجمع بين العقل والذوق.\nالخلاصة: القانون يضع الإطار الخارجي، أما التربية والوعي الأخلاقي فيبنيان الرقابة الداخلية؛ واجتماعهما أكثر شمولًا في مواجهة مظاهر القبح الاجتماعي مثل التنمر والفساد.")]},
{t:"السؤال الرابع (أثر الكلمة وحفظ اللسان)",ref:"من نص (أثر الكلمة وحفظ اللسان) اقرأ ثم أجب:\n«لا تأمنِ الدهرَ الخئونَ فإنه ... ما زال قِدمًا للرجالِ يؤدِّبُ\nودعِ الكذوبَ فلا يكنْ لك صاحبًا ... إنَّ الكذوبَ يشينُ حرًّا يصحبُ»",qs:[
M("ما المعنى الدقيق لكلمة «يشين» في البيت الثاني؟",["يمزّق ويفتت.","يعيب ويسيء.","يبعد وينأى.","يضلل ويغوي."],1,"«يشين» أي يعيب ويسيء."),
M("ما التحذير الذي بدأ به الشاعر في البيت الأول؟",["التحذير من مصاحبة الكذوب.","التحذير من الغدر والخيانة.","التحذير من الركون والأمان لتقلبات الدهر.","التحذير من كثرة الكلام والثرثرة."],2,"البيت الأول يحذر من الركون والأمان لتقلبات الدهر وصروفه."),
O("ما علاقة جملة «فإنه ما زال قدمًا للرجال يؤدب» بما قبلها؟","تعليل لما قبلها."),
O("ما نوع الأسلوب في قوله «ودع الكذوب»؟","أسلوب إنشائي (أمر) غرضه النصح والإرشاد.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"السؤال الأول",ref:"اختر الجملة التي وظّفت الممنوع من الصرف توظيفًا صحيحًا:",qs:[
M("اختر الإجابة الصحيحة:",["قدّمتُ الماء لرجلٍ عطشانَ.","قدّمتُ الماء لرجلٍ عطشانٍ.","قدّمتُ الماء لرجلٍ عطشانًا.","قدّمتُ الماء لرجلٍ عطشانِ."],0,"«عطشان» ممنوع من الصرف لعلتين: الصفة وزيادة الألف والنون، ومجرور بالفتحة لأنه نكرة."),
M("ما الجملة التي وظّفت الممنوع من الصرف توظيفًا صحيحًا؟",["تجولتُ في صحراءٍ واسعةِ الأرجاء.","تجولتُ في صحراءَ واسعةِ الأرجاء.","تجولتُ في صحراءً واسعةِ الأرجاء.","تجولتُ في صحراءِ واسعةِ الأرجاء."],1,"«صحراء» ممنوعة من الصرف لألف التأنيث الممدودة فتُجرّ بالفتحة.")]},
{t:"السؤال الثاني",ref:"اقرأ البيتين التاليين، ثم أكمل الجدول:\n«وتعاونوا في الخير تسمُ بلادكم ... فالجودُ رفعٌ والتعاونُ أصوبُ\nإنَّ الأمورَ إذا استبدتْ صعبةٌ ... ومعَ التشاورِ كلُّ أمرٍ يسهلُ»",qs:[
O("حدد في كل بيت: هل فيه إيجاز أم إطناب؟ وما أثره في المعنى؟","إجابة استرشادية: البيت الأول فيه إطناب بتوكيد قيمة التعاون وتفصيل أثره في رفعة البلاد. البيت الثاني فيه إيجاز؛ إذ أوجز الشاعر فضل التشاور وأثره في تسهيل الأمور بعبارة قصيرة.")]},
{t:"السؤال الثالث",ref:"اقرأ البيتين ثم أجب:\n«خذِ العفوَ وأمرْ بالجميلِ ولا تكنْ ... قاسيَ الفؤادِ فما للقاسي مهربُ\nكنْ بلسمًا إنْ صار دهرُكَ أرقمًا ... وحلاوةً إنْ صار غيرُك علقمًا»",qs:[
O(EXT("أ- همزة متوسطة مبينًا سبب رسمها على صورتها.\nب- كلمة تنتهي بتاء وبيّن نوعها.\nج- كلمة بها همزة وصل وأخرى بها همزة قطع."),"أ) الفؤاد: همزة متوسطة، حركتها الفتح، وما قبلها مضموم، والضمة أقوى من الفتحة؛ لذلك كُتبت على واو.\nب) حلاوة: تاء مربوطة. صارت: تاء مبسوطة.\nج) همزة وصل: اكتب. همزة قطع: أخذ / إن."),O(LOH("الاستخدام الآمن للإنترنت"),"لوحة «الاستخدام الآمن للإنترنت»: الإنترنت وسيلة عظيمة للعلم والتواصل، فاحرص على استخدامه فيما ينفعك.\n• لا تشارك بياناتك الشخصية مع الغرباء؛ حتى تحافظ على خصوصيتك.\n• استخدم كلمات مرور قوية، وغيّرها باستمرار.\n• تحقّق من صحة الأخبار والمعلومات قبل نشرها؛ لأن الشائعات قد تضر الآخرين.\n• لا تفتح الروابط والملفات المجهولة؛ حتى تحمي جهازك من المخاطر.\n• احترم الآخرين عند الحوار، ولا تستخدم ألفاظًا مسيئة.\nفكن مستخدمًا واعيًا للإنترنت، واجعل التقنية طريقًا للعلم والنجاح.")]},
{t:"السؤال الرابع (من روائع الأدب)",ref:"من روائع الأدب: اقرأ ثم أجب:",qs:[
O("وازن بين الفكرة الرئيسة في كل من كتاب أدب الرحلات «شمس وليل» لمحمود تيمور، ورواية «الأرض» لعبد الرحمن الشرقاوي، من حيث موقف كل عمل من قضية (علاقة الفرد ببيئته والآخر)، مع توضيح أوجه التشابه والاختلاف بينهما في معالجة هذه الفكرة.","«شمس وليل»: يبرز علاقة الإنسان بالبيئة والآخر من خلال الرحلة والملاحظة والتأمل، أما «الأرض»: فتركز على ارتباط الإنسان بالأرض والوطن، وما يترتب على هذا الارتباط من صراع وتضحية وتمسك بالحق.\nالتشابه: كلا العملين يؤكد أهمية علاقة الإنسان ببيئته ومجتمعه.\nالاختلاف: «شمس وليل» يعالج الفكرة من خلال أدب الرحلات والوصف والتأمل، أما «الأرض» فتعالجها من خلال الرواية والصراع الاجتماعي والوطنية.")]}]}]},
{t:"التقييم الأسبوعي",f:[
{t:"المجموعة (أ)",acts:[
{t:"نشاط ١",ref:"اقرأ البيتين ثم أجب:\n«ومَن يكُ ذا فضلٍ فيبخلْ بفضلِهِ ... على قومِهِ يُستغنَ عنهُ ويُذمَمِ\nوأنزلَ نفسَهُ منزلَ الكرامِ إذا ... رأى أمرًا يعيبُ المرءَ لم يُقدِمِ»",qs:[
O(EXT("أ- همزة متطرفة مبينًا سبب رسمها على صورتها.\nب- كلمة بها همزة وصل وأخرى بها همزة قطع."),"أ) همزة متطرفة: المرء؛ الهمزة متطرفة، قبلها ساكن.\nب) همزة وصل: استغنى. همزة قطع: إذا / إن.")]},
{t:"نشاط ٢ (لوحة إرشادية)",ref:LOH("حافظ على بيئتك لتسعد"),qs:[
O("اكتب اللوحة.","لوحة «حافظ على بيئتك لتسعد»: بيئتك بيتك الكبير، فحافظ عليها لتعيش حياة صحية آمنة.\n• لا تلقِ المخلفات في الشوارع أو المياه.\n• ازرع الأشجار؛ لأنها تنقي الهواء وتجمّل المكان.\n• قلّل استخدام البلاستيك قدر الإمكان.\n• حافظ على المياه ولا تهدرها.\n• شارك في حملات تنظيف البيئة؛ حتى تسهم في حماية مجتمعك.\nحافظ على بيئتك اليوم، لتضمن حياة أجمل غدًا.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"نشاط ١",ref:"اقرأ البيتين ثم أجب:\n«إذا لم تكنْ صدرًا بأرضِكَ لم تكنْ ... بأُخرى فهيِّئْ للشقاءِ رداءَكا\nوما المرءُ إلا إخوةٌ وأقاربُ ... يضيئون في ليلِ الحياةِ سماءَكا»",qs:[
O(EXT("أ- همزة متوسطة مبينًا سبب رسمها على صورتها.\nب- همزة متطرفة مبينًا سبب رسمها على صورتها.\nج- كلمة بها همزة وصل وأخرى بها همزة قطع."),"أ) همزة متوسطة: يضيئون؛ مضمومة وقبلها كسر، فكُتبت على نبرة.\nب) همزة متطرفة: المرء؛ الهمزة متطرفة، قبلها ساكن.\nج) همزة وصل: استخرج. همزة قطع: أخوة / إلا.")]},
{t:"نشاط ٢ (لوحة إرشادية)",ref:LOH("القراءة غذاء الروح"),qs:[
O("اكتب اللوحة.","لوحة «القراءة غذاء الروح»: القراءة نافذة تطل منها على عوالم واسعة، وبها تزداد علمًا ووعيًا.\n• خصّص وقتًا يوميًّا للقراءة؛ حتى تنمّي معارفك.\n• اختر الكتب الناجحة التي تثري فكرك.\n• دوّن الأفكار المهمة التي تتعلمها من قراءاتك.\n• ناقش ما تقرؤه مع الآخرين؛ لأن الحوار يوسع مداركك.\n• اجعل القراءة عادة ثابتة في حياتك.\nاقرأ كل يوم، فالعقل الذي يقرأ عقل ينمو ويتقدم.")]}]},
{t:"المجموعة (ج)",acts:[
{t:"نشاط ١",ref:"اقرأ البيتين ثم أجب:\n«ولا ترجُ السماحةَ من بخيلٍ ... فما في النارِ للظمآنِ ماءُ\nإذا نطقَ السفيهُ فلا تُجبْهُ ... فخيرٌ من إجابتِهِ السكوتُ»",qs:[
O(EXT("أ- همزة متوسطة مبينًا سبب رسمها على صورتها.\nب- همزة متطرفة مبينًا سبب رسمها على صورتها.\nج- كلمة بها همزة وصل وأخرى بها همزة قطع."),"أ) همزة متوسطة: الظمآن.\nب) همزة متطرفة: ماء / شيء؛ الهمزة متطرفة وما قبلها ساكن، فتُكتب على السطر.\nج) همزة وصل: استجب. همزة قطع: إذا / إجابة.")]},
{t:"نشاط ٢ (لوحة إرشادية)",ref:LOH("الرياضة أسلوب حياة"),qs:[
O("اكتب اللوحة.","لوحة «الرياضة أسلوب حياة»: الرياضة ليست مجرد حركة، بل أسلوب حياة يحافظ على صحة الجسم والعقل.\n• مارس الرياضة يوميًّا ولو لفترة قصيرة.\n• اختر رياضة مناسبة لعمرك وقدرتك.\n• احرص على شرب الماء بصورة كافية.\n• اجعل الحركة جزءًا من روتينك اليومي؛ حتى تحافظ على نشاطك.\n• لا تهمل الراحة والغذاء الصحي.\nمارس الرياضة؛ لأن الجسم السليم يعين صاحبه على حياة أجمل.")]}]}]}
