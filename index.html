:root{--bg:#f6f3ec;--card:#fff;--ink:#1f2a2e;--mut:#6b7780;--line:#e3ddd0;--acc:#0f6e5c;--accbg:#e2f2ee;--ok:#1b7f3b;--okbg:#e4f5e8;--bad:#b3261e;--badbg:#fbe7e5;
--k0:#0f766e;--k1:#4f46e5;--k2:#b45309;--k3:#be185d;--k4:#0369a1;--k5:#7e22ce;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--card:#1d2427;--ink:#eaeeee;--mut:#9aa7ad;--line:#2d373b;--acc:#4fc3a8;--accbg:#173a33;--ok:#6fd58a;--okbg:#173222;--bad:#ff8a80;--badbg:#3a1d1b;--k0:#4fd1b8;--k1:#a5a0ff;--k2:#f5b25c;--k3:#ff8fbf;--k4:#6cc4ff;--k5:#d8a6ff;--on:#14191b;color-scheme:dark}}
:root[data-theme="dark"]{--k0:#4fd1b8;--k1:#a5a0ff;--k2:#f5b25c;--k3:#ff8fbf;--k4:#6cc4ff;--k5:#d8a6ff;--on:#14191b;--bg:#14191b;--card:#1d2427;--ink:#eaeeee;--mut:#9aa7ad;--line:#2d373b;--acc:#4fc3a8;--accbg:#173a33;--ok:#6fd58a;--okbg:#173222;--bad:#ff8a80;--badbg:#3a1d1b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;line-height:1.9;font-size:17px}
main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
header.top{text-align:center;padding:18px 0 6px}
h1{font-size:26px;margin:0}h2{font-size:21px;margin:18px 0 10px}
.sub{color:var(--mut);margin:2px 0 0;font-size:15px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--mut);margin:10px 0}
.crumbs a{color:var(--acc);text-decoration:none}.crumbs a:hover{text-decoration:underline}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:14px}
.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:inherit;transition:.15s}
a.tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.tile{text-align:center}.tile b{display:block;font-size:18px}.tile span{display:block;color:var(--mut);font-size:14px}
.tile.off{opacity:.55;cursor:not-allowed}.tile{position:relative}.tile.done{border-color:var(--ok)}.tile i.chk{position:absolute;top:10px;inset-inline-start:12px;font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--ok);color:var(--bg);display:grid;place-items:center;font-size:15px;line-height:1}
.badge{display:inline-block;font-size:12px;padding:0 9px;border-radius:99px;background:var(--accbg);color:var(--acc);margin-inline-start:6px}
.badge.soon{background:var(--line);color:var(--mut)}
.c0{--cc:var(--k0)}.c1{--cc:var(--k1)}.c2{--cc:var(--k2)}.c3{--cc:var(--k3)}.c4{--cc:var(--k4)}.c5{--cc:var(--k5)}
.tile{border-top:5px solid var(--cc,var(--acc))}.tile.done{border-top-color:var(--cc,var(--acc))}
.tri{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:540px;margin:16px auto 0}.tri .tile{width:calc(50% - 7px);aspect-ratio:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px}.tri .tile b{font-size:17px}
.num{font-family:Amiri,'Traditional Arabic',serif;font-weight:700}.tri .num{width:68px;height:68px;font-size:42px;padding-top:4px;margin:0 auto 12px}.tri .tile span{font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.tri .tile span span{display:block}.tri .tile .nm{font-size:17px;font-weight:700;color:var(--ink)}
.tile:not(.off),.opt,.btn:not(.tg),.back{position:relative;overflow:hidden}
.tile:not(.off)::after,.opt::after,.btn:not(.tg)::after,.back::after{content:"";position:absolute;top:-60%;left:0;width:26%;height:220%;pointer-events:none;opacity:0;transform:translateX(-160%) rotate(24deg);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--cc,var(--acc)) 26%,transparent) 50%,transparent)}
.tile:not(.off):hover::after,.back:hover::after,.opt:hover:not([disabled])::after,.btn:not(.tg):hover::after{animation:streak 1s cubic-bezier(.45,.05,.25,1)}
@keyframes streak{0%{opacity:0;transform:translateX(-160%) rotate(24deg)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(480%) rotate(24deg)}}
@media (prefers-reduced-motion:reduce){.tile::after,.opt::after,.btn::after,.back::after{animation:none!important}}
.tri .tile span.pg{font-size:13px;font-weight:700;color:var(--cc,var(--acc));margin-top:2px}
.fin{max-width:540px;margin:14px auto 0;text-align:center;padding:10px;border:1.5px dashed var(--line);border-radius:14px;color:var(--mut)}.fin b{display:block;color:var(--ink)}a.fin{display:block;text-decoration:none;transition:.15s}a.fin:hover{border-color:var(--acc);border-style:solid}
.opt::after,.btn:not(.tg)::after{left:auto;right:0;transform:translateX(160%) rotate(-24deg)}
.opt:hover:not([disabled])::after,.btn:not(.tg):hover::after{animation:streakRL 1s cubic-bezier(.45,.05,.25,1)}
@keyframes streakRL{0%{opacity:0;transform:translateX(160%) rotate(-24deg)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(-480%) rotate(-24deg)}}
.ref{white-space:pre-line}
.back{display:inline-block;margin-top:6px;padding:3px 16px;border:1.5px solid var(--acc);border-radius:99px;color:var(--acc);text-decoration:none;font-size:15px}.back:hover{background:var(--accbg)}
.num{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--cc,var(--acc));color:var(--on);font-weight:700;margin:0 auto 6px;line-height:1}
.act{background:color-mix(in srgb,var(--cc) 9%,var(--card));border:1.5px solid var(--cc);border-inline-start:7px solid var(--cc);border-radius:14px;padding:6px 16px 14px;margin:18px 0}
.act h3{display:inline-block;margin:10px 0 6px;background:var(--cc);color:var(--on);padding:0 16px;border-radius:99px;font-size:17px}
.ref{background:color-mix(in srgb,var(--cc,var(--acc)) 16%,var(--card));border-radius:10px;padding:8px 12px;font-size:15px;margin:6px 0 10px}
.q{border-top:1px dashed color-mix(in srgb,var(--cc,var(--line)) 55%,transparent);padding:12px 0}.q:first-of-type{border-top:0}
.qt{font-weight:600}
.opt{display:flex;gap:10px;width:100%;text-align:start;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--acc)}
.opt i{font-style:normal;font-weight:700;color:var(--cc,var(--acc))}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:6px;font-size:15px;padding:8px 12px;border-radius:10px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.btn{font:inherit;background:var(--acc);color:var(--bg);border:0;border-radius:10px;padding:5px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
textarea{width:100%;min-height:70px;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px;margin:6px 0}
.ans{background:var(--okbg);border-inline-start:4px solid var(--ok);border-radius:8px;padding:8px 12px;margin-top:8px}
.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.note{color:var(--mut);font-size:14px;text-align:center;margin-top:30px}
.tg{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px}
.tri .num{flex-shrink:0}
.q,.ref,.ans,.opt{overflow-wrap:anywhere}
@media (max-width:520px){
main{padding:12px 12px 48px}
h1{font-size:23px}h2{font-size:19px;margin:14px 0 8px}
.tri{gap:10px;margin-top:12px}
.tri .tile{width:calc(50% - 5px);aspect-ratio:auto;min-height:150px;padding:14px 8px}
.tri .num{width:56px;height:56px;font-size:34px;margin:0 auto 8px;padding-top:2px}
.tri .tile b{font-size:16px;line-height:1.5}.tri .tile .nm{font-size:16px}
.act{padding:4px 10px 12px;border-inline-start-width:5px;margin:14px 0}
.ref{padding:8px 10px}
.score{position:static;flex-wrap:nowrap;gap:8px;padding:6px 10px;font-size:13px;line-height:1.6;margin:8px 0}
.score span{flex:1}.score .btn{white-space:nowrap;font-size:14px;padding:4px 10px}
.opt{padding:8px 10px}
.fin{margin-top:12px}
}
.num i.gl{display:block;line-height:1;font:inherit;font-style:normal;color:inherit}
.num[data-l="أ"] i.gl{transform:translateY(.29em)}
.num[data-l="ب"] i.gl{transform:translateY(-.16em)}
.num[data-l="ج"] i.gl{transform:translate(-.075em,-.34em)}
.num[data-l="د"] i.gl{transform:translateY(-.15em)}
.num[data-l]{padding-top:0!important}
.tri .num:not([data-l]){padding-top:0!important}
.act .btn.show{background:var(--cc);color:var(--on)}
</style>
</head>
<body>
<button class="btn ghost tg" id="tg" aria-label="تبديل الوضع">◐</button>
<main id="app"></main>
<script>
const P=(a,b)=>({ar:a,t:b});
const ACTS=[
{t:"نشاط ١",ref:"من نص (العلم بين القانون والضمير)، اقرأ الفقرة من «لم يعرف الإنسان في تاريخه…» إلى «تقدم المجتمعات وازدهارها»، ثم أجب:",qs:[
{k:"mcq",q:"المعنى الدقيق لكلمة (مستعصية) بحسب سياقها في الفقرة:",o:["نادرة الحدوث والانتشار.","شديدة الخطورة والعدوى.","صعبة الشفاء والعلاج.","مزمنة وتحتاج وقتًا طويلًا."],a:2,e:"«مستعصية» أي يصعب علاجها والشفاء منها."},
{k:"open",q:"ما عناصر البنية الحجاجية في النص السابق؟",a:"تتكون البنية الحجاجية من: المقدمة (طرح القضية والاهتمام بالعلم والضمير)، والأدلة والحجج (الاستشهاد بالتطبيقات الطبية والطاقة النووية)، والخاتمة التي تخلص إلى ضرورة تكامل القانون مع الأخلاق والضمير."},
{k:"open",q:"بعد الاستماع لنص (الهوية الرقمية) أجب: ما الأمر الذي اجتمع الفريق لمناقشته؟ وما علاقته بما ورد في نص القراءة (العلم بين القانون والضمير) فيما يخص أخلاقيات البحث العلمي؟",a:"اجتمع الفريق لمناقشة قضية الهوية الرقمية وأخلاقيات استخدام البيانات والمعلومات. وعلاقتها بنص «العلم بين القانون والضمير» في التأكيد على أن التقدم التقني والرقمي يحتاج دائمًا إلى ضوابط أخلاقية وضمير إنساني يحمي حقوق الأفراد، ولا يكتفي بالنصوص القانونية وحدها."}]},
{t:"نشاط ٢",ref:"من نص (العلم بين القانون والضمير) اقرأ الفقرة من «لقد قدّمت الاكتشافات العلمية…» إلى «…المسئولية عند وقوع الخطأ»، ثم أجب:",qs:[
{k:"open",q:"قدّم النص حجتين: الأولى عن الجانب الإيجابي للقوة العلمية، والثانية عن الوجه الآخر لها. فما هما؟",a:"الحجة الأولى (الجانب الإيجابي): المنافع العظيمة للبشرية، مثل التقنيات الطبية التي أنقذت ملايين الأرواح، والطاقة النووية التي وفرت مصادر ضخمة للكهرباء، والذكاء الاصطناعي الذي سهّل العمل.\nالحجة الثانية (الوجه الآخر): المخاطر الناتجة عن إساءة استخدام العلم، مثل الهندسة الوراثية التي أثارت جدلًا حول التدخل في طبيعة الإنسان، وتحول الطاقة النووية إلى أسلحة مدمرة."},
{k:"open",q:"حدد من النص علاقة سبب بنتيجة.",a:"مثل قول النص: «التقنيات الطبية الحديثة أنقذت ملايين الأرواح» (نتيجة لتقدم العلم)، أو في النص المتحرر: «فالعلم الذي ينفصل عن القيم قد يتحول إلى أداة للإضرار بالمجتمعات» (سبب ونتيجة)."}]},
{t:"نشاط ٣ (نص متحرر)",ref:"اقرأ النص المتحرر الوارد في الكتاب (شهد العالم في السنوات الأخيرة تطورًا علميًّا متلاحقًا…)، ثم أجب:",qs:[
{k:"mcq",q:"المقصود بكلمة «المنجزات» في قول الكاتب: «كيفية استخدام المنجزات العلمية»:",o:["الأهداف والغايات.","الموارد والإمكانات.","القوانين والتشريعات.","الإنجازات والابتكارات."],a:3,e:"المنجزات = الإنجازات والابتكارات العلمية."},
{k:"open",q:"حدد الفكرة الرئيسة التي يدور حولها النص السابق.",a:"ضرورة اقتران العلم والتقدم التقني بالضمير الإنساني والأخلاق، وعدم الاكتفاء بالقانون وحده لحماية حقوق الإنسان وكرامته."},
{k:"open",q:"حدد زاوية الرؤية التي ينظر منها الكاتب إلى الموضوع، مستدلًّا بما ورد في النص.",a:"ينظر الكاتب من زاوية أخلاقية اجتماعية تحذّر من خطورة انفصال العلم عن القيم؛ والدليل قوله: «فالعلم الذي ينفصل عن القيم قد يتحول إلى أداة للإضرار بالمجتمعات بدلًا من خدمتها»."},
{k:"mcq",q:"نوع الخطاب الذي ينتمي إليه النص السابق:",o:["الأدبي.","العلمي.","الحجاجي.","السردي."],a:2,e:"النص يعرض قضية ويدعمها بالحجج والأدلة، فهو خطاب حجاجي."}]}
];
const HW1=[
{t:"نشاط ١",ref:"من نص (العلم بين القانون والضمير) اقرأ الفقرة من «يرى بعضهم أن القانون كاف…» إلى «…قبل أن يتحول إلى مخالفة أو كارثة»، ثم أجب:",qs:[
{k:"mcq",q:"المعنى الدقيق لكلمة «رادعة» بحسب سياقها في الفقرة:",o:["قوية مانعة من الفعل قبل التفكير فيه.","زاجرة تمنع من العودة إلى ارتكاب المخالفة.","مؤلمة بدنيًّا ومؤذية ماديًّا لمستحقها.","مصلحة تهدف إلى تقويم سلوك المتجاوزين."],a:0,e:"«رادعة» هنا أي قوية مانعة من الفعل قبل التفكير فيه."},
{k:"mcq",q:"دلالة كلمة «يبرز» بحسب سياقها الوارد في الفقرة:",o:["ينفصل ويخرج عن الإطار القانوني العام.","يتفوق ويصبح أعلى شأنًا من غيره.","يتأكد وتتضح قيمته الملحة والفارقة.","يظهر للعيان بعد خفاء طال أمده."],a:2,e:"«يبرز» أي تتأكد وتتضح قيمته الملحة والفارقة."}]},
{t:"نشاط ٢",ref:"أجب عما يأتي:",qs:[
{k:"open",q:"ما الحجة الأساسية التي يدافع بها الكاتب عن رأيه في النص؟",a:"أن العلاقة بين القانون والضمير علاقة تكامل لا تعارض؛ إذ يضع القانون الحد الأدنى، بينما يدفع الضمير الإنسان إلى ما هو أسمى من مجرد الالتزام الشكلي."},
{k:"open",q:"استخرج من النص ما يدل على ارتباطه بالواقع المعاصر.",a:"الإشارة إلى التطبيقات الحديثة مثل التقنيات الطبية، والطاقة النووية، والذكاء الاصطناعي."}]},
{t:"نشاط ٣",ref:"لخّص النص:",qs:[
{k:"open",q:"اكتب ملخصًا في (٨ - ١٠) أسطر يعبر عن الفكرة الرئيسة لنص (العلم بين القانون والضمير) موظفًا الأفكار الداعمة للفكرة الرئيسة.",a:"يوضح النص أن الاكتشافات العلمية قدمت للبشرية منافع جليلة في مجالات الطب والطاقة والذكاء الاصطناعي، غير أنها كشفت في المقابل وجهًا خطيرًا يتمثل في الهندسة الوراثية والأسلحة المدمرة. ومن هنا تبرز الحاجة الملحة للضمير الإنساني بجانب القانون، لأن القانون يضع حدًّا أدنى ملزمًا، بينما الضمير يمنع الانحراف الأخلاقي؛ فالعلم بلا أخلاق يتحول إلى أداة دمار، والعلم المقترن بالقيم هو ضمانة لتقدم المجتمع وازدهاره."}]}
];
const M=(q,o,a,e)=>({k:"mcq",q,o,a,e}),O=(q,a)=>({k:"open",q,a});
const R1="اقرأ ثم أجب — من نص (العلم بين القانون والضمير): «لقد قدمت الاكتشافات العلمية للبشرية منافع عظيمة؛ فالتقنيات الطبية الحديثة أنقذت ملايين الأرواح، والطاقة النووية وفرت مصادر ضخمة للكهرباء، والذكاء الاصطناعي سهّل العمل في مجالات متعددة كالتعليم والصناعة والطب. غير أن هذه الإنجازات نفسها كشفت وجهًا آخر للقوة العلمية؛ فالهندسة الوراثية أثارت جدلًا حول حدود التدخل في طبيعة الإنسان، والطاقة النووية تحولت في لحظة تاريخية إلى سلاح مدمر، والأنظمة الذكية أثارت تساؤلات حول مفهوم الخصوصية والمسئولية عند وقوع الخطأ.»";
const AA={t:"السؤال الأول",ref:R1,qs:[
M("المعنى السياقي لكلمة (جدلًا):",["غضبًا","نقاشًا","رفضًا","يأسًا"],1,"«جدلًا» هنا بمعنى نقاشًا."),
M("إستراتيجية الإقناع المستخدمة في النص هي:",["الأمثلة الواقعية.","الاستدلال التاريخي.","السؤال الجوهري.","الأرقام والإحصائيات."],0,"اعتمد النص على أمثلة واقعية: التقنيات الطبية، الطاقة النووية، الذكاء الاصطناعي."),
O("هات من النص ما يدل على ارتباطه بالواقع المعاصر.","الإشارة إلى الذكاء الاصطناعي، والهندسة الوراثية، والطاقة النووية.")]};
const FK3=[
{t:"المجموعة (أ)",acts:[AA,
{t:"السؤال الثاني (نص متحرر)",ref:"«شهد التاريخ الإنساني لحظات فارقة تحول فيها العلم من خادم للبشرية إلى تهديد لوجودها؛ فقد نجح العلماء في شق الذرة بفيزياء مجردة ابتغاء المعرفة، لكن النتائج تجسدت عمليًّا في دمار هيروشيما وناجازاكي. ولم تتوقف الفاجعة عند الفيزياء، بل امتدت إلى أبحاث الهندسة الوراثية التي شهدت ممارسات غير أخلاقية على البشر خلال الحروب. إن المحطات التاريخية تثبت أن العقل العلمي إذا تجرد من الضمير الأخلاقي، انقلب الإنجاز إلى مأساة حقيقية. بل إن التغاضي عن البعد الأخلاقي مبكرًا يجعل علاج آثاره لاحقًا أمرًا مستحيلًا.»",qs:[
O("أكمل: الفكرة الرئيسة للنص: ................ والأفكار الداعمة: .......... و ..........","الفكرة الرئيسة: خطورة تجرد العلم عن الضمير الأخلاقي وأثره المدمر على البشرية.\nالأفكار الداعمة: أمثلة شق الذرة وهيروشيما، وممارسات الهندسة الوراثية غير الأخلاقية."),
M("نوع الخطاب الذي استخدمه الكاتب:",["وصفي","تاريخي","حجاجي","سردي"],2,"النص يعرض موقفًا ويدعمه بالأدلة والحجج."),
O("استخرج من النص الحجة الأساسية التي بنى عليها الكاتب موقفه.","«إن المحطات التاريخية تثبت أن العقل العلمي إذا تجرد من الضمير الأخلاقي، انقلب الإنجاز إلى مأساة حقيقية.»"),
O("استخرج الأسماء الخمسة من الجمل التالية، ثم أعربها:\nأ- إنّ أخاك ذو خلقٍ حسن.\nب- سافرتُ مع أخيك إلى المدينة.\nج- كان حموك رجلًا كريمًا.","أ) أخاك: اسم إنّ منصوب وعلامة نصبه الألف. ذو: خبر إنّ مرفوع وعلامة رفعه الواو.\nب) أخيك: اسم مجرور بـ«مع» وعلامة جره الياء.\nج) حموك: اسم كان مرفوع وعلامة رفعه الواو."),
M("اختر الصيغة الصحيحة: ألقى (ذو – ذا – ذي) المروءة التحية على الحضور.",["ذو","ذا","ذي"],0,"«ذو» فاعل مرفوع وعلامة رفعه الواو."),
M("اختر الصيغة الصحيحة: مررت بـ (ذو – ذا – ذي) العلم لأستفيد منه.",["ذو","ذا","ذي"],2,"«ذي» اسم مجرور بالباء وعلامة جره الياء.")]},
{t:"السؤال الثالث (الكتابة)",ref:"تخيّل أنك تجري مقابلة قصيرة مع مؤرخ حول «أهمية الحفاظ على الهوية الثقافية في عصر العولمة». اكتب: أ- تمهيدًا قصيرًا (سطرين). ب- سؤالين يكشفان موقفه الفكري. ج- جملة ختامية.",qs:[
O("اكتب المقابلة المطلوبة.","التمهيد: في عصر العولمة تبرز الهوية كحصن للشعوب.\nالسؤالان: ١. كيف تقيمون تأثير العولمة على هويتنا؟ ٢. ما السبيل للتفاعل مع العصر دون ذوبان؟\nالختامية: التمسك بالتراث هو ضمان بقاء الأمم.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"السؤال الأول",ref:"من نص (العلم بين القانون والضمير): «إن العلاقة بين القانون والضمير علاقة تكامل لا تعارض؛ فالقانون يحدد الحد الأدنى الملزم للجميع، أما الضمير فيدفع الإنسان إلى ما هو أسمى من مجرد الالتزام الشكلي. فالباحث الذي يمتلك ضميرًا حيًّا لن ينتظر نصًّا قانونيًّا ليمنعه من تزوير النتائج، والمؤسسة التي تؤمن بالمسئولية لن تبحث عن ثغرة قانونية لتبرير سلوك يضر بالمجتمع.»",qs:[

O("حدد إستراتيجية الإقناع المستخدمة في النص.","الاستدلال المنطقي والتعليل."),
O("دلل من النص على طبيعة العلاقة بين القانون والضمير.","«فالقانون يحدد الحد الأدنى الملزم للجميع، أما الضمير فيدفع الإنسان إلى ما هو أسمى من مجرد الالتزام الشكلي».")]},
{t:"السؤال الثاني (نص متحرر)",ref:"«تكمن الخطورة الحقيقية للتطور العلمي في تحوله من وسيلة لخدمة الإنسان إلى غاية تهدد وجوده؛ حيث تبرهن استجابة البيئة السريعة للكوارث المناخية على أن استنزاف الطبيعة باسم التفكير المستنير ليس سوى تدمير غير مباشر للإنسان، ويحذر هذا المسار المنحرف من سعي البشرية المحموم وراء رفاهية مادية عابرة تكبدها أثمانًا بيئية ونفسية فادحة تهدد حياتها. وفي الوقت الذي تشيّد فيه التكنولوجيا مدنًا أشد ذكاءً وأكثر اتصالًا، يصير قاطنوها أكثر عزلة وأقل توازنًا؛ إذ كلما اتسعت آفاق السيطرة على العالم الخارجي، تضاءلت قدرة الإنسان على حماية عالمه الداخلي.»",qs:[
M("المعنى السياقي لكلمة «فادحة»:",["شديدة","واسعة","بعيدة","غريبة"],0,"«فادحة» أي شديدة."),
M("القيمة المعنوية لكلمة «المحموم» في جملة «سعي البشرية المحموم»:",["تؤكد شدة التهور وفقدان السيطرة.","تبرز التساهل وضعف العزيمة.","توضح تأصل الجهل بالخطر.","تبين شدة الجشع والطمع المفرط."],0,"«المحموم» يوحي بالاندفاع المفرط الذي يفقد صاحبه السيطرة."),
O("ما الحجة الأساسية التي استخدمها الكاتب لإقناع القارئ بفكرته؟","تداعيات الكوارث المناخية والأثمان البيئية والنفسية الفادحة نتيجة السعي وراء الرفاهية المادية العابرة."),
O("استخرج الأسماء الخمسة من الجمل التالية، ثم أعربها:\nأ- لعل أباك يعود سريعًا.\nب- نظّف فاك بالسواك.\nج- ذهبت مع حميك في جولة.","أ) أباك: اسم لعلّ منصوب وعلامة نصبه الألف.\nب) فاك: مفعول به منصوب وعلامة نصبه الألف.\nج) حميك: اسم مجرور بـ«مع» وعلامة جره الياء."),

M("اختر الصيغة الصحيحة: سلّمت على (ذو – ذا – ذي) الأخلاق العالية.",["ذو","ذا","ذي"],2,"«ذي» اسم مجرور بـ«على» وعلامة جره الياء.")]},
{t:"السؤال الثالث (الكتابة)",ref:"اكتب فقرة نقدية عن التوظيف السيئ للعلم وأثره على تهديد السلام العالمي في حدود (ثمانية إلى عشرة) أسطر تتناول فيها: ١) جملة افتتاحية تقدم النص وفكرته. ٢) تحليلًا موجزًا لطريقة العرض (تعريف – أمثلة – صور – تقرير ختامي). ٣) جملة ختامية واضحة.",qs:[
O("اكتب الفقرة النقدية.","يمثل العلم سلاحاً ذا حدين، فبقدر فوائده يهدد السلام بأسلحة الدمار. يبدأ المقال بتعريف خطورة الانحراف العلمي، ثم تقديم أمثلة على سباق التسلح، وينتهي بتقرير ختامي يؤكد أهمية الرقابة الأخلاقية الدولية.")]}]},

O("هات معنى كلمة (أثارت) في جملة من إنشائك.","المعنى: حرّكت وفتحت باب النقاش.\nالجملة: أثارت الهندسة الوراثية جدلًا واسعًا."),
M("الفكرة الرئيسة التي يدور حولها النص:",["أهمية بناء المدن الذكية لزيادة التواصل.","التبعات السلبية للاندفاع العلمي والتكنولوجي غير المحسوب.","كيفية السيطرة الكاملة بالعلم على البيئة والعالم الخارجي.","طرائق الوقاية من الكوارث المناخية المتوقعة."],1,"الفكرة الرئيسة: التبعات السلبية للاندفاع العلمي والتكنولوجي غير المحسوب."),
O("من أي زاوية ينظر الكاتب إلى موضوع العلم؟","زاوية نقدية تحذر من مخاطر انفصال التقدم العلمي عن الضوابط الأخلاقية.")]},
{t:"السؤال الثاني (نص متحرر)",ref:"«السر الحقيقي في نبل التطور العلمي يكمن في تسخير اكتشافاته لخدمة الإنسان والارتقاء بجوهره، لا في تحقيق مكاسب مادية مجردة. ولعل التاريخ خير شاهد على أن العلم حين يقترن بالقيم الأخلاقية، يتحول إلى قوة بناء تحمي البشرية من الأوبئة وتنتشلها من ظلمات الجهل إلى نور المعرفة. وفي المقابل، فإن العصور التي شهدت تجرد البحث العلمي من الضوابط الأخلاقية تحولت فيها المنجزات إلى أدوات للدمار والسيطرة. إن النظرة الشاملة لمسيرة الحضارة تبين أن قيمة العلم لا تقاس بما يبتكره من أدوات، بل بما يحققه من أمان واستقرار للإنسان.»",qs:[
M("المعنى السياقي لكلمة «جوهره» في بداية النص:",["أصله وحقيقته.","قيمته ومنزلته.","طبيعته وخصائصه.","ثروته ونفائسه."],0,"«جوهره» أي أصله وحقيقته."),
M("ميّز الفكرة الرئيسة التي يدور حولها النص:",["تأثير العلم المقترن بالأخلاق في تحقيق خير البشرية.","كيفية الاستفادة من التطور التكنولوجي في إدارة الثروات.","السيطرة الكاملة على الطبيعة عبر الاكتشافات العلمية.","أسباب انتشار الأوبئة والأمراض في العصور القديمة."],0,"النص يربط قيمة العلم باقترانه بالأخلاق وخدمته للإنسان."),
O("من أي زاوية ينظر الكاتب إلى موضوع العلم؟","زاوية ترتبط فيها قيمة العلم بما يحققه من أمان واستقرار للإنسان."),
O("استخرج الأسماء الخمسة من الجمل التالية، ثم أعربها:\nأ- إنّ أخاك محبوب.\nب- لا تقل بفيك غير الحق.\nج- أخوك عضدك ونصرك.","أ) أخاك: اسم إنّ منصوب وعلامة نصبه الألف.\nب) فيك: اسم مجرور بالباء وعلامة جره الياء.\nج) أخوك: مبتدأ مرفوع وعلامة رفعه الواو."),
M("اختر الصيغة الصحيحة: أصبح (أبوك – أباك – أبيك) ذا مكانة مرموقة.",["أبوك","أباك","أبيك"],0,"«أبوك» اسم أصبح مرفوع وعلامة رفعه الواو."),
M("اختر الصيغة الصحيحة: استمع إلى نصيحة (ذو – ذا – ذي) الخبرة.",["ذو","ذا","ذي"],2,"«ذي» مضاف إليه مجرور وعلامة جره الياء.")]},
{t:"السؤال الثالث (الكتابة)",ref:"اكتب فقرة نقدية عن مخاطر التطور العلمي على البشرية في حدود (ثمانية إلى عشرة) أسطر تتناول فيها: ١) جملة افتتاحية تقدم فكرة النص. ٢) تحليلًا موجزًا لطريقة العرض (تعريف – أمثلة – صور – تقرير ختامي). ٣) جملة ختامية واضحة.",qs:[
O("اكتب الفقرة النقدية.","يشهد العصر تطوراً علمياً قد ينقلب لكارثة إن خلا من القيم الأخلاقية. ومثال ذلك قصف هيروشيما وتجارب الهندسة الوراثية، وخاتمة القول إن حماية البشرية تستوجب توجيه المعرفة نحو البناء والتعمير.")]}]}
];
const PG="من نص (الخلق جوهر الفضيلة): «وجملة القول أن الخلق الفاضل هو أداء الواجب لذاته، بقطع النظر عما يترتب عليه من النتائج. فمن أراد أن يعلّم الناس مكارم الأخلاق، فليحيِ ضمائرهم، وليبثّ في نفوسهم الشعور بحب الفضيلة، والنفور من الرذيلة، وليعلمهم أن الفضيلة لا تدعى فضيلة إلا إذا كانت خالصة لوجه الله، لا طمعًا في ثواب، ولا خوفًا من عقاب، ولا رغبة في محمدة، ولا رهبة من مذمة.»";
const W2=[
{t:"حكايات الغريب – الخلق جوهر الفضيلة",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١ (حكايات الغريب)",ref:"من (من روائع الأدب: حكايات الغريب) اقرأ ثم أجب:",qs:[
O("«العاطفة والارتباط الإنساني بالأشياء يتفوقان على الحسابات الزمنية والتقاويم الرسمية». ناقش هذه العبارة مستدلًّا بطريقة احتفاظ أم عبد الرحمن بذكرى غياب ابنها في ذهنها، وبموقف موظفي اللجنة عند دخولهم بيته.","تتجلى العبارة بوضوح في تمسك أم عبد الرحمن بتفاصيل غياب ابنها وكأنه حدث بالأمس رغم مرور السنين الطويلة، وفي موقف موظفي اللجنة الذين غمرتهم مشاعر الخشوع والرهبة والاحترام الوجداني عند دخولهم بيته، متجاوزين الحسابات البيروقراطية الرسمية أمام عظمة الذاكرة الإنسانية.")]},
{t:"نشاط ٢ (الخلق جوهر الفضيلة)",ref:"من نص (الخلق جوهر الفضيلة) اقرأ من «الخلق هو الدمعة التي تترقرق…» إلى «…أو العبث بكرامة قومه»، ثم أجب:",qs:[
M("استنتج المفهوم الدلالي لكلمة (يجترئ) وفق سياقها الوارد في السطر الأخير:",["يقوى ويشتد.","يظلم ويقسو.","يُقدم ويتجاسر.","يتكبر ويعلو."],2,"«يجترئ» أي يُقدم ويتجاسر."),
O("حدد زاوية رؤية الكاتب التي ظهرت في النص.","زاوية وجدانية إنسانية تربط الأخلاق بالمشاعر الشريفة والشهامة في مواجهة إهانة الوطن أو العبث بكرامة قومه.")]},
{t:"نشاط ٣ (استماع)",ref:"بعد الاستماع لنص: موقف معاصر (قرار في صمت)، أجب:",qs:[
O("خسر الطالب المركز الأول في المسابقة، لكنه «خرج مطمئنًّا». وضّح الفرق بين الفوز بالمركز والفوز بالطمأنينة النفسية.","الفوز بالمركز قد يكون شكليًّا أو مزيفًا إذا لم يُبنَ على النزاهة، أما الفوز بالطمأنينة النفسية فهو ثمرة الأمانة والضمير الحي والصدق مع النفس، وهو مكسب دائم لا يُقدّر بثمن.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١ (حكايات الغريب)",ref:"من (من روائع الأدب: حكايات الغريب) اقرأ ثم أجب:",qs:[
O("«قد تدفع الأزمات والحروب بعض الأشخاص العاديين إلى القيام بأدوار استثنائية دون تخطيط مسبق». في ضوء فهمك لشخصية عبد الرحمن السائق الذي تحول إلى مقاتل في موقعه، اكتب فقرة توضح فيها كيف يمكن للإنسان البسيط في مجتمعك الحالي أن يصبح بطلًا أثناء الأزمات المجتمعية (مثل الأوبئة أو الكوارث الطبيعية).","إجابة مقترحة: يمكن للإنسان البسيط أن يكون بطلًا حقيقيًّا من خلال التزامه بأداء واجبه بإخلاص، ومدّ يد العون للمحيطين به، ومواجهة الأزمات (كالظروف الصحية أو الصعاب الاقتصادية) بالصبر والتكافل الاجتماعي، دون انتظار لشهرة أو مقابل.")]},
{t:"نشاط ٢ (الخلق جوهر الفضيلة)",ref:"من نص (الخلق جوهر الفضيلة) اقرأ من «الخلق هو الدمعة التي تترقرق…» إلى «…أو العبث بكرامة قومه»، ثم أجب:",qs:[
M("ما المضاد الدقيق لكلمة (تترقرق) بحسب سياقها في الجملة الأولى؟",["تتوقف وتجف.","تنطفئ وتخمد.","تضعف وتذبل.","تضيق وتتضاءل."],0,"«تترقرق» أي تتحرك وتسيل بنعومة، فمضادها التوقف والجفاف."),
O("وضّح كيف تجلت العاطفة والنزعة الإنسانية في النص.","تجلت في ربط الأخلاق بمشاعر الرحمة والشفقة والإحساس بآلام الآخرين وكرامتهم."),
O("قال أحمد شوقي: «وإنما الأمم الأخلاق ما بقيت … فإن همو ذهبت أخلاقهم ذهبوا». قارن بين موقف الشاعر أحمد شوقي وموقف المنفلوطي من حيث أثر غياب الضمير والأخلاق في أفراد المجتمع.","كلاهما متفق على أن الأخلاق أساس بقاء الأمم وهلاكها بغيابها؛ فالمنفلوطي يركز على الجانب الوجداني الداخلي للضمير والأخلاق، بينما يربط أحمد شوقي بقاء الأمم بوجود الأخلاق، فإذا ذهبت أخلاقهم ذهبوا.")]},
{t:"نشاط ٣ (استماع)",ref:"بعد الاستماع لنص: موقف معاصر (قرار في صمت)، أجب:",qs:[
O("كيف أثبت هذا النص أن خسارة مسابقة بأمانة قد تكون بداية لنجاح أكبر في الحياة العملية؟","لأن الالتزام بالأمانة يبني شخصية صلبة تحظى باحترام الذات والآخرين، وتؤسس لنجاحات مستقبلية مستدامة تقوم على الثقة الحقيقية."),
O("لو كنت مكان الطالب هل ستتخذ القرار نفسه؟ ولماذا؟","إجابة مفتوحة تترك للطالب، مع تعليل رأيه (مثال: نعم؛ لأن الأمانة مكسب دائم أهم من المركز).")]}]}]},
{t:"الخلق جوهر الفضيلة – هيا نتحدث ونكتب",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١",ref:"من نص (الخلق جوهر الفضيلة) اقرأ من «لا ينفع المرء أن يكون زاجره…» إلى «…في طريق حياته»، ثم أجب:",qs:[
O("ما الذي يراه الكاتب رادعًا حقيقيًّا للإنسان عن فعل الشر؟ وضّح ذلك في ضوء فهمك للفقرة.","الرادع الحقيقي هو الضمير الذي يشعر الإنسان بالواجب، وليس الخوف من سجن القانون أو عيون الرقباء؛ فمن لا يزجره ضميره لا تنفعه المخاوف الخارجية."),
O("ما الدلالة الضمنية التي تتكرر في النص بشأن العلاقة بين صاحب الخلق الصادق ومحيطه الخارجي؟","أن صاحب الخلق الصادق يؤدي واجبه لذاته ولفضيلته، بغض النظر عن رضا الناس أو نظرة المجتمع؛ فالأخلاق مبدأ نابع من الداخل لا يتأثر بالخارج."),
O("هل النص أقرب إلى بناء حجة عقلية قائمة على المنطق، أم إلى بناء تأثير وجداني عاطفي يعتمد على المشاعر؟ ولماذا؟","النص أقرب إلى البناء الوجداني العاطفي الذي يعتمد على المشاعر؛ لأنه يخاطب القلوب والوجدان بأسلوب أدبي تصويري مؤثر يحرك المشاعر نحو حب الفضيلة وبغض الرذيلة.")]},
{t:"نشاط ٢ (تحدّث)",ref:"تحدّث لمدة دقيقتين حول العبارة الآتية: «تتحقق الأمانة العلمية والأخلاقية عندما يختار الإنسان التصحيح المؤلم على النجاح الزائف».",qs:[
O("مع مراعاة الآتي:\n١. تبيّن مفهوم «الأمانة العلمية» بأسلوبك الخاص خلال جملة افتتاحية.\n٢. تستشهد بموقف من واقع الحياة الدراسية.\n٣. تقترح خطوة عملية واحدة يمكن اتخاذها للثبات على المبدأ أثناء الضغوط.\n٤. تختم بنصيحة موجهة لزملائك.","١. «الأمانة العلمية هي التزام الصدق والأمانة في نقل المعلومات، ونسب الفضل لأهله، والبعد عن الغش والتزييف مهما كانت الإغراءات.»\n٢. «مثل الطالب الذي يرفض الغش أو نقل الأبحاث الجاهزة، ويختار إعلان جهده الحقيقي والرضا بنتيجة عادلة وإن كانت أقل، شجاعةً منه في مواجهة الحقيقة.»\n٣. «استحضار مراقبة الله عز وجل باستمرار، والاعتزاز بالشرف والكرامة الذاتية مهما كانت شدة الضغوط والظروف المحيطة.»\n٤. «أنصح زملائي دائماً بأن النجاح الحقيقي هو الذي يُبنى على عرق الجهد والصدق، وأن الزيف مهما طال أمده مصيره الزوال.»")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"من نص (الخلق جوهر الفضيلة) اقرأ من «الخلق هو الدمعة التي تترقرق…» إلى «…أو العبث بكرامة قومه»، ثم أجب:",qs:[
M("المفهوم الدلالي لكلمة (يتصبب) وفق سياقها في النص:",["ينبع ويسيل بكثرة.","يتلون ويلمع.","يتغير لونه.","يكدّ ويتعب."],0,"«يتصبب» أي ينبع ويسيل بكثرة."),
O("حلّل الصورة الآتية: «الخلق هو الصرخة التي يطلقها الشجاع»، مبينًا ما توحي به كلمة (الصرخة) في هذا السياق.","شبّه الكاتب الخلق بالصرخة التي يطلقها الشجاع (تشبيه بليغ)، وهي صورة توحي بالقوة والثبات والرفض القاطع للظلم والشر، والدفاع المستميت عن الحق والفضيلة في وجه الرذيلة.")]},
{t:"نشاط ٢ (مقال)",ref:"اكتب مقالًا في حدود (ثمانية إلى عشرة) أسطر تقارن فيه بين «من يلتزم بالأخلاق أمام الناس فقط» ومن «يلتزم بها في السر والعلن»، مراعيًا عناصره: (المقدمة – العرض – الخاتمة).",qs:[
O("اكتب المقال.","المقدمة: الأخلاق هي الأساس القويم لبناء الأمم وقياس إنسانية الأفراد وارتقائهم.\nالعرض: شتان بين من يتخلق بالأخلاق تمثيلاً أمام الناس ورياءً لمدحهم، وبين من يلتزم بها في السر والعلن مراقبةً لله واستجابة لضميره الحي. فالأول صاحب وجه مزيف تسقط أوراقه عند غياب الرقيب البشري، بينما الثاني حر كريم يستوي عنده حضور الناس وغيابهم لأنه يرى الفضيلة غاية في حد ذاتها.\nالخاتمة: لذا فلنحرص على طهارة السرائر، فالإنسان الحقيقي هو من يراقب ربه وخلقه حتى في أشد خلواته بعيداً عن أين كان.")]}]}]},

{t:"المجموعة (أ)",acts:[
{t:"السؤال الأول",ref:PG,qs:[
M("المفهوم الدلالي لـ (جملة القول) وفق سياقها في بداية الفقرة:",["بداية وتفصيل الكلام.","خلاصة وزبدة الحديث.","اعتراض وجدال منطقي.","شك واحتمال في الحكم."],1,"«جملة القول» أي خلاصة الحديث وزبدته."),
M("المفهوم الدلالي لكلمة (محمدة) وفق سياقها في الفقرة:",["كسب مالي وفير.","ثناء ومديح من الناس.","شهرة واسعة ومكانة.","نفوذ وسلطة قوية."],1,"«محمدة» أي ثناء ومديح من الناس."),
O("بيّن دلالة العبارة الآتية: «فليحيِ ضمائرهم، وليبثّ في نفوسهم الشعور بحب الفضيلة»، موضحًا نوع الأسلوب الإنشائي المستخدم.","الدلالة: وجوب إيقاظ الوجدان الداخلي وبناء الرقابة الذاتية كأساس حقيقي للأخلاق.\nالأسلوب الإنشائي: أمر (فليحيِ، وليبثّ) غرضه النصح والحث والوجوب.")]},
{t:"السؤال الثاني",ref:"«الضمير الحي وليس الخوف من القانون هو الركيزة الأساسية لاستقامة المجتمعات، وبدونه تصبح الفضيلة مجرد تصنّع ظاهر». اكتب فقرة نقدية (من ٤ إلى ٥ أسطر) تبيّن فيها صحة هذه المقولة، مستخدمًا أدوات الربط، مثل: (ويتأكد ذلك – ومن ثمّ…).",qs:[
O("اكتب الفقرة النقدية.","إن القانون وحده يضبط السلوك الخارجي شكلياً، ويتأكد ذلك عندما نرى التجاوزات تحدث فور غياب الرقيب القانوني. ومن ثم فإن الرقيب الحقيقي والأبدي هو الضمير الحي الذي يجعل الفرد يلتزم بالفضيلة طواعية، ودونه تصبح الأخلاق مجرد مظهر زائف يزول بزوال المانع.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"السؤال الأول",ref:PG,qs:[
M("المفهوم الدلالي لكلمة (مذمة) وفق سياقها في الفقرة:",["عيب مادي في السلوك.","لوم وعتاب وتقبيح من الآخرين.","عقوبة جسدية صارمة.","خسارة ونقص في الكسب."],1,"«مذمة» أي لوم وعتاب وتقبيح من الآخرين."),
M("المفهوم الدلالي لـ (بقطع النظر):",["بتمعن وتدقيق شديد.","بصرف النظر وتجاوز الأمر.","بالاعتماد والتركيز التام.","بالرفض القاطع للمستقبل."],1,"«بقطع النظر» أي بصرف النظر وتجاوز الأمر."),
O("حدد التقابل في قول الكاتب: «لا طمعًا في ثواب، ولا خوفًا من عقاب، ولا رغبة في محمدة، ولا رهبة من مذمة»، ثم وضّح أثره في تأكيد أن الخلق لا يرتبط بالثواب.","التقابل يتمثل في مقابلة الدوافع والمكاسب المادية أو المعنوية الخارجية (الثواب، العقاب، المحمدة، المذمة) بالإخلاص المطلق للواجب لذاته. وأثره: توكيد المعنى وقوته في إثبات أن الخلق الخالص لا يرتبط بغاية نفعية خارجية.")]},
{t:"السؤال الثاني",ref:"«الدفاع عن كرامة الوطن ليس شعارًا يُقال، بل هو المظهر الأعلى للخلق الفاضل، وبدونه تسقط كل ادعاءات الفضيلة». اكتب فقرة نقدية (من ٤ إلى ٥ أسطر) تبيّن فيها صحة هذه المقولة، مستخدمًا أدوات الربط: (ويتأكد ذلك – ومن ثمّ).",qs:[
O("اكتب الفقرة النقدية.","إن الدفاع عن كرامة الوطن هو التجسيد الأعلى للخلق الفاضل، ويتأكد ذلك من خلال بطولات التضحية والفداء التي يقدمها الأبناء لأوطانهم. ومن ثم فإن أي ادعاء للأخلاق ينفصل عن حب الوطن والذود عنه هو ادعاء فارغ وزائف.")]}]},
{t:"المجموعة (ج)",acts:[
{t:"السؤال الأول",ref:PG,qs:[
M("المفهوم الدلالي لكلمة (ليبثّ) وفق سياقها في الفقرة:",["ليتأكد ويتبين ويحقق.","لينشر ويشيع.","ليقسم ويوزع بالتساوي.","ليراقب وينظر بدقة."],1,"«ليبثّ» أي لينشر ويشيع."),
M("المفهوم الدلالي لـ (لا تدعى) وفق سياقها في الفقرة:",["لا تطلب ولا تبتغى.","لا تسمى ولا توصف.","لا تظلم ولا تقهر.","لا تترك ولا تهمل."],1,"«لا تدعى» أي لا تسمى ولا توصف."),
O("يغلب على مطلع النص الأسلوب الخبري. بيّن كيف ساعد هذا الأسلوب في تثبيت القيمة الأخلاقية كحقيقة مسلّم بها؟","لأن الأسلوب الخبري يفيد التقرير والتوكيد، ويقدم الحقائق الأخلاقية باعتبارها ثوابت واقعية راسخة لا تقبل الشك.")]},
{t:"السؤال الثاني",ref:"«التربية الأخلاقية الحقيقية هي التي تبني رقابة داخلية في النفس تجعل الفرد يأنف من الدنايا دون حاجة لسلطة خارجية». اكتب فقرة نقدية (من ٤ إلى ٥ أسطر) تبيّن فيها صحة هذه المقولة، مستخدمًا أدوات الربط، مثل: (ويتأكد ذلك – ومن ثمّ…).",qs:[
O("اكتب الفقرة النقدية.","تتجسد روعة التربية الأخلاقية الحقيقية في قدرتها على بناء ضمير حي وراصد داخلي يوجه سلوك الإنسان نحو الفضيلة بنقاء ذاتي. وَيَتَأَكَّدُ ذَلِكَ من خلال كون الوازع الداخلي أكثر فاعلية واستدامة في ردع النفوس عن ارتكاب الرذائل مقارنة بالقوانين الخارجية التي قد يُحتال عليها. وَمِنْ ثَمَّ فإن الاعتماد على الرقابة الذاتية يصنع إنساناً متزناً يأنف من الدنايا بإرادته الحرة، مما يحقق مجتمعاً فاضلاً تسوده الأخلاق أصالة لا خوفاً من العقاب فحسب.")]}]}]}
];
const V1="«كَفَى بِالعِلْمِ فِي الظُّلُمَاتِ نُورًا ... يُبَيِّنُ فِي الحَيَاةِ لَنَا الأُمُورَا\nفَكَمْ وَجَدَ الذَّلِيلُ بِهِ اعْتِزَازًا ... وَكَمْ لَبِسَ الحَزِينُ بِهِ سُرُورَا\nتَزِيدُ بِهِ العُقُولُ هُدًى وَرُشْدًا ... وَتَسْتَعْلِي النُّفُوسُ بِهِ شُعُورَا»";
const V2="«وَلَكِنْ لَيْسَ مُنْتَفِعًا بِعِلْمٍ ... فَتًى لَمْ يُحْرِزِ الخُلُقَ النَّضِرَا\nفَإِنَّ عِمَادَ بَيْتِ المَجْدِ خُلْقٌ ... حَكَى فِي أَنْفِ نَاشِقِهِ العَبِيرَا\nفَلاَ تَسْتَنْفِعُوا التَّعْلِيمَ إِلاَّ ... إِذَا هَذَّبْتُمُ الطَّبْعَ الشِّرِّيرَا»";
const V3="«فَلاَ تَسْتَنْفِعُوا التَّعْلِيمَ إِلاَّ ... إِذَا هَذَّبْتُمُ الطَّبْعَ الشِّرِّيرَا\nإِذَا مَا العِلْمُ لَابَسَ حُسْنَ خُلْقٍ ... فَرَجِّ لِأَهْلِهِ خَيْرًا كَثِيرَا\nوَمَا إِنْ فَازَ أَغْزَرُنَا عُلُومًا ... وَلَكِنْ فَازَ أَسْلَمُنَا ضَمِيرَا»";
const W3=[
{t:"هيا نوظف لغتنا الجميلة",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١",ref:"صوّب الخطأ النحوي فيما يأتي مع التعليل:",qs:[
O("أ- «حضر أبا الباحث إلى المؤتمر».\nب- «استمعت إلى أخو الطالب».\nج- «مررت بذو خلق كريم».","أ) أبو الباحث؛ لأنه فاعل مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة.\nب) أخي الطالب؛ لأنه اسم مجرور وعلامة جره الياء لأنه من الأسماء الخمسة.\nج) بذي خلق كريم؛ لأنه اسم مجرور وعلامة جره الياء لأنه من الأسماء الخمسة."),
O("«كان ذو الخلق يحترم أباه، ويعطف على أخيه، فلا يسمع الناس من فيه إلا الحق». استخرج من العبارة السابقة اسمًا من الأسماء الخمسة مرفوعًا، وآخر منصوبًا، وثالثًا مجرورًا.","المرفوع: «ذو» اسم كان مرفوع بالواو.\nالمنصوب: «أباه» مفعول به منصوب بالألف لأنه من الأسماء الخمسة، والهاء مضاف إليه.\nالمجرور: «أخيه» و«فيه» مجروران بالياء."),
O("«يحترم المرء أخاه، ويستمع إلى نصح آبائه، ويعطف على ذي المسكنة».\nأ- لماذا استُثنيت كلمة (آبائه) من الإعراب بالحروف رغم اشتراكها في جذر الكلمة مع الأسماء الخمسة؟\nب- ما الشروط التي توفرت لكلمتي (أخاه وذي) لتعرب إعراب الأسماء الخمسة بالحروف؟","أ) لأنها جاءت بصيغة الجمع وليست مفردة.\nب) أن تكون مفردة، مكبّرة، مضافة لغير ياء المتكلم، وأن تكون (ذو) بمعنى صاحب.")]},
{t:"نشاط ٢",ref:"أجب عما يأتي:",qs:[
O("حدد نوع الأسلوب (خبري – إنشائي) والغرض منه في البيت الشعري الآتي:\nلا تظلمنَّ إذا ما كنتَ مقتدرًا ... فالظلمُ ترجعُ عقباه إلى الندمِ","إنشائي (نهي)، غرضه النصح والتحذير."),
O("ما الصورة البلاغية التي أراد الكاتب التعبير عنها في قوله: «الخلق هو الشعور بالمسئولية أمام الضمير…»؟ وبمَ توحي كلمة (الضمير)؟","تشبيه بليغ شبّه فيه الخلق بالشعور (بالمسئولية). وتوحي كلمة (الضمير) باليقظة الصارمة والنزاهة والعدالة الداخلية.")]},
{t:"نشاط ٣",ref:"صوّب الخطأ الإملائي في الجملة الآتية مع بيان السبب:",qs:[
O("(يتصبب العرق من الجبين حياءًا).","الصواب: «حياءً» بتنوين الفتح على الهمزة؛ لأن التنوين لا يُكتب ألفًا إذا كانت الهمزة مسبوقة بألف مد.")]},
{t:"نشاط ٤ (محاورة)",ref:"تخيّل أنك تحاور مفكرًا قانونيًّا واجتماعيًّا حول موضوع «الخلق جوهر الفضيلة». اكتب: ١) تمهيدًا قصيرًا (سطرين) تعبّر فيه بأسلوبك عن أهمية التوازن بين التشريعات والأخلاق. ٢) سؤالين يكشفان موقفك من عجز القوانين الوضعية عن ضبط النوايا الإنسانية. ٣) إجابة متخيلة تعكس رؤيتك حول كون الضمير هو الرقيب الحقيقي كما ورد في الدرس. ٤) جملة ختامية تلخص فكرتك.",qs:[
O("اكتب المحاورة.","التمهيد: إن التشريعات الوضعية وحدها تقف عاجزة أمام ضبط النوايا الخفية للإنسان ما لم يستند القانون إلى ضمير حي يقظ.\nالسؤالان: ١) لماذا تعجز القوانين الجافة أحيانًا عن منع الجرائم الأخلاقية الخفية؟ ٢) كيف يمثل الضمير الرقيب الحقيقي الذي يتجاوز حدود النصوص القانونية المكتوبة؟\nالإجابة المتخيلة: يرى المفكر أن الضمير هو أساس الفضيلة الحقيقية، وأن الإنسان بالضمير الحي يؤدي واجبه لذاته بغض النظر عن طمع في ثواب أو خوف من عقاب قانوني.\nالختام: هكذا يظل الخلق الإنساني الرفيع هو الجوهر الحقيقي الذي تحيا به الأمم وتستقيم به المجتمعات.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١",ref:"أجب عما يأتي:",qs:[
O("صوّب الخطأ النحوي في الجملة الآتية مع التعليل: «أباك رجل كريم يحب الخير».","التصويب: «أبوك رجل كريم يحب الخير»؛ لأن «أبوك» مبتدأ مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة، وليست الألف."),
O("«يكرم ذو الفضل حماه، ويستمع إلى نصيحة أخيه، فلا ينطق فوه إلا بالحق». استخرج: أ- اسمًا من الأسماء الخمسة مرفوعًا. ب- مضافًا إليه، وبيّن نوعه وعلامته الإعرابية.","أ) ذو: اسم مرفوع وعلامة رفعه الواو لأنه من الأسماء الخمسة.\nب) أخيه: مضاف إليه مجرور وعلامة جره الياء لأنه من الأسماء الخمسة.")]},
{t:"نشاط ٢",ref:"أجب عن السؤالين الآتيين:",qs:[
O("ما الغرض البلاغي من غلبة الأسلوب الخبري التقريري على نص (الخلق جوهر الفضيلة)؟","تقرير الحقائق الأخلاقية وتوكيدها، وتقديمها باعتبارها مسلّمات راسخة لا تقبل الشك."),
O("علّل: تكرار الكاتب لعبارة «الخلق هو…» في النص، مبينًا أثر ذلك في توضيح معنى الخلق وترسيخه.","التكرار يوضح معنى الخلق من جوانب متعددة (الدمعة، الصرخة، الشعور بالمسئولية)، ويؤكده ويرسخه في ذهن القارئ، ويمنح النص إيقاعًا مؤثرًا.")]},
{t:"نشاط ٣",ref:"بيّن سبب كتابة الهمزة والتاء بالصورة التي جاءت عليها في الكلمات الآتية: (سؤال – بئر – حكمة).",qs:[
O("علّل كتابة الكلمات الثلاث.","إجابة:\nسؤال: همزة متوسطة على الواو؛ لأنها مسبوقة بضم.\nبئر: همزة متوسطة على النبرة؛ لأنها ساكنة بعد كسرة.\nحكمة: تاء مربوطة؛ لأنها تُنطق هاء عند الوقف.")]},
{t:"نشاط ٤ (محاورة)",ref:"تخيّل أنك تحاور رئيس منظمة علمية عالمية حول عبارة: «المؤسسة التي تؤمن بالمسئولية لن تبحث عن ثغرة قانونية…». اكتب: ١) تمهيدًا قصيرًا (سطرين) تعرّف فيه مفهوم المؤسسة العلمية المسئولة بأسلوبك. ٢) سؤالين يكشف كل منهما موقفك من استغلال بعض الشركات للأبحاث العلمية لأغراض ربحية مادية. ٣) إجابة متخيلة. ٤) جملة ختامية تلخص فكرتك.",qs:[
O("اكتب المحاورة.","١. التمهيد: المؤسسة العلمية المسئولة هي التي تنطلق من إيمان أخلاقي عميق تجاه البشرية جمعاء، متجاوزة حدود استيفاء الشروط القانونية الشكلية.\n٢. السؤالان:\nس١: ما موقفكم من الشركات التي تستغل الأبحاث العلمية لأغراض ربحية مادية ضاربة بالقيم الإنسانية عرض الحائط؟\nس٢: كيف تضمنون التزام الباحثين بالمعايير الأخلاقية والبيئية الصارمة أثناء الابتكار؟\n٣. الإجابة المتخيلة: يؤكد رئيس المنظمة على وجوب تقديم المصلحة المجتمعية والأمان الأخلاقي على الأرباح المادية، وأن الضمير العلمي هو الصمام الحقيقي لسلامة البشرية.\n٤. الجملة الختامية: في النهاية، العلم الحقيقي هو الذي يخدم الإنسان ولا يتحول أبداً إلى أداة للدمار أو الاستغلال المدمّر.")]}]}]},
{t:"عودة الروح – العلم نور",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١ (عودة الروح)",ref:"من روائع الأدب (عودة الروح): اقرأ ثم أجب:",qs:[
O("«التحولات الكبرى والأمل في التغيير لا يبدآن دائمًا بصخب الخطب الكبيرة، بل ينبتان ببطء من داخل البيوت البسيطة». ناقش هذه الفكرة مستدلًّا بأحداث الرواية، وطبيعة حياة محسن وأسرته داخل بيتهم القديم قبل اندلاع الثورة وبعدها.","مفهوم الفكرة: تجسد رواية «عودة الروح» لتوفيق الحكيم أن التحولات الكبرى والأمل الحقيقي في التغيير لا يولد صاخبًا دائمًا، بل ينمو تدريجيًّا من أعماق الحياة اليومية البسيطة.\nحياة محسن وأسرته قبل الثورة: كانت حياتهم داخل البيت القديم يغلب عليها الروتين والأحلام الفردية، لكن تفاصيلها البسيطة كانت محضنًا هادئًا لتراكم المشاعر الوطنية والوعي الإنساني.\nنمو الأمل ببطء: تحولت جذور الوعي من مشاعر عفوية إلى نضج نفسي وروحي يربط هموم الفرد بهموم الوطن.\nبعد اندلاع الثورة: انفجرت المشاعر المتراكمة وتحولت إلى قوة جماعية مؤثرة، ليثبت الكاتب أن التغيير الحقيقي ينبت ببطء داخل وجدان الشعب وبيوته البسيطة.")]},
{t:"نشاط ٢ (العلم نور)",ref:"اقرأ من النص الشعري (العلم نور): «فَإِنَّ عِمَادَ بَيْتِ المَجْدِ خُلْقٌ ... حَكَى فِي أَنْفِ نَاشِقِهِ العَبِيرَا»، ثم أجب:",qs:[
M("ما المقصود بكلمة (العبير) بحسب ورودها في سياق البيت السابق؟",["الغبار الكثيف المنتشر.","الماء الصافي العذب.","النبات الأخضر الزاهر.","الطِّيب أو العطر الفوّاح."],3,"«العبير» هو الطيب أو العطر الفوّاح."),
M("الدلالة العميقة لقول الشاعر «فإن عماد بيت المجد خلق» هي:",["بناء البيوت يتطلب الأخلاق.","الأخلاق تمنع بناء البيوت.","المجد يتحقق بالعلم وحده.","الأخلاق هي أساس الرفعة."],3,"عماد البيت أساسه، فالأخلاق هي أساس الرفعة والمجد."),
O("استنتج معنى كلمة (عماد) من سياق البيت السابق، مبيّنًا الأدلة اللغوية التي ساعدتك على استنتاج هذا المعنى.","معنى (عماد): أساس وبنيان. والدليل اللغوي ارتباطها ببيت المجد ورفعته.")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط ١ (عودة الروح)",ref:"من روائع الأدب (عودة الروح): اقرأ ثم أجب:",qs:[
O("وازن بين رؤية المفتش الإنجليزي الذي تعجب من استسلام وخضوع المصريين، ورؤية عالم الآثار الفرنسي الذي شبه الشعب بتمثال حجري ينتظر عودة الروح، ثم بيّن حدود ومصداقية كل موقف في ضوء الهبّة الشعبية التي أعقبت نفي سعد زغلول.","رؤية المفتش الإنجليزي: نظرة سطحية ومؤقتة؛ فقد استغرب من الهدوء الظاهري والاستسلام الخضوعي الذي أظهره الشعب تحت وطأة الاحتلال، فاستنتج خطأً أن هذا الشعب قد استسلم تمامًا وفقد القدرة على المقاومة.\nرؤية عالم الآثار الفرنسي: نظرة عميقة واعية بطبيعة وحضارة التاريخ المصري القديم؛ فقد أدرك أن هذا الشعب ليس ميتًا ولا مستسلمًا، بل شبهه بـ«تمثال حجري» عظيم يكمن بداخله الجوهر والحياة، وهو فقط «ينتظر عودة الروح» لينبض من جديد.\nالحكم: أثبتت الهبّة الشعبية بعد نفي سعد زغلول صدق الرؤية الثانية وسطحية الأولى.")]},
{t:"نشاط ٢ (العلم نور)",ref:"اقرأ نص «العلم نور» كاملًا، ثم أجب:",qs:[
O("ما التحذير الذي يوجهه الشاعر في قوله: «فلا تستنفعوا التعليم إلا … إذا هذبتم الطبع الشريرا»؟","التحذير من خطورة العلم المجرد إذا لم يقترن بالأخلاق الحميدة وتهذيب النفس."),
O("ما البيت الذي يضع الشرط الأساسي لكي يتحول العلم إلى «فوز حقيقي»؟ ولماذا؟","هو البيت الذي يربط بين العلم وحسن الخلق («إذا ما العلم لابس حسن خلق…») أو البيت السابق له؛ لأنه يجعل الخلق شرط الانتفاع بالعلم."),
O("ماذا يقصد الشاعر بقوله «ولكن فاز أسلمنا ضميرًا» في البيت الأخير؟","يقصد أن الفوز والنجاح الحقيقي يكمن في سلامة الضمير ونقاء الأخلاق، وليس في كثرة العلوم المادية وحدها.")]}]}]},

{t:"المجموعة (أ)",acts:[
{t:"السؤال الأول (عودة الروح)",ref:"في ضوء فهمك لتحول شخصية الشاب محسن من الانعزال وأحلام الحب الشخصية إلى الانخراط في الانتماء إلى الأمة:",qs:[
O("اكتب فقرة من سطرين تعبّر فيها عن موقف مررت به أو شاهدته، شعر فيه أحد الشباب بقيمة «العمل الجماعي والتطوعي»، وكيف أسهم ذلك في صقل شخصيته وتجاوز أنانيته؟","«عندما شاركتُ مع مجموعة من زملائي في حملة تطوعية لخدمة وتجميل الحي، أدركتُ القيمة العظيمة للعمل الجماعي والتطوعي. فقد أسهم ذلك الموقف في صقل شخصيتي، وتخليصها من الأنانية الفردية، وتعزيز شعوري بالانتماء والمسؤولية تجاه المجتمع.»")]},
{t:"السؤال الثاني (العلم نور)",ref:"اقرأ الأبيات ثم أجب:\n"+V1.replace(/\\n/g,"\n"),qs:[
O("ما معنى كلمة «الأمور»؟ وما مضاد «تستعلي»؟","الأمور: الشؤون والحالات. مضاد «تستعلي»: تتذلل / تنخفض / تهبط."),
O("بيّن الشاعر الأثر الإيجابي للعلم على العقل. وضّح ذلك.","العلم يضيء ظلمات الجهل، ويهدي العقول ويرشدها، ويجلب السرور والاعتزاز للنفس."),
O("ما الدلالة الضمنية لقول الشاعر «تستعلي النفوس به شعورًا»؟","سمو النفس وارتفاع قدرها واعتزازها بفضل العلم والأخلاق معًا.")]},
{t:"السؤال الثالث (الكتابة)",ref:"اكتب فقرة من (٧ - ١٠) أسطر بعنوان «الذكاء الاصطناعي: فرصة للتطور أم تهديد للبشرية؟» مراعيًا في كتابتك ما يلي: تمهيدًا – تقديم مثال – خاتمة.",qs:[
O("اكتب الفقرة.","يمثل الذكاء الاصطناعي اليوم ثورة تقنية كبرى أحدثت نقلة نوعية في حياة البشر، إلا أنها تحمل في طياتها مخاوف جدية تهدد مستقبل الإبداع البشري. فمن ناحية، يسهم في تطوير مجالات الصحة والتعليم والصناعة بكفاءة مذهلة، ومن ناحية أخرى، يثير قضايا أخلاقية تتعلق بالبطالة الفكرية وفقدان السيطرة على الأنظمة الذكية المستقلة. ومثال ذلك استخدام الخوارزميات المتقدمة في توليد محتوى مزيف يؤثر على اتجاهات الرأي العام. لذلك، ينبغي على المجتمع الدولي إرساء ضوابط أخلاقية صارمة تضمن توجيه التقنية لخدمة الإنسان، ليبقى الذكاء البشري هو الموجه الأساسي للحضارة.")]}]},
{t:"المجموعة (ب)",acts:[
{t:"السؤال الأول (عودة الروح)",ref:"من روائع الأدب (عودة الروح): اقرأ ثم أجب:",qs:[
O("كيف تغيرت نظرة محسن إلى نفسه وإلى الناس مع تطور أحداث الرواية؟","انتقل من الانعزال الذاتي والاهتمام بالعواطف الفردية الضيقة إلى الانخراط الفعلي في هموم الأمة ومجتمعه، والشعور بقيمة العمل الجماعي والانتماء الوطني.")]},

O("ما معنى «يحرز»؟ وما مضاد «النضر»؟","يحرز: يكتسب ويحقق. مضاد «النضر»: الذابل أو المذموم."),
O("حدد العلاقة بين البيت الثاني وما قبله.","توضيح وتفسير وتأكيد."),
O("ما الشرط الذي يتوقف عليه تحصيل النفع من العلم؟","اقترانه بحسن الخلق وتهذيب الطبع الشرير.")]},
{t:"السؤال الثالث (الكتابة)",ref:"اكتب فقرة من (٧ - ١٠) أسطر بعنوان: «الهندسة الوراثية: تقدم علمي أم عبث بالحياة؟» مراعيًا: التمهيد – الاستدلال بمثال علمي أو تاريخي – الخاتمة.",qs:[
O("اكتب الفقرة.","خطت الهندسة الوراثية خطوات واسعة في تغيير الجينات البشرية والحيوانية، مما فتح باباً واسعاً للجدل حول حدود العبث بالحقائق الحيوية للطبيعة. فالقدرة على تعديل الشفرة الوراثية تمنح العلماء قوة هائلة لعلاج الأمراض المستعصية، لكنها في الوقت ذاته تنطوي على مخاطر التلاعب بالخصائص البشرية وإنتاج كائنات معدلة لاسيطرة عليها، كتلك الممارسات التي أثيرت خلال التجارب المعملية السابقة. ومن هنا، تبرز الحاجة الملحة لوقفة أخلاقية صارمة تفصل بين الطموح العلمي المشروع والعبث بالبنوك الوراثية الحيوية. وخلاصة القول إن العلم بلا ضمير مرشد يتحول إلى كارثة تقوض الوجود الإنساني ذاته.")]}]},
{t:"المجموعة (ج)",acts:[
{t:"السؤال الأول (عودة الروح)",ref:"من روائع الأدب (عودة الروح): اقرأ ثم أجب:",qs:[
O("في رأيك، هل كان نفي الزعيم سعد زغلول هو السبب الوحيد الذي حرّك جموع الشعب المصري في الرواية، أم أنه كان «الشرارة» التي فجرت مخزونًا كامنًا من كرامة الشعب ووعيه؟","لم يكن السبب الوحيد، بل كان بمثابة «الشرارة» التي فجرت مخزونًا هائلًا كامنًا من كرامة الشعب المصري ووعيه الوطني.")]},
{t:"السؤال الثاني (العلم نور)",ref:"اقرأ الأبيات التالية، ثم أجب:\n"+V3.replace(/\\n/g,"\n"),qs:[
O("حدد المراد بقول الشاعر: «فلا تستنفعوا التعليم».","عدم جني الفائدة الحقيقية أو الثمرة المرجوة من العلم والتعليم ما لم يقترن بتهذيب النفوس والأخلاق."),
O("اعتمد الشاعر على الشرط والاستدراك في توضيح فكرته. وضّح ذلك.","الشرط: ظهر في استخدام أداة الشرط (إذا) لربط الانتفاع بالتعليم بشرط تهذيب الطبع والطباع السيئة.\nالاستدراك: ظهر في استخدام أداة الاستدراك (لكن) لتأكيد المعنى وتصحيح الفكرة المرتبطة بفوز الإنسان الحقيقي من خلال سلامة الضمير والأخلاق."),
O("ما القيمة الفنية لقول الشاعر: «هذبتم الطبع الشريرا»؟","توحي بضرورة تقويم النفس البشرية وإصلاحها وتطهيرها من الشر والصفات الذميمة، مما يبرز دور الأخلاق في توجيه العلم نحو الخير.")]},
{t:"السؤال الثالث (الكتابة)",ref:"اكتب فقرة من (٧ - ١٠) أسطر بعنوان: «ماذا يحدث عندما تنفصل المعرفة عن الأخلاق؟» مراعيًا: التمهيد – تقديم مثال – الخاتمة.",qs:[
O("اكتب الفقرة.","شهد تاريخ البشرية محطات فارقة تحول فيها العلم من نعمة لخدمة الإنسان إلى نقمة تهدد وجوده حين تجردت المعرفة من الضمير الأخلاقي. فاستغلال الفيزياء المجردة في شق الذرة أسفر تاريخياً عن دمار هيروشيما وناجازاكي، مما يثبت أن الابتكار العلمي بمعزل عن القيم الإنسانية يتحول إلى أداة إبادة. وخير مثال على ذلك الأبحاث المتسارعة التي تتجاهل البعد البيئي والإنساني سعياً خلف المجد المادي المحض. لذا فإن الفوز الحقيقي لا يقاس بغزارة العلوم وتراكم المعارف البحتة، بل بسلامة الضمير ونبل الغاية التي توظف من أجلها تلك المعارف لخير البشرية جمعاء.")]}]}]}
];

const W4=[
{t:"هيا نتحدث ونكتب",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١ (تحدّث)",ref:"تحدّث أمام زملائك عن المقولة التالية: «الذكاء الاصطناعي والتكنولوجيا الحديثة بلا ضمير إنساني قد يهددان مستقبل البشرية». أثناء الإلقاء حاول أن: تبدأ بفكرة واضحة – تستشهد بالبيت الدال على ارتباط العلم بالأخلاق – تذكر مثالًا واقعيًّا من العصر الرقمي – تختم برأيك وموقفك.",qs:[
O("تحدّث عن المقولة مراعيًا العناصر السابقة.","الفكرة الواضحة: العلم والتكنولوجيا سلاحان ذوا حدين، وبدون بوصلة أخلاقية يمكن أن يتحولا من أدوات لرفاهية الإنسان إلى مهددات لوجوده.\nالاستشهاد الشعري: «فإن عماد بيت المجد خلق ... حكى في أنف ناشقه العبيرا».\nمثال واقعي من العصر الرقمي: إساءة استخدام تقنيات «التزييف العميق» (Deepfakes) في فبركة مقاطع فيديو وصور لشخصيات عامة، مما يؤدي إلى نشر الشائعات وتدمير السمعة لغياب الضمير الأخلاقي لدى مستخدميها.\nالرأي والموقف: أرى أن التقدم التقني يجب أن يظل مقيدًا بمنظومة قيمية وأخلاقية صارمة تضمن توجيه الابتكارات لخدمة البشرية وحمايتها لا لتدميرها.")]},
{t:"نشاط ٢ (كلمة في حفل)",ref:"تخيّل أنك تلقي كلمة في «حفل تكريم المتفوقين» بالمدرسة، وطُلب منك توجيه رسالة لهم ترتكز على قول الشاعر: «فإن عماد بيت المجد خلق ... حكى في أنف ناشقه العبيرا».",qs:[
O("كيف تصوغ كلمتك لتجمع بين إظهار الفخر بذكائهم وحثهم على التواضع؟","صياغة الكلمة: «أبنائي وبناتي المتفوقون، نلتقي اليوم لنحتفي بثمار جهودكم وعقولكم المضيئة، ونحن نشعر ببالغ الفخر والاعتزاز بكم. لكن تذكروا دائمًا أن النجاح الحقيقي والرفعة الحقيقية لا تكتملان إلا بالتواضع والأخلاق الفاضلة؛ وكما قيل: «فإن عماد بيت المجد خلق ... حكى في أنف ناشقه العبيرا». فاجعلوا تواضعكم عبيرًا يفوح مع كل إنجاز، لتكونوا قناديل علم ونفع لأمتكم ومجتمعكم.»")]},
{t:"نشاط ٣ (رسالة)",ref:"اكتب رسالة في ثلاثة أسطر لطلاب العلم في عصر التقنية، توضح فيها دور الضمير والأخلاق في توجيه المعرفة وفق رؤية الشاعر في قصيدة (العلم نور).",qs:[
O("اكتب الرسالة.","نص الرسالة: «يا طلاب العلم في عصر التقنية المتسارعة، إن المعرفة وحدها لا تكفي ما لم يزينها الضمير الحي. اجعلوا أخلاقكم قائدًا لعقولكم، وسخّروا ابتكاراتكم لخدمة ونشر الخير والسلام في العالم.»")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط",ref:"اكتب فقرة من (٨ إلى ١٠) أسطر بعنوان: «مسئولية العلماء والمخترعين في عصرنا الحاضر» مراعيًا ما يلي: تمهيدًا يبيّن خطورة التطور العلمي السريع – بيان العلاقة الوثيقة بين الابتكار العلمي والالتزام الأخلاقي – الاستشهاد بالبيت الأخير من القصيدة – خاتمة تتضمن توصية موجزة لجيل المستقبل.",qs:[
O("اكتب الفقرة.","النص المقترح: يشهد عصرنا الحالي تطورًا علميًّا متسارعًا ومذهلًا، يحمل في طياته إنجازات عظيمة، لكنه يخفي في المقابل أخطارًا جسيمة إن غابت عنه البوصلة الأخلاقية. إن التسابق التقني المحموم قد يجرّ على البشرية ويلات إن لم يُقيَّد بضوابط إنسانية رصينة. ومن هنا تبرز العلاقة الوثيقة والراسخة بين الابتكار العلمي والالتزام الأخلاقي؛ فالعلم الغزير يحتاج دومًا إلى ضمير حي يوجهه نحو البناء لا الدمار. وقد أجاد الشاعر حين أكد على أزلية هذا الارتباط بقوله: «فإن عماد بيت المجد خلق ... حكى في أنف ناشقه العبيرا»، لتبقى مكارم الأخلاق هي السياج الحقيقي لأي حضارة ناجحة. وفي الختام، أوصي جيل المستقبل من العلماء والمخترعين بأن يجعلوا تقوى الله وخدمة الإنسانية غايتهم الأولى قبل كل إنجاز مادي أو تقني.")]}]}]},
{t:"هيا نوظف لغتنا الجميلة",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١",ref:"أجب عما يأتي:",qs:[
O("اقرأ البيت التالي، ثم أعرب ما تحته خط (الماضين – التجاريب):\n«وَلَسْتُ بِأَكْثَرِ [المَاضِينَ] عِلْمًا ... وَلَكِنَّنِي تَعَلَّمْتُ [التَّجَارِيبَ]»","الماضين: مضاف إليه مجرور وعلامة جره الياء لأنه جمع مذكر سالم.\nالتجاريب: مفعول به منصوب وعلامة نصبه الفتحة الظاهرة."),
O("كوّن جملًا من إنشائك توظّف فيها الأسماء الآتية توظيفًا صحيحًا، ثم حدّد علامة إعرابها: «أخو — أباك — ذي».","«حضر أخو محمد الحفل.» أخو: علامة الإعراب الواو لأنه مرفوع.\n«إن أباك رجل حكيم.» أباك: علامة الإعراب الألف لأنه منصوب.\n«استمع إلى نصيحة ذي الخبرة.» ذي: علامة الإعراب الياء لأنه مجرور.")]},

O("في قول الشاعر: «لا تمدحنَّ امرأً حتى تجرّبه ... ولا تذمنَّه من غير تجريبِ»: هل الأسلوب يحمل توجيهًا أم تحذيرًا؟ وكيف يخدم هذا الأسلوب فكرة (التأني في الحكم على الناس)؟","يحمل توجيهًا وإرشادًا وتحذيرًا من التسرع. ويخدم فكرة التأني بحثّه على التريث وعدم إصدار الأحكام العاطفية المسبقة مدحًا أو ذمًّا إلا بعد التجربة والخبرة، مما يرسخ الحكمة والتعقل.")]},

O("اكتب الأسئلة والإجابة والجملة الختامية.","السؤالان: ١) ما الدور العظيم الذي يلعبه المعلم في المجتمع مقارنة بغيره؟ ٢) كيف صوّر أحمد شوقي سمو رسالة المعلم؟\nالإجابة المتخيلة: يرى شوقي أن المعلم يكاد يكون رسولًا في طهره ورسالته؛ لأنه ينير عقول الأجيال ويخرجهم من ظلمات الجهل.\nالجملة الختامية: موقف وفائي عظيم يرفع قدر العلم والمعلم ويضعهما في مكانة الصدارة لبناء الأمم.")]}]},

O("اكتب الأسئلة والإجابة والجملة الختامية.","السؤالان: ١) ما العلاقة بين بقاء الأمم وصلاح أخلاقها في نظر حافظ إبراهيم؟ ٢) كيف تؤثر الأخلاق في تماسك المجتمع؟\nالإجابة المتخيلة: يرى أن الأخلاق هي عصب بقاء الأمم، فإذا ذهبت أخلاق الشعب ذهب بأسهم وكيانهم.\nالجملة الختامية: حكمة خالصة تؤكد أن الانهيار القيمي هو بداية السقوط الحضاري لأي أمة.")]}]}]},

O("اقرأ البيت التالي، ثم أعرب كلمتي (أعلى – رتبة):\n«العِلْمُ أَعْلَى رُتْبَةً بَيْنَ الوَرَى ... مِنْ كُلِّ مَنْ يَسْعَى لِجَمْعِ حُطَامِ»","أعلى: خبر المبتدأ مرفوع وعلامة رفعه الضمة المقدرة على الألف للتعذر.\nرتبةً: تمييز منصوب وعلامة نصبه الفتحة الظاهرة."),
O("كوّن جملًا من إنشائك توظّف فيها الأسماء الخمسة توظيفًا صحيحًا تعكس أهمية «بر الوالدين والأهل».","«أطع أباك وأخاك، وصِلْ ذا رحمك، ولا تقصّر في بر والديك.»")]},
{t:"السؤال الثاني (الكتابة)",ref:"اكتب فقرة من (٧ - ١٠) أسطر بعنوان «هل تبنى الحضارات بالمال وحده؟» مراعيًا ما يلي: تمهيدًا قصيرًا يوضح فكرتك – بيان العلاقة بين الثراء المادي والأخلاق الفاضلة – مثالًا من الواقع أو التاريخ – جملة ختامية تلخص موقفك.",qs:[
O("اكتب الفقرة.","«تعد الحضارات الإنسانية بناءً شامخاً يتساءل الكثيرون عما إذا كان المال وحده كافياً لتشييد دعائمها الراسخة. والحق أن الثراء المادي وحده لا يمنح الأمم استقراراً ولا بقاءً ما لم يقترن بالأخلاق الفاضلة والقيم الروحية السامية. فالمال وسيلة للبناء العمراني، بينما الأخلاق هي الروح التي توجهه لخدمة الإنسانية. ويشهد التاريخ على أمم امتلكت الأموال، لكن تجردها من الأخلاق أدى إلى انهيارها. ومن ثم، فإن التوازن بين القوة المادية والسمو الأخلاقي هو الشرط الحتمي لبناء حضارة مستدامة تكفل للبشرية السلام.»")]},

O("اقرأ البيت التالي، ثم أعرب كلمتي (ذا – الماء):\n«وَمَنْ يَكُ ذَا فَمٍ مُرٍّ مَرِيضٍ ... يَجِدْ مُرًّا بِهِ المَاءَ الزُّلَالَا»","ذا: خبر (يك) منصوب وعلامة نصبه الألف لأنه من الأسماء الخمسة.\nالماء: مفعول به أول منصوب وعلامة نصبه الفتحة الظاهرة."),
O("كوّن جملًا من إنشائك توظّف فيها الأسماء الخمسة توظيفًا صحيحًا تتحدث عن «طلب العلم ومجالسة العلماء».","«احرص على مجالسة ذي العلم، واقبل نصيحة أبيك، وانطق دائمًا بالحق.»")]},
{t:"السؤال الثاني (الكتابة)",ref:"اكتب فقرة من (٧ - ١٠) أسطر بعنوان «المعلم صانع الأجيال والعقول» مراعيًا ما يلي: تمهيدًا قصيرًا يبرز مكانة المعلم ورسالته – بيان أثر المعلم في توجيه الشباب نحو البناء – بيت شعر أو حكمة تؤيد فكرتك – جملة ختامية تلخص رأيك.",qs:[
O("اكتب الفقرة.","«يحتل المعلم مكانة سامقة ورسالة مقدسة في قلب كل مجتمع حي، فهو الشعلة التي تبدد ظلمات الجهل. ويمتد أثره العظيم إلى توجيه طاقات الشباب نحو البناء والتطوير وحمايتهم من الأفكار الهدامة. وكما قال الشاعر أحمد شوقي: \"قُم للمعلّم وفّه التبجيلا كاد المعلم أن يكون رسولا\". ومن هذا المنطلق، فإن واجب المجتمع بأسره يكمن في إجلال المعلم وتقدير جهوده العظيمة ليستمر في عطائه.»")]},

{t:"السؤال الثاني (الكتابة)",ref:"اكتب فقرة من (٧ - ١٠) أسطر بعنوان «وخير جليس في الزمان كتاب» مراعيًا ما يلي: أ- تمهيدًا قصيرًا يوضح أهمية القراءة والمطالعة. ب- بيان أثر الثقافة والوعي في حماية الفرد من الأفكار الهدامة. ج- مقارنة سريعة بين الشخص القارئ والشخص الجاهل. د- جملة ختامية تلخص نصيحتك لزملائك.",qs:[
O("اكتب الفقرة.","«تعتبر القراءة النافذة التي تطل منها الروح على عوالم المعرفة، والكتاب هو خير جليس للإنسان. ومن خلال الثقافة والوعي، يُحصّن الفرد عقله ويحمي نفسه من الانزلاق وراء الأفكار الهدامة. فالشخص القارئ تتمتع بصيرته بالعمق، على عكس الشخص الجاهل الذي ينساق أعمى خلف الشائعات. وفي الختام، أدعو زملائي لجعل الكتاب رفيقاً دائماً لهم فهو طريق النهضة والارتقاء.»")]},

const V4="«فَإِنَّ عِمَادَ بَيْتِ المَجْدِ خُلْقٌ ... حَكَى فِي أَنْفِ نَاشِقِهِ العَبِيرَا\nفَلاَ تَسْتَنْفِعُوا التَّعْلِيمَ إِلاَّ ... إِذَا هَذَّبْتُمُ الطَّبْعَ الشِّرِّيرَا\nإِذَا مَا العِلْمُ لَابَسَ حُسْنَ خُلْقٍ ... فَرَجِّ لِأَهْلِهِ خَيْرًا كَثِيرَا\nوَمَا إِنْ فَازَ أَغْزَرُنَا عُلُومًا ... وَلَكِنْ فَازَ أَسْلَمُنَا ضَمِيرَا»";
const W5=[
{t:"كفاح طيبة",f:[
{t:"الأداءات الصفية",acts:[
{t:"نشاط ١",ref:"من روائع الأدب (كفاح طيبة):",qs:[
O("وازن بين رؤية جمال الغيطاني ونجيب محفوظ لعلاقة الفرد بالوطن في: (حكايات الغريب) و(كفاح طيبة).","كلاهما عالج علاقة الفرد بالأمة؛ حيث تبرز رواية «حكايات الغريب» دور الفرد العادي في الأزمات (عبد الرحمن السائق) والوطن، بينما تعالج «كفاح طيبة» الكفاح الجماعي للشعب المصري ضد المحتل الهكسوسي بقيادة ملوكهم (سقنن رع وأحمس).")]},
{t:"نشاط ٢",ref:"قارن بين تطور شخصية البطل في روايتي (كفاح طيبة) و(عودة الروح)، موضحًا التشابه والاختلاف في مصر كل منهما.",qs:[
O("اكتب المقارنة.","في «كفاح طيبة» يتطور أحمس ليقود جيش التحرير كبطل قومي، بينما في «عودة الروح» يتحول محسن من العزلة إلى الاندماج مع الأمة أثناء ثورة ١٩١٩.\nالتشابه: اندماج الفرد في الهم الجماعي.\nالاختلاف: في طبيعة الدور (قائد عسكري مقابل فرد شعبي).")]}]},
{t:"الأداءات المنزلية",acts:[
{t:"نشاط",ref:"«لعل الإنسان يستطيع أن يصبر على ضيق العيش، ولكنه يجد الصبر أصعب حين يتعلق الأمر بكرامته».",qs:[
O("وضّح كيف تحقق هذا الأمر في موقف «سقنن رع» من الهكسوس في رواية «كفاح طيبة» لنجيب محفوظ؟","رفض الملك سقنن رع رسالة أبوفيس المهينة التي طالبته بقتل أفراس النهر، واعتبر ذلك مساسًا بالسيادة والكرامة القومية، مفضلًا المواجهة والموت بشرف.")]}]}]},
{t:"مراجعة على الوحدة الأولى",f:[
{t:"الأداءات الصفية",acts:[
{t:"السؤال الأول (نص متحرر)",ref:"اقرأ النص التالي قراءة متأنية، ثم أجب: «شهد العالم في السنوات الأخيرة تطورًا علميًّا متلاحقًا أسهم في تحسن حياة الإنسان في مجالات الطب والصناعة والاتصالات. ومع هذا التطور ظهرت قضايا أخلاقية معقدة تتعلق بكيفية استخدام المنجزات العلمية؛ إذ قد يسمح القانون ببعض التطبيقات العلمية ما دامت تستوفي الشروط الرسمية، غير أن الضمير الإنساني قد يفرض حدودًا إضافية تحمي كرامة الإنسان وحقوقه؛ لذلك يرى كثير من المفكرين أن المسئولية العلمية لا تقتصر على الالتزام بالقانون فحسب، بل تمتد إلى مراعاة الآثار الاجتماعية والأخلاقية المترتبة على القرارات العلمية. فالعلم الذي ينفصل عن القيم قد يتحول إلى أداة للإضرار بالمجتمعات بدلًا من خدمتها.»",qs:[
M("حدد الفكرة الرئيسة التي يدور حولها النص السابق:",["أهمية التوازن بين الالتزام بالقانون والضمير في توظيف العلم.","التطور العلمي أدى إلى الاستغناء عن القيم الأخلاقية.","تفوق القوانين على الضمير في تنظيم البحث العلمي.","الآثار الاقتصادية للتقدم العلمي في حياة الإنسان."],0,"النص يؤكد أن المسئولية العلمية تجمع بين القانون والضمير."),
M("ما طبيعة القضية المحورية التي يعالجها النص السابق؟",["قضية اقتصادية.","قضية علمية.","قضية أخلاقية.","قضية تاريخية."],2,"القضية المحورية أخلاقية."),
O("استنتج المقصود بكلمة (الضمير) في سياقها الفكري في الفقرة السابقة، ثم ضعها في جملة من إنشائك.","المقصود: الوازع الأخلاقي والوجدان الإنساني.\nالجملة: «الضمير الحي هو الرقيب الحقيقي على تصرفات الإنسان.»"),
O("بيّن العلاقة بين الفكرة الرئيسة والأفكار الفرعية في النص.","علاقة شمول وتكامل؛ فالقضايا الفرعية تدعم وتفسّر ضرورة التوازن بين العلم والقيم."),
O("«فاز أخي ذو الضمير الحي فأسعد بفوزه أبي». خاطب بالعبارة السابقة المفرد المذكر وغيّر ما يلزم.","«فاز أخوك ذو الضمير الحي فأسعد بفوزه أبوك.»"),
O("«أخواك كلاهما ذو حكمة». علّل: لماذا كانت الألف علامة رفع كلمة (أخواك) والواو علامة رفع كلمة (ذو)؟","لأن (أخواك) مثنى يُعرب بالألف، بينما (ذو) من الأسماء الخمسة وتُرفع بالواو."),
O("«أبي ذو حكمة، وأخي يتبع خطاه، فلا ينطق بفمه سوى الصواب». ميّز في العبارة السابقة اسمًا من الأسماء الخمسة.","ذو. (أما «فمه» فلم يتحقق شرطه لوجود الميم، و«أبي» مضافة لياء المتكلم.)")]},
{t:"السؤال الثاني (الخلق جوهر الفضيلة)",ref:"اقرأ من نص (الخلق جوهر الفضيلة): «الخلق هو الصرخة …» إلى «…أو العبث بكرامة قومه»، ثم أجب:",qs:[
M("استنتج المفهوم الدلالي لكلمة (يواسيه) وفق سياقها الوارد في الفقرة:",["يعاقبه ويوبخه.","يصبّره ويخفف عنه.","يتركه ويتجاهله.","يحسده ويراقبه."],1,"«يواسيه» أي يصبّره ويخفف عنه."),
O("رتّب تدرج الكاتب من مشاعر الفرد إلى واجبه القومي في فكرتين فقط، ثم بيّن في سطر واحد أثر ذلك في اتساع مفهوم «الخلق».","بدأ بالمشاعر الفردية كالرحمة بالبائس، ثم تدرج إلى المواقف العامة كالدفاع عن الوطن؛ مما يوسّع مدارك القارئ ليشمل الخلق الضمير والواجب القومي."),
O("وضّح الصورة البيانية في قوله: «الخلق هو الصرخة»، ثم وضّح القيمة الدلالية لتوظيف الكاتب كلمة (الصرخة) بدلًا من كلمات أخرى مثل (القول) أو (الاعتراض).","تشبيه بليغ. وتوحي «الصرخة» بالقوة والرفض الحاسم للظلم، بخلاف «القول» أو «الاعتراض»."),
O("استخرج من الفقرة أسلوبًا خبريًّا وبيّن أثره في المعنى.","«الخلق هو الصرخة…»: أسلوب خبري غرضه التقرير والتأكيد.")]},

{t:"السؤال الخامس (كتابة وإملاء)",ref:"أجب عما يأتي:",qs:[
O("اكتب فقرة حجاجية متماسكة ومنظمة لا تقل عن عشرة أسطر، تناقش فيها القضية: «هل أسهم الاعتماد على الذكاء الاصطناعي في تيسير حياة البشر وتطويرها؟ أم أنه هدد إبداعهم وسلبهم وظائفهم؟». استوفِ: أ- التمهيد. ب- حجة الاتجاه الأول. ج- حجة الاتجاه الثاني. د- التوفيق بين الجانبين.","إجابة استرشادية:\nالتمهيد: يثير الذكاء الاصطناعي جدلًا واسعًا بين من يراه أداة لتيسير الحياة ومن يخشاه تهديدًا للإبداع والوظائف.\nحجة الاتجاه الأول: سهّل العمل في الطب والتعليم والصناعة، وسرّع إنجاز المهام وقلّل الأخطاء.\nحجة الاتجاه الثاني: يهدد بعض الوظائف التقليدية ويضعف الإبداع البشري إذا اعتُمد عليه دون وعي.\nالتوفيق: الحل في توظيفه أداةً مساعدةً تحت ضوابط أخلاقية، مع تأهيل الإنسان لمهارات تتجاوز قدرة الآلة."),
O("اكتشف الكلمة المكتوبة خطأ في كل مجموعة، وصوّبها:\nأ- (رمى – خطى – بني)\nب- (دنى – كفى – مضى)\nج- (اهتدا – استولى – أحيا)","أ) بني ← بنى؛ لأن الألف اللينة في آخر الفعل تُكتب (ى) بلا نقط.\nب) دنى ← دنا.\nج) اهتدا ← اهتدى."),

const PT1="«إن صناعة القناعات في العصر الرقمي لا تقوم على الإكراه الصريح، بل على التوجيه الذكي، والانتقاء الدقيق، والتكرار المستمر. وقد أصبحت الكلمة الرقمية قادرة على تشكيل اتجاهات جماعية في زمن قياسي.»";
const PT2="اقرأ ثم أجب: «أضحت التكنولوجيا عصب العصر الرقمي، والموجّه الأول لتشكيل وعي الفرد وتحديد اتجاهاته نحو ذاته ونحو مجتمعه المحيط به. فعلى الصعيد الشخصي، تفتح التقنيات الحديثة لشبابنا آفاقًا رحبة لتقدير الذات، واكتشاف المواهب الكامنة، وبناء الهوية المعرفية المستقلة. غير أنها سلاح ذو حدين؛ إذ قد تُسقط الطالب في فخ المقارنات الاجتماعية الزائفة عبر منصات التواصل الاجتماعي، مما يولّد شعورًا بالإحباط السريع وزعزعة الثقة بالنفس والقدرات الذاتية. أما على الصعيد المجتمعي والعلاقات مع الآخرين، فقد أعادت التكنولوجيا هندسة الروابط الإنسانية بشكل كامل؛ إذ مدّت جسورًا رقمية تذيب كافة المسافات الجغرافية وتتيح تبادل الثقافات بمرونة فائقة. لكن هذا الفضاء الافتراضي الشاسع يهدد أحيانًا عمق العلاقات الوجدانية، ويستبدل الدفء الأسري والتواصل الاجتماعي المباشر بعزلة اختيارية خلف تلك الشاشات الإلكترونية الجافة. لذا، يواجه الشباب تحديًا حقيقيًّا يتطلب امتلاك وعي نقدي حذر. إن حسن إدارة الوجود الرقمي يضمن صون الهوية والشخصية، ويحوّل التكنولوجيا من أداة للاغتراب النفسي إلى وسيلة نهوض بالذات وتعميق الروابط الحقيقية.»";
const MAIN2=(o,a)=>M("أي العبارات الآتية تعبر عن «الفكرة الرئيسة» للنص؟",o,a,"الفكرة الرئيسة للنص هي هذه الإجابة.");

M("تشكيل الوعي الرقمي داخل الفضاء الرقمي يتمثل في:",["تحول الكلمة إلى أداة ترفيهية تزيد من الاستخدام اليومي.","قدرة الكلمة على الوصول إلى ملايين البشر في لحظات معدودة.","إعادة توظيف الخوارزميات للكلمة لتوجيه وعي المجتمع.","تعزيز الحوار الفكري وتبادل الأفكار المتنوعة."],2,"تحوّلت الكلمة من وسيلة تعبير إلى أداة لتشكيل الوعي عبر إعادة توظيف الخوارزميات لها."),
M("الغرض من استخدام الكاتب لثنائية (الماضي التفاعلي المباشر / الحاضر الرقمي الخوارزمي):",["إثبات عدم جدوى النقاش المباشر في تشكيل الوعي قديمًا.","إبراز تحوّل الوعي نحو التبعية للفضاء الرقمي.","إقناع القارئ بالعودة التدريجية لأساليب التواصل القديمة.","توضيح أن تشكيل الوعي عملية حتمية لا تتأثر بنوع الأداة المستخدمة."],1,"الثنائية تبرز التحول الشعوري بالتبعية المعرفية تجاه الفضاء الرقمي."),
O("ما علاقة عبارة «تحدّدُ ما نراهُ، ونتجاهلُهُ» بما قبلها؟","توضيح وتفصيل."),
O("وضّح بالدليل أثر الفضاء الرقمي في تحويل الوعي الجمعي من الاختيار الحر إلى التوجيه المصنوع.","بالانتقال من التفاعل البشري التلقائي إلى التوجيه الخوارزمي المبرمج الذي يعرض محتوى مخصصًا يوجّه وعي المستخدم.")]},
{t:"نشاط ٢ (نص متحرر)",ref:"اقرأ الفقرة الآتية ثم أجب: «تُعدّ التقنية الحديثة، وبخاصة منصات التواصل الاجتماعي، المحرّك الأبرز في تشكيل الرأي العام اليوم. فلم تعد مجرد وسائل للترفيه، بل أدوات توجيهية قوية تصوغ فكر المجتمعات وتوجهاتها عبر خوارزميات ذكية؛ حيث يتم تحليل اهتمامات المستخدمين وتقديم محتوى مخصص يوجّه فكرهم نحو قضايا معينة، وهذا الانتشار السريع للمعلومات يضاعف خطورة الشائعات، مما يجعل الوعي الرقمي والتفكير النقدي ضرورة حتمية للمستخدمين؛ لتمييز الحقائق وتجنب الانقياد الأعمى؛ ليصبحوا صنّاع قرار واعين.»",qs:[

O("هل معالجة الكاتب لقضية تأثير التقنية في تشكيل الرأي العام «متوازنة أم منحازة»؟ ولماذا؟","متوازنة؛ لأنه لم يرفض التقنية بالمطلق، بل حذّر من سلبياتها مؤكدًا ضرورة التفكير النقدي."),

O("ناقش القيمة الدلالية لاختيار الكاتب لفظ «فضاء رقمي» بدلًا من «بيئة رقمية»، وكيف يخدم هذا الاختيار فكرة السيطرة غير المرئية؟","لفظ «فضاء» يوحي بالاتساع والعمق الخفي، مما يخدم فكرة السيطرة غير المرئية على العقول."),
O("تخيّل سيناريو ينهار فيه «الفضاء الرقمي المحكوم خوارزميًّا» فجأة. اكتب فقرة تفسّر فيها كيف سيعيد المجتمع بناء وعيه الجمعي وصناعة رأيه العام في ظل غياب هذه «القوة غير المرئية».","إجابة استرشادية: سيعود المجتمع إلى التواصل البشري المباشر، فتتشكل القناعات عبر الحوار وتبادل الخبرات وجهًا لوجه، ويستعيد الأفراد حرية الاختيار بدلًا من التوجيه المصنوع، ويصبح الرأي العام نتاج نقاش حقيقي لا محتوى مفروضًا."),
O("ردّ ناقدًا على فكرة أن منصات التواصل مرآة ناقلة للواقع بكل حرية.","المنصات ليست مرآة سلبية، بل فاعل نشط يوجّه الاهتمامات ويصنع «الترندات» عبر خوارزمياتها.")]}]}]},
